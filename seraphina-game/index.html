<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;background:#10131f;color:#fff;overflow:hidden}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;background:#000;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.6)}

#menu button{background:rgba(16,20,40,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700;min-width:64px;cursor:pointer;backdrop-filter:blur(3px)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

#choices button{background:rgba(255,252,240,.97);color:#33302a;border:none;border-radius:14px;padding:17px 14px;font-size:16px;font-weight:700;line-height:1.5;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);min-height:60px}

#title button{width:100%;max-width:320px;margin-top:12px;padding:15px;border:none;border-radius:99px;font-size:16.5px;font-weight:800;cursor:pointer;min-height:54px}
#btnStart{background:linear-gradient(90deg,#ffd76e,#ffb3d9);color:#4a2c00}

.slot{width:100%;text-align:left;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:14px;line-height:1.55;cursor:pointer;min-height:56px}
.slot small{color:#bcd0ff}
#loglist{font-size:14.5px;line-height:1.8}

#hud .sub{gap:10px;flex-wrap:wrap}
.free{position:absolute;inset:0;z-index:18;display:none;background:linear-gradient(to bottom,rgba(7,9,22,.72),rgba(7,9,22,.94));padding:calc(62px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
.freehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px;text-shadow:0 2px 5px #000}
.freetitle{font-size:21px;font-weight:900;color:#ffe9a8}.freesub{font-size:12.5px;color:#dfe8ff;margin-top:2px}.freestats{font-size:12.5px;text-align:right;line-height:1.55;color:#fff;white-space:nowrap}.freenotice{background:rgba(255,215,110,.18);border:1px solid rgba(255,215,110,.55);border-radius:12px;padding:9px 11px;font-size:13.5px;margin-bottom:10px}

.freecard h3{font-size:18px;color:#ffe9a8;margin-bottom:9px}.freecard p{font-size:14.5px;line-height:1.75;margin-bottom:10px}.freecard .effect{color:#ffd9ec;font-weight:700}.destlabel{font-size:12px;color:#bcd0ff;font-weight:800;margin-bottom:5px}
.destgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.destbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:14px;padding:13px;text-align:left;cursor:pointer;min-height:74px}.destbtn b{display:block;font-size:16px;margin-bottom:4px}.destbtn span{font-size:12px;color:#dfe8ff;line-height:1.45}
.fbtn{display:block;width:100%;background:rgba(255,252,240,.96);color:#332d24;border:none;border-radius:12px;padding:13px 14px;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:9px;min-height:48px}.fbtn.main{background:linear-gradient(90deg,#ffd76e,#ffb3d9);color:#4a2c00}.fbtn:disabled{opacity:.45;cursor:not-allowed}.sysbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.sysbtns .fbtn{font-size:12.5px;padding:10px 6px}.optbtns{margin-top:12px}
.itemgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.itemcard{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:10px;overflow:hidden}.itemcard img{width:100%;height:92px;object-fit:cover;border-radius:9px;margin-bottom:7px}.itemcard p{font-size:12.5px;line-height:1.6}.itemcard.locked img{filter:grayscale(1) brightness(.28)}.itemname{font-weight:900;font-size:14.5px;line-height:1.4;margin-bottom:5px}.colnote{font-size:13px;line-height:1.65;color:#dfe8ff;margin-bottom:10px}.coltabs{display:flex;gap:7px;margin-bottom:12px}.coltabs button{flex:1;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:10px 5px;font-weight:800;cursor:pointer}.coltabs button.on{background:#ffd76e;color:#442c00;border-color:#ffd76e}
.cranetrack{position:relative;height:34px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:99px;margin:16px 0;overflow:hidden}.cranezone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:rgba(255,215,110,.55)}.cranemarker{position:absolute;top:3px;bottom:3px;left:0;width:5px;margin-left:-2px;background:#fff;border-radius:99px;box-shadow:0 0 8px #fff}
@media(max-width:380px){.destgrid,.itemgrid{grid-template-columns:1fr}.sysbtns{grid-template-columns:1fr}}
</style>

<h1>セラフィナ</h1>
<div class="subt">― 全章版 ―<br>序章「フィレンツェの天使」＋ 第1章「降臨」＋ 第2章「日本橋どっぷり」＋ 第3章「ライバル降臨」＋ 第4章「日本の四季」＋ 第5章「癒しの仕事」＋ 第6章「日本の生活者」＋ 第7章「先輩視察」＋ 第8章「神仏ご近所」＋ 最終章「帰還と選択」</div>

<script>
"use strict";
const SCENES = {"p0":{"bg":"02-florence","next":"p1","lines":[["","1500年ごろ。イタリア、フィレンツェ。赤い屋根の上に、朝の光がゆっくりと広がっていく。"],["","大聖堂の鐘が鳴ると、市場には焼きたてのパンの香りと、職人たちの元気な話し声があふれた。"],["セラフィナ","おはようございます。今日も、いい天気になりそうですね"],["","見習い天使セラフィナの仕事は、目立たない場所で、疲れた人のそばにいることだった。"],["","重い石材を運ぶ職人の肩にそっと手を置けば、不思議と荷が軽くなる。絵筆を持つ手が震える若い画家のそばに立てば、震えが少しずつ収まっていく。"],["セラフィナ","がんばりすぎなくて、大丈夫ですよ。ほら、深呼吸。……ね、少し楽になったでしょう"],["","誰も、天使がそばにいたことには気づかない。それでいいのだと、セラフィナはいつも思っていた。"],["","昼には市場で荷運びを手伝い、夕方には教会の階段でうたた寝する老人に、そっと毛布のような温かさを置いていく。"],["セラフィナ","お礼は要りませんよ。わたしは、ただの通りすがりですから"]]},"p1":{"bg":"02-florence","next":"p2","lines":[["","セラフィナに大げさな力はない。ただ、疲れた人に、とても敏感だった。"],["","誰かが小さくため息をつくと、背中の羽根がふるっと震える。放っておけなくて、つい近づいてしまうのだ。"],["ガブリエラ","セラフィナ。よくやってるみたいね"],["セラフィナ","ガブリエラ先輩！　えへへ、見ていてくれたんですか"],["ガブリエラ","ええ。だからこそ、次の大きな任務は、あなたに任せたいの"],["","先輩天使ガブリエラが差し出した封筒には、見たことのない形の文字と、聞いたことのない地名が、丁寧に書かれていた。"],["セラフィナ","わたしが、大きな任務……？　本当に、わたしでいいんですか"],["ガブリエラ","あなただから、よ。疲れた人を見つける力は、天界でも随一なんですから"],["","セラフィナは封筒を両手で受け取って、何度も小さく頷いた。羽根が、緊張と誇りで小さく震えていた。"]]},"p2":{"bg":"02-florence","next":"sys_intro","lines":[["ガブリエラ","行き先は、遠い東の島国。日本の、大阪という街よ"],["セラフィナ","おおさか……。前回の降臨から、もう五百年も経つというのに？"],["ガブリエラ","ええ。世界は大きく変わったわ。人も、街も、食べ物もね。……くれぐれも、現地に染まりすぎないように"],["","五百年。セラフィナにとっては、長いお昼寝くらいの時間のはずだった。"],["セラフィナ","分かりました。行ってきます。疲れた人がいるのなら、どこへでも"],["","こうして見習い天使は、五百年ぶりの地上任務へと旅立った。――まさかあんなことになるなんて、この時はまだ、知る由もなく。"],["セラフィナ","先輩の言う通り、染まりすぎないように気をつけます。わたしは天使ですから、しっかりと！"]]},"c0":{"bg":"11-descending-sky","next":"c1","lines":[["","雲を抜けると、夜の海のような、光の粒の広がりが見えてきた。"],["セラフィナ","わあ……！　星が、地面に落ちているみたいです"],["","それは星ではなかった。街の明かり、車の明かり、眠らない店の明かり。五百年前にはなかった、数えきれないほどの光だった。"],["セラフィナ","すごい、すごいです……！　あれ全部、人が作った明かりなんですか？"],["","あまりの眩しさに目を細めるセラフィナ。その小さな翼は、まだ真っ白に輝いていた。"],["セラフィナ","大阪、見えました。セラフィナ、降臨します！"],["","降りていくにつれて、街の音が少しずつ近づいてきた。電車の音、人々の声、店の呼び込み。五百年前にはなかった、忙しくて温かい音。"],["セラフィナ","なんだか、胸がどきどきします。怖いのとは、少し違う……楽しみ、なのかもしれません"]]},"c1":{"bg":"03-osaka-arrival","next":"c2","lines":[["","大阪、到着。最初の試練は、人混みだった。"],["セラフィナ","ひゃっ。……あ、すみません。……わっ、そちらからも人が……！"],["","四方八方から流れてくる人の波。五百年前のフィレンツェの、祭りの日よりもずっと賑やかだ。"],["","行き交う人々の手には、薄くて光る板。文字や絵が映る、不思議な道具だった。"],["セラフィナ","みなさん、あの板を逆さに持って……あ、いえ。逆だったのは、わたしの方でした"],["","真似して持ってみたら、映る文字が全部さかさまだったのである。セラフィナはそっと、板を持ち直した。"],["セラフィナ","落ち着いて、観察です、観察。……あの方の肩、震えてますね。疲れた人が、こんなにたくさん"],["","駅の天井は高く、案内の文字は光り、床は磨かれて靴音が響く。フィレンツェの大聖堂とは違うけれど、ここにも人の祈りのような、真剣な空気があった。"],["セラフィナ","まずは、この街の歩き方を覚えなくては。右側ですか、左側ですか……郷に入っては、ですね"]]},"c2":{"bg":"12-vending-machine","next":null,"lines":[["セラフィナ","……あ！　この箱、光ってます。中に飲み物が並んでいるのに、店員さんがいません"],["","自動販売機。お金を入れると、冷たい飲み物が「がしゃん」と落ちてくる、現代の不思議な箱である。"],["セラフィナ","無人なのに、働いている箱……？　五百年で、箱まで働くようになったんですね"],["","販売機の前を行く人々は、誰も驚かない。驚いているのは、五百年ぶりの天使だけだった。"],["セラフィナ","ええと、どれにしましょう。任務の前に、まず一口いただきます"],["","並んだボタンの向こうで、色とりどりの缶と瓶が、静かに出番を待っていた。"]],"choices":[{"text":"あまいジュースに挑戦する","shoku":8,"iyashi":0,"next":"r1a"},{"text":"無難にお水にする","shoku":1,"iyashi":0,"next":"r1b"}]},"r1a":{"bg":"12-vending-machine","next":"c3","lines":[["","一口飲んだ瞬間、セラフィナの目がまん丸になった。"],["セラフィナ","あま……！　甘くて、冷たくて、しゅわしゅわします！　果物が口の中で踊っているみたいです！"],["","通りすがりの子どもが、嬉しそうに笑う天使を二度見した。"],["","翼は、気のせいか少しだけ――ほんの少しだけ、色が薄くなった気がした。本人は、もちろん気づいていない。"],["セラフィナ","任務の前の腹ごしらえ、完了です！　……あれ、今の言い方、少し人間みたいですね"]]},"r1b":{"bg":"12-vending-machine","next":"c3","lines":[["セラフィナ","お水、おいしいです。故郷の泉みたいに、すっと体に入っていきます"],["","慎ましく喉を潤す天使を、販売機の明かりが静かに照らしていた。翼はまだ、ぴかぴかのままである。"],["セラフィナ","よし、落ち着きました。任務、開始です！"],["","販売機は今日も、来る人来る人に、冷たい一本を手渡し続けるのだろう。無人の箱の、静かな働きぶりに、セラフィナは小さく頭を下げた。"]]},"c3":{"bg":"26-automatic-door","next":"c4","lines":[["","駅の建物に入ろうとすると、目の前の扉が――"],["セラフィナ","わっ！　扉が、勝手に開きました！　どなたか中から開けて……いませんね？"],["","自動ドア。人が近づくだけで開く、親切な扉である。セラフィナは確認のため三度通って、三度とも驚いた。"],["通りすがりの人","お姉さん、さっきから何往復してるん？"],["セラフィナ","す、すみません！　確認です、確認なんです！　……便利な世の中ですねえ"],["","笑って手を振る通行人。怒る人はいなかった。大阪の人は、少しだけ優しいのかもしれない。"],["セラフィナ","扉にまで気を遣う国なんですね。開くたびに『どうぞ』って言われているみたいです"],["","セラフィナは最後にもう一度だけ扉を通り、今度は小さくお辞儀をしてから、駅の奥へ進んだ。"]]},"c4":{"bg":"14-ic-gate","next":null,"lines":[["","改札。薄いカードを機械にかざすと、小さな音が鳴って、扉が開く場所。"],["セラフィナ","あの音……『ピッ』。みなさん、あの音と一緒に通っているんですね"],["","セラフィナも、見よう見まねでカードをそっとかざしてみた。"],["セラフィナ","ピッ！　……開きました！　わたしまで、つい『ピッ』って言ってしまいました"],["", り、わたしはまだ大丈夫です。"],["","評価の声が届く。人の痛みに近づきすぎた分だけ、輪は姿を変えたのだと。"],["セラフィナ","それでも、今日もおつかれさまです。その言葉は、まだ言えますから。"],["","薄い輪の光が、帰り道の足元を、かろうじて優しく照らしていた。"]]},"s_end_mid":{"bg":"27-hatsumode","next":"INT4","lines":[["","一年が終わり、セラフィナの輪は春の半分ほどの濃さで、静かに光っていた。"],["ルチア","ちょうどいい、とは言わないけど。あんたらしいバランスだったんじゃない。"],["セラフィナ","助けることも、休むことも、どちらも大事だと学んだ一年でした。"],["","評価の声が届く。寄り添いと自分の足場、その両方を残した一年だったと。"],["セラフィナ","今日もおつかれさまです。来年は、もう少し上手に休みながら助けます。"],["","輪の光は控えめに、しかし確かに、新しい季節の方を向いていた。"]]},"s_end_low":{"bg":"27-hatsumode","next":"INT4","lines":[["","一年を巡っても、セラフィナの輪は春と変わらぬ明るさで頭上に浮かんでいた。"],["ルチア","あんた、ちゃんと自分の分も守ったのね。それはそれで立派なことよ。"],["セラフィナ","無理をしないから、続けられる。続けるから、出会える人もいます。"],["","評価の声が届く。穏やかな歩みで、季節と人を丁寧に見送った一年だったと。"],["セラフィナ","今日もおつかれさまです。来年も、ぼちぼちいきましょうね。"],["","輪は朝日に光り、三人は笑いながら新しい一年の坂道を下りていった。"]]},"w0":{"bg":"07-salon-training","next":"w1","lines":[["","小さな癒しサロンの扉を開けると、木の香りと静かな音楽がそっと迎えてくれた。"],["","今日からここで、見習いセラピストとして働き始める。制服の袖はまだ少し硬い。"],["柚月","セラフィナさん、初日は覚えることが多くて大丈夫。分からないことは何度でも聞いてね。"],["セラフィナ","はい、柚月さん。今日もおつかれさまです、って言えるお店にしたいです。"],["柚月","その挨拶、いいね。来てくれた方がほっと笑える場所を、一緒に作っていこう。"],["","カウンターには予約表とタオルと小さな花。どれも誰かを迎えるための準備だった。"],["セラフィナ","見習いの私にできることは小さいけど、一つずつ丁寧にやってみます。"]]},"w1":{"bg":"26-morning-breath","next":"w2","lines":[["","開店前の三十分。まずは窓を開けて空気を入れ替え、床を拭いて深呼吸をする。"],["ルチア","おはよう、セラフィナ。焦る日ほど、朝の呼吸をゆっくり数えるのが大事だよ。"],["セラフィナ","ルチア先輩、おはようございます。昨夜は緊張して、なかなか眠れませんでした。"],["ルチア","分かるよ。私も最初の頃は、タオルを畳む順番だけで頭がいっぱいだったから。"],["モコ","にゃーん。"],["","白い猫のモコがカウンターの下から顔を出し、セラフィナの靴の紐をちょいと触った。"],["セラフィナ","モコも応援してくれてるの？　ありがとう。よし、今日の研修、がんばります。"]]},"w2":{"bg":"07-salon-training","next":"w3","lines":[["","研修初日。練習用のベッドの前で、セラフィナはタオルを手に立ち尽くしていた。"],["柚月","力の入れ方よりも、相手の呼吸に合わせることを意識してみて。ゆっくりでいいよ。"],["セラフィナ","は、はい……あれ、手が震えてます。止まれ、止まれ、私の手。"],["","緊張で指先が小刻みに震え、タオルはくしゃりと形を崩してしまった。"],["ルチア","大丈夫、誰でも最初はそうだよ。震えるのは、一生懸命な証拠でもあるんだから。"],["セラフィナ","でも、お客さまの前でこんな手だったら、きっと不安にさせてしまいます。"],["柚月","だから練習するんだよ。失敗した場所を、一緒に見直していこうね。"]]},"w3":{"bg":"07-salon-training","choices":[{"text":"正直に謝って、もう一度最初から練習する","shoku":0,"iyashi":12,"next":"w_r1a"},{"text":"深呼吸をして、手の震えが落ち着くのを待つ","shoku":1,"iyashi":10,"next":"w_r1b"},{"text":"ルチアに隣で見ていてもらい、手本と比べる","shoku":0,"iyashi":14,"next":"w_r1c"}],"lines":[["","震える手を前にして、セラフィナは唇を結んだ。どう立て直すかは、自分で決めたかった。"],["セラフィナ","このまま慌てて続けても、うまくいきません。どうすればいいか、考えます。"],["柚月","いいよ、自分の言葉で選んでごらん。お店の仕事は、正解が一つとは限らないから。"],["ルチア","焦らなくて大丈夫。選んだ方法で、もう一度やってみればいいんだよ。"],["","練習用の時計は静かに時を刻んでいた。逃げずに向き合う時間が始まろうとしていた。"]]},"w_r1a":{"bg":"26-morning-breath","next":"w4","lines":[["セラフィナ","すみません、私、緊張して失敗しました。もう一度、最初からやらせてください。"],["柚月","正直に言ってくれてありがとう。謝ることも、相手を大切にする仕事の一つだよ。"],["","セラフィナはタオルを畳み直し、今度は一つ一つの動きを声に出して確かめた。"],["ルチア","声に出すと、手も心も落ち着くよね。さっきよりずっと丁寧だよ。"],["セラフィナ","本当ですか？　よかった……焦ると、つい早口になっちゃうんです。"],["柚月","その気づきが大事。今日の反省は、明日の安心につながっていくよ。"]]},"w_r1b":{"bg":"26-morning-breath","next":"w4","lines":[["","セラフィナは目を閉じて、朝に教わった呼吸を思い出しながらゆっくり息を吐いた。"],["セラフィナ","一、二、三……。慌ててるのは手だけじゃなくて、心もなんだなあ。"],["ルチア","そうそう、その調子。自分の呼吸が整うと、相手にも静けさが伝わるんだよ。"],["","三度目の深呼吸の終わりごろ、震えは少しずつ収まり、タオルをまっすぐに置けた。"],["柚月","よく落ち着けたね。待つことも、立派な技術のうちだよ。"],["セラフィナ","待つことも技術……メモしておきます。心に大きく書いておきます。"]]},"w_r1c":{"bg":"07-salon-training","next":"w4","lines":[["セラフィナ","ルチア先輩、隣で見ていてもらえませんか。手本と並べて比べたいんです。"],["ルチア","もちろん。ほら、私はこうやって相手の様子をちらっと確かめてから始めるよ。"],["","先輩の落ち着いた動きを横で見ると、速さよりも間の取り方が大切だと分かった。"],["セラフィナ","なるほど、始める前に一呼吸置くんですね。私、ずっと急いでいたんだ。"],["ルチア","気づけたなら十分だよ。人の動きから学べる子は、のびるのが早いんだから。"],["柚月","頼ることも仕事のうち。分からないまま一人で抱えないでね。"]]},"w4":{"bg":"07-salon-training","next":"w5","lines":[["","研修三日目、今度は予約表の書き写しで失敗した。午後の枠に同じ名前が二つ並んでいた。"],["セラフィナ","大変です、二時と三時を間違えて書いちゃいました。お電話で確かめなきゃ。"],["柚月","早く気づけてよかった。間違いは隠すより、早く伝える方がずっと親切だよ。"],["","電話口で丁寧にお詫びすると、相手は笑って予定を調整してくれた。"],["会社員の客","わざわざありがとう。そちらも忙しいのに、誠実だね。"],["セラフィナ","ありがとうございます。……失敗しても、伝え方でこんなに違うんですね。"],["ルチア","予約表はお客さまとの約束の紙だよ。大事に扱う気持ちが伝わったんだね。"]]},"w5":{"bg":"01-office-worker-shoulder","next":"w6","lines":[["","ついに初めてのお客さまを迎える日が来た。スーツ姿の会社員の方が、静かに入ってきた。"],["会社員の客","こんにちは。今日はよろしくお願いします。少し緊張してまして。"],["セラフィナ","いらっしゃいませ。今日もおつかれさまです。私も緊張してます、一緒ですね。"],["","思わず本音が出て、二人は顔を見合わせて小さく笑った。空気がふっと和らいだ。"],["会社員の客","はは、正直でいいね。肩の辺りが張る気がして、今日はゆっくりしたくてね。"],["セラフィナ","かしこまりました。無理のない範囲で、ゆっくり過ごしていってくださいね。"],["柚月","（小声で）いい出迎えだったよ。笑顔で迎えるのが一番の準備だね。"]]},"w6":{"bg":"01-office-worker-shoulder","next":"w7","lines":[["","部屋には柔らかな明かりと、控えめな音楽。セラフィナは深呼吸をしてから声をかけた。"],["セラフィナ","寒くないですか。タオルの重さはこのくらいで大丈夫でしょうか。"],["会社員の客","ちょうどいいよ。細かいところまで聞いてくれるんだね。"],["","始めてみると、手は思ったより落ち着いていた。朝の呼吸の練習を思い出しながら進めた。"],["会社員の客","仕事が詰まってた週でね。誰かにゆっくり接してもらうの、久しぶりだなあ。"],["セラフィナ","そうだったんですね。今日は急がなくて大丈夫ですよ、時間は味方です。"],["","相手の言葉を急いで受け止めすぎず、うなずきながら聞くことを心がけた。"]]},"w7":{"bg":"08-listening","choices":[{"text":"香りの好みを聞いて、アロマオイルを選んでもらう","shoku":1,"iyashi":14,"next":"w_r2a"},{"text":"話したい様子に寄り添い、聞き役に徹する","shoku":0,"iyashi":16,"next":"w_r2b"},{"text":"足湯の用意をして、温かいタオルで迎える","shoku":1,"iyashi":12,"next":"w_r2c"}],"lines":[["","施術の合間、お客さまがぽつりと今週の出来事を話し始めた。セラフィナは考えた。"],["セラフィナ","この時間をもっと心地よくするには、何がいいかな。私にできることを選ぼう。"],["会社員の客","なんか、ここに来るとほっとするね。うまく言えないけど。"],["","窓の外では商店街の人々が行き交っていたが、この部屋だけ時間がゆっくり流れていた。"],["セラフィナ","急がなくて大丈夫ですよ。今日は、あなたのための時間なんですから。"]]},"w_r2a":{"bg":"09-aroma-oil","next":"w8","lines":[["セラフィナ","よかったら、香りを二つから選んでみませんか。柑橘の爽やかさと、花の優しさです。"],["会社員の客","選べるんだ。じゃあ柑橘で。ふうん、鼻を通ると気分が切り替わる感じだね。"],["","小さな瓶を手渡すと、お客さまは目を閉じて香りを楽しみ、穏やかな顔になった。"],["セラフィナ","選んでもらう時間も、楽しみの一つになればいいなと思ってるんです。"],["会社員の客","自分のために選ぶなんて、普段なかなかしないから新鮮だよ。ありがとう。"],["","部屋に広がる香りの中で、二人の間にも自然な会話が生まれていった。"]]},"w_r2b":{"bg":"08-listening","next":"w8","lines":[["","セラフィナは口数を減らし、お客さまの話に耳を澄ますことに決めた。"],["会社員の客","部下の失敗を叱れなくてさ。自分が新人だった頃を思い出しちゃうんだよ。"],["セラフィナ","そうなんですね。……その気持ち、大事にしてきたんですね。"],["","相づちは少なく、でも丁寧に。話し終えたお客さまは、深く息を吐いて笑った。"],["会社員の客","最後まで聞いてくれてありがとう。話すだけで、頭の中が整理できた気がするよ。"],["セラフィナ","聞くことも、私の仕事なんだって今日初めて実感しました。"]]},"w_r2c":{"bg":"11-foot-bath","next":"w8","lines":[["セラフィナ","少しお待ちくださいね。足元を温める用意と、温かいタオルをお持ちします。"],["会社員の客","おお、足湯まであるのかい。靴を脱いで座るだけで、なんだか休日みたいだね。"],["","湯気の立つ足元と柔らかなタオルに、お客さまは目を細めてくつろいだ様子だった。"],["セラフィナ","大阪の街って、みんな歩くのが速いですよね。ここではゆっくりでいいんですよ。"],["会社員の客","はは、確かに。時間に追われない場所があるのは、ありがたいなあ。"],["","何気ない雑談が弾み、部屋の空気はますます柔らかくなっていった。"]]},"w8":{"bg":"12-seeing-off-guest","next":"w9","lines":[["","初めてのお客さまを見送る時間。セラフィナは扉の前で深くお辞儀をした。"],["会社員の客","今日はありがとう。来たときより、笑える余裕が戻った気がするよ。"],["セラフィナ","今日もおつかれさまです。また疲れたなあって日に、思い出してもらえたら嬉しいです。"],["","お客さまは手を振って商店街へ歩いていった。その背中を見て、胸が熱くなった。"],["柚月","初めてのお客さま、無事に終えられたね。震えていた手が、今日は頼もしく見えたよ。"],["セラフィナ","私、誰かの笑顔のために働くの、すごく好きかもしれません。"],["モコ","にゃん。"],["","モコが足元にすり寄ってきた。それが小さな合格のしるしのように感じられた。"]]},"w9":{"bg":"02-nurse-tea","next":"w10","lines":[["","夕方、夜勤明けの看護師さんが静かに訪れた。挨拶の声も、どこか小さかった。"],["看護師の客","こんばんは。少しだけ、静かに過ごせる場所を探してて。"],["セラフィナ","いらっしゃいませ。今日もおつかれさまです。奥の席が静かですよ、どうぞ。"],["","多くを聞かず、温かいお茶と毛布を用意した。湯気を見て、相手の目元が和らいだ。"],["看護師の客","ありがとう。誰にも気を遣わずぼんやりできる時間って、貴重でね。"],["セラフィナ","ぼんやり、大事ですよね。私も最近、その価値を教わったばかりです。"],["ルチア","（小声で）相手が何も求めていないときは、そっとしておく優しさもあるんだよ。"]]},"w10":{"bg":"02-nurse-tea","choices":[{"text":"お茶のおかわりをそっと置き、声はかけずに見守る","shoku":0,"iyashi":13,"next":"w_r3a"},{"text":"短く近況を聞き、話したくなったら聞く姿勢を見せる","shoku":1,"iyashi":15,"next":"w_r3b"},{"text":"好きな香りのハンドタオルを用意して渡す","shoku":0,"iyashi":11,"next":"w_r3c"}],"lines":[["","看護師さんはお茶を両手で包み、窓の外を眺めていた。セラフィナはそっと考えた。"],["セラフィナ","声をかけるべきかな、かけないべきかな。相手の時間を邪魔したくないな。"],["看護師の客","……このお店、時計の音が優しいね。急かされない感じがする。"],["","カウンターの花が夕方の光を受けて揺れた。静けさを守るのも、立派なおもてなしだった。"],["ルチア","（小声で）相手の様子をよく見て。答えは、その人の過ごし方の中にあるよ。"]]},"w_r3a":{"bg":"02-nurse-tea","next":"w11","lines":[["","セラフィナはおかわりのお茶を音を立てずに置き、一言だけ小さく声をかけた。"],["セラフィナ","ごゆっくりどうぞ。必要なときは、いつでも呼んでくださいね。"],["看護師の客","うん、ありがとう。放っておいてくれるの、すごく助かるの。"],["","その後、相手は目を閉じて静かに過ごし、帰り際には小さく手を合わせた。"],["看護師の客","また来ますね。ここに来ると、自分の時間を取り戻せる気がするの。"],["セラフィナ","静けさもおもてなしなんだ。言葉が少なくても、伝わるものがあるんですね。"]]},"w_r3b":{"bg":"08-listening","next":"w11","lines":[["セラフィナ","今日は長い一日でしたか。話したくなったらで大丈夫です、私はここにいます。"],["看護師の客","……ありがとう。実は今日、患者さんに笑ってもらえてね。それが嬉しくて。"],["","ぽつりぽつりと語られる小さな喜びに、セラフィナは何度もうなずいた。"],["看護師の客","誰かに聞いてもらいたかったのは、つらい話じゃなくて嬉しい話だったみたい。"],["セラフィナ","嬉しい話を聞けるのも、幸せな仕事ですね。教えてくれてありがとうございます。"],["","二人の笑い声が静かな店内に溶けて、夕方の光が少しだけ暖かく見えた。"]]},"w_r3c":{"bg":"02-nurse-tea","next":"w11","lines":[["セラフィナ","よかったら、こちらをどうぞ。ほのかに香るタオル、好きな方を選んでください。"],["看護師の客","わあ、いい香り。手に取るだけで、気持ちがほぐれていくみたい。"],["","相手はタオルを顔に近づけて深呼吸し、ふわりと笑顔を見せた。"],["セラフィナ","香り otengai-regular","next":"l8","lines":[["","届いた野菜の箱を二つ運ぶと、店主は大根を一本おまけしてくれた。"],["セラフィナ","え、ええんですか。ほんのちょっと運んだだけやのに。"],["ルチア","情けは人のためならず、というやつだ。受け取っておけ。"],["","重い袋を提げて帰る道すがら、腕は痛いのに足取りは軽かった。"],["セラフィナ","大根一本で、こんなに嬉しいなんて。暮らしって、おもろいな。"]]},"l_r3b":{"bg":"05-shotengai-regular","next":"l8","lines":[["","特売の葉物と根菜を見比べ、頭の中で三日分の献立を組み立てた。"],["セラフィナ","今日は鍋、明日は炒め物、あさっては汁物に回せる。完璧や。"],["ルチア","買い物リストより現場判断が速くなったな。成長している。"],["","合計金額は予算の内側に収まり、財布にも余裕が残った。"],["セラフィナ","浮いた分は貯金箱へ。こういう小さな勝ちが、続ける力になる。"]]},"l_r3c":{"bg":"05-shotengai-regular","next":"l8","lines":[["","隣に並んだ客と、余り野菜の使い道について話が弾んだ。"],["セラフィナ","皮ごと漬けるんですか。それ、知らんかった。今度やってみます。"],["ルチア","知らない同士が、野菜一つでここまで話せるのは面白い。"],["","連絡先は交換せずとも、次に会えば挨拶できる関係が生まれた。"],["セラフィナ","商店街の人間関係って、こうやって少しずつ編まれていくんやな。"]]},"l8":{"bg":"12-typhoon-stockpile","next":"l9","lines":[["","台風接近の知らせで、商店街もスーパーも朝から慌ただしかった。"],["セラフィナ","水と乾物と、猫のごはん。あと懐中電灯の電池も確認せな。"],["ルチア","買いだめは過ぎると無駄になる。必要な分だけ、冷静にな。"],["セラフィナ","分かってる。でも列見たら、つい焦るのが人間やんか。"],["","周りの客も同じ顔をしていて、少しだけ笑い合って落ち着きを取り戻した。"],["セラフィナ","窓の補強は昼のうちに。夜に慌てるのは、あかんからな。"],["ルチア","近所への声かけも済ませたな。備えには顔見知りが強いぞ。"]]},"l9":{"bg":"12-typhoon-stockpile","next":"l10","lines":[["","夜、風の音が強まり、モコとノワールは押し入れの奥に避難した。"],["セラフィナ","大丈夫やで。ここは安全やし、私もルチアもおるからな。"],["ルチア","停電に備え、明かりと水の置き場所は決めてある。よくやった。"],["","ラジオから地域の情報が流れ、近所同士で安否の連絡も行き交った。"],["セラフィナ","怖い夜ほど、声をかけ合える関係がありがたいんやな。"],["","明け方、雨音が遠のき、鉢植えも無事に朝を迎えた。"],["セラフィナ","備えって、使う日が来へんのが一番ええんやけどな。"]]},"l10":{"bg":"15-year-end-cleaning","next":"l_c4","lines":[["","年末。セラフィナは一年の汚れと向き合う大掃除を宣言した。"],["セラフィナ","キッチンの換気扇、窓の桟、押し入れの奥。逃げてた場所ばっかりや。"],["ルチア","宣言するのは簡単だ。終わらせるのが難しいのは毎年のことだぞ。"],["セラフィナ","今年は作戦立てるから。音楽かけて、場所ごとに終わらせる作戦や。"],["","モコは雑巾を追いかけ、ノワールは掃除済みの段ボールに真っ先に入った。"],["セラフィナ","協力なのか妨害なのか分からへんけど、まあ賑やかでええわ。"]]},"l_c4":{"bg":"15-year-end-cleaning","choices":[{"text":"一番手強いキッチンから片付ける","shoku":0,"iyashi":1,"next":"l_r4a"},{"text":"玄関と窓を磨いて気分から上げる","shoku":1,"iyashi":2,"next":"l_r4b"},{"text":"不要品を仕分けて譲る・捨てるを決める","shoku":2,"iyashi":1,"next":"l_r4c"}],"lines":[["","掃除道具を並べたものの、どこから始めるかで手が止まった。"],["ルチア","順番を決めろ。 、そういうのが、こっちにもあるのよ"],["ガブリエラ","受け取ったわ。あなたと過ごした日々は、私にとっても視察以上のものでした"],["","三人の影が、夜景を背に並んだ。言葉はもう少なくてよかった。同じ明かりを見ていることが、答え合わせのようだった。"],["セラフィナ","二人と出会えたことも、この街の贈り物です。……さあ、夜明けが来ますね"]]},"g_last":{"bg":"media-generation-29-window-lights-night-0-37a01af4-7bfe-4aa5-b02b-962a52478ada","next":"FINAL","lines":[["","夜が明けようとしていた。東の空が白み、街の明かりが一つずつ役目を終えていく。セラフィナは最後に、静かに微笑んだ。"],["セラフィナ","行ってきます、なのか。行ってらっしゃい、なのか。まだ分かりません。でも、一つだけ確かなことがあります"],["セラフィナ","疲れた人のそばにいること。それは場所を選ばない、わたしの生き方です"],["","朝の光が、羽根を優しく照らした。その色がどう見えるかは、もう怖くなかった。"],["セラフィナ","大阪の皆さん、そして天界の皆さん。――今日もおつかれさまです"],["","新しい一日が始まる音がした。物語の結末は、この朝の光の先で、 静かに待っていた。"]]},"end_special":{"bg":"30-anniversary-key-visual","next":"fin","lines":[["","朝の光の柱は降りてきた。けれど現れた使者は、帰還命令ではなく、新しい任命状を携えていた。最終報告が、天界と神仏の双方を動かしたのだ。"],["ガブリエラ","特例よ。大阪駐在の継続と、天界との橋渡し役。あなたの報告に、反対する者がいなかったの"],["ルチア","神様たちまで推薦文を出したんですって。……あんた、ほんとに愛され体質ね"],["","商店街の人々、日本橋の店員たち、常連たち、そして天照大御神と観音菩薩の温かな見送りの言葉。気づけば高台は、人と神仏と、仲間たちでいっぱいだった。"],["天照大御神","いてくれると、街が明るくなる。それが答えだよ"],["観音菩薩","必要な場所に、必要な人が残る。それもまた、ご縁です"],["セラフィナ","皆さん……！　わたし、まだここにいていいんですね。嬉しくて、言葉が出ません"],["セラフィナ","決めました。ここで、これからも。疲れた人のそばにいる優しさを、毎日届けます。皆さん、今日もおつかれさまです"]]},"end_stay":{"bg":"01-key-visual","next":"fin","lines":[["","使者が持ち帰った最終報告への返答は、予想外のものだった。大阪駐在の正式承認。セラフィナは任務の客ではなく、この街の生活者になることが許された。"],["ガブリエラ","駐在天使として認められたわ。住まいも、仕事も、自分の足で続けるのよ"],["ルチア","羽根がだいぶ染まった天使を、天界も面白がったんじゃない？　……あたしは、まあ、悪くないと思う"],["","商店街へ報告に行くと、その場で小さな宴が始まった。帰るはずだった人の残留は、街にとって何よりの知らせだった。"],["商店街の婦人","ほんなら、これからもよろしゅうな。あんたはもう、ここの人や"],["セラフィナ","はい。家賃も、買い物も、町内のお付き合いも、生活者として頑張ります"],["","夕方、モコと並んで夕飯の買い物をした。特別な日なのに、いつもと変わらない一日。それが一番嬉しかった。"],["セラフィナ","ただいま、大阪。これからも疲れた人のそばにいる優しさを守ります。皆さん、今日もおつかれさまです"]]},"end_travel":{"bg":"26-return-talk-city-view","next":"fin","lines":[["","天界からの返答は、新しい役目を知らせるものだった。地上と天界を行き来する連絡役。月に何度か空を渡り、両方の話を届ける仕事だった。"],["ガブリエラ","前例のない役目よ。地上をよく知るあなただからこそ、任されたの"],["ルチア","行き来ってことは、また戻ってくるわけね。……荷物の預かり、延長しといてあげる"],["","出発の朝、見送りは最小限だった。またすぐ会えると分かっている別れは、涙より笑顔が似合った。"],["セラフィナ","行ってきます。向こうの話も、こちらの話も、ちゃんと届けますね"],["モコ","にゃああん！"],["","空へ昇る途中、振り返ると大阪の街が光っていた。離れるのではなく、繋ぐための距離なのだと、今は思えた。"],["セラフィナ","どちらの空の下でも、疲れた人のそばにいる優しさを忘れません。皆さん、今日もおつかれさまです"]]},"end_return":{"bg":"media-generation-28-sumiyoshi-dusk-farewell-0-9ec7dd29-1cd8-47c4-90d2-a3e53721b3e2","next":"fin","lines":[["","朝の光の中、セラフィナは約束通り天界へ帰ることになった。任務は立派に果たされた。けれど見送りの顔ぶれは、任命のときよりずっと多かった。"],["ルチア","……泣くなよ。あんたが泣くと、こっちまで変な気分になる。ほら、ハンカチ。貸しだからね"],["ガブリエラ","あなたの席は、天界でも用意されているわ。でも、帰る場所は一つとは限らないのよ"],["","商店街の婦人の手紙、日本橋の店員たちの寄せ書き、常連たちの小さな贈り物。荷物は来たときより、ずっと重くなっていた。"],["セラフィナ","皆さん、聞いてください。約束します。いつか必ず、また来ます。そのときは、もっと立派な天使になって"],["天照大御神","待っているよ。こちらの茶席は、いつでも開けておくからね"],["観音菩薩","離れていても、届けた温かさは残ります。また会う日まで、お元気で"],["セラフィナ","はい、行ってきます。大阪の皆さん、疲れた人のそばにいる優しさを、どうか忘れないで。今日もおつかれさまです"]]},"sys_intro":{"bg":"02-florence","next":"c0","lines":[["","出発の朝、ガブリエラから小さな革袋が渡された。地上での暮らしに使う『支度金』、三千円。多くはないけれど、最初の備えには十分な額だった。"],["ガブリエラ","お金の使い方も任務のうちよ。よく考えて、でも必要なときは思い切って使いなさい。"],["セラフィナ","三千円……。地上のお金、初めて自分で持つんです。落とさないように、しっかり持っていきます！"]]},"INT1":{"bg":"28-report-sleep","next":"n0","target":"n0","interlude":1,"lines":[["","――幕間。自由行動パート――"]]},"INT2":{"bg":"27-nipponbashi-neon-night","next":"teaser2","target":"teaser2","interlude":2,"lines":[["","――幕間。自由行動パート――"]]},"INT3":{"bg":"25-warm-tea","next":"s0","target":"s0","interlude":3,"lines":[["","――幕間。自由行動パート――"]]},"INT4":{"bg":"27-hatsumode","next":"w0","target":"w0","interlude":4,"lines":[["","――幕間。自由行動パート――"]]},"INT5":{"bg":"27-thank-you-letter","next":"l0","target":"l0","interlude":5,"lines":[["","――幕間。自由行動パート――"]]},"INT6":{"bg":"29-group-photo","next":"v0","target":"v0","interlude":6,"lines":[["","――幕間。自由行動パート――"]]},"INT7":{"bg":"26-extension-application","next":"k0","target":"k0","interlude":7,"lines":[["","――幕間。自由行動パート――"]]}};
const TITLE_IMG = "assets/01-key-visual.webp";
const SAVE_KEY = "seraphina_proto_save_";
let S = null;
let autoTimer = null;
function newState(){ return {scene:"p0", line:0, shoku:0, iyashi:0, money:3000, items:{}, free:null, flags:{}, log:[]};}
function stageComment(v){
const r = SHOKU_MAX? v/SHOKU_MAX : 0;
if(r>=0.82) return "すっかり大阪の人……でも笑顔は天使のまま";
if(r>=0.62) return "輪と翼は薄く、言葉には関西の響き";
if(r>=0.42) return "すっかり染まってきた……本人は無自覚";
if(r>=0.22) return "輪がほんの少し薄れた気が……本人は無自覚";
if(v>=1) return "まだぴかぴか。でも何か始まっている";
return "輪はぴかぴか、翼もふんわり";
}
function updateHUD(){
audioMoneyWatch();
document.getElementById("shokunum").textContent = S.shoku;
document.getElementById("iyashinum").textContent = S.iyashi;
document.getElementById("moneynum").textContent = (S.money||0).toLocaleString("ja-JP");
document.getElementById("bar").style.width = Math.min(100, S.shoku/SHOKU_MAX*100) + "%";
document.getElementById("stagec").textContent = stageComment(S.shoku);
}
function endingFor(v){ return v>=26? "e_high": (v>=15? "e_mid": "e_low");}
function endingFor2(v){ return v>=52? "f_high": (v>=34? "f_mid": "f_low");}
const SHOKU_MAX = 170;
const BR = {"BRANCH3": {"kind": "shoku", "hi": 75, "lo": 59, "high": "t_end_high", "mid": "t_end_mid", "low": "t_end_low"}, "BRANCH4": {"kind": "shoku", "hi": 78, "lo": 59, "high": "s_end_high", "mid": "s_end_mid", "low": "s_end_low"}, "BRANCH5": {"kind": "shoku", "hi": 81, "lo": 60, "high": "w_end_high", "mid": "w_end_mid", "low": "w_end_low"}, "BRANCH6": {"kind": "shoku", "hi": 87, "lo": 63, "high": "l_end_high", "mid": "l_end_mid", "low": "l_end_low"}, "BRANCH7": {"kind": "gab", "hi": 3, "lo": 1, "high": "v_end_high", "mid": "v_end_mid", "low": "v_end_low"}, "BRANCH8": {"kind": "shoku", "hi": 109, "lo": 79, "high": "k_end_high", "mid": "k_end_mid", "low": "k_end_low"}, "FINAL": {"kind": "final", "spI": 174, "hiS": 107, "stayI": 130, "loS": 88, "special": "end_special", "stay": "end_stay", "travel": "end_travel", "ret": "end_return"}};
function branchFor(token){ const t = BR[token]; if(!t) return null; if(t.kind==="shoku"){ return S.shoku>=t.hi? t.high : (S.shoku>=t.lo? t.mid : t.low);} if(t.kind==="gab"){ const g=(S.flags&&S.flags.gab)||0; return g>=t.hi? t.high : (g>=t.lo? t.mid : t.low);} if(t.kind==="final"){ if(S.iyashi>=t.spI) return t.special; if(S.shoku>=t.hiS && S.iyashi>=t.stayI) return t.stay; if(S.shoku>=t.loS) return t.travel; return t.ret; } return null;}
function showScene(){
const sc = SCENES[S.scene];
recordSceneProgress(S.scene);
audioSceneHook();
if(sc.interlude){ document.getElementById("bg").src = assetSrc(sc.bg); startInterlude(sc.interlude, sc.target); return; }
hideFree();
document.getElementById("bg").src = assetSrc(sc.bg);
const line = sc.lines[S.line];
document.getElementById("who").textContent = line[0] || "";
document.getElementById("text").textContent = line[1];
document.getElementById("next").style.display = "";
updateHUD();
onLineShown();
}
function pushLog(){
const sc = SCENES[S.scene]; const line = sc.lines[S.line];
S.log.push([line[0], line[1]]);
if(S.log.length>4000) S.log.shift();
}
function advance(){
if(!S || S.free) return;
pushLog();
const sc = SCENES[S.scene];
if(S.line < sc.lines.length-1){ S.line++; showScene(); scheduleAuto(); return;}
// scene end
if(sc.choices){ stopAuto(); showChoices(sc); return;}
let nxt = sc.next;
if(nxt === "BRANCH"){ nxt = endingFor(S.shoku);}
else if(nxt === "BRANCH2"){ nxt = endingFor2(S.shoku);}
else if(nxt && (nxt.indexOf("BRANCH")===0 || nxt==="FINAL")){ nxt = branchFor(nxt);}
if(!nxt || sc.end){ stopAuto(); toTitle(true); return;}
S.scene = nxt; S.line = 0; showScene(); scheduleAuto();
}
function showChoices(sc){
const box = document.getElementById("choices");
box.querySelectorAll("button").forEach(b=>b.remove());
sc.choices.forEach((ch, ci)=>{
const b = document.createElement("button");
b.textContent = ch.text;
b.onclick = (e)=>{ e.stopPropagation(); seTap();
S.shoku += ch.shoku||0; S.iyashi += ch.iyashi||0; if(ch.flag){ S.flags = S.flags||{}; S.flags[ch.flag] = (S.flags[ch.flag]||0) + (ch.fv||1); }
applyChoiceReward(S.scene, ci);
S.log.push(["", ch.text]);
box.style.display = "none";
S.scene = ch.next; S.line = 0; showScene();
};
box.appendChild(b);
});
box.style.display = "flex";
}
function startGame(){ audioUserStart(); hideFree(); S = newState(); document.getElementById("title").style.display="none"; showScene();}
function toTitle(finished){
stopAuto(); hideFree();
audioToTitle();
const t = document.getElementById("title");
t.style.display = "flex";
if(finished) toast("おしまい。ありがとうございました");
}
function toast(msg){
const el = document.getElementById("toast"); el.textContent = msg; el.style.display="block";
setTimeout(()=>{ el.style.display="none";}, 2200);
}
function openSlots(mode){
const modal = document.getElementById("saveModal");
document.getElementById("saveTitle").textContent = mode==="save"? "セーブ": "ロード";
const wrap = document.getElementById("slots"); wrap.innerHTML = "";
for(let i=1;i<=6;i++){
const raw = localStorage.getItem(SAVE_KEY+i);
const b = document.createElement("button"); b.className="slot";
if(raw){
const d = JSON.parse(raw);
b.innerHTML = "スロット"+i+"<br><small>"+d.date+"／場面："+d.scene+"／蝕まれ度 "+d.shoku+"・癒し "+d.iyashi+"・所持金 "+(Number.isFinite(d.money)?d.money:3000)+"円</small>";
} else {
b.innerHTML = "スロット"+i+"<br><small>（空き）</small>";
}
b.onclick = ()=>{
if(mode==="save"){
if(!S){ toast("まだ始まっていません"); return;}
const d = {version:2, scene:S.scene, line:S.line, shoku:S.shoku, iyashi:S.iyashi, money:S.money||0, items:S.items||{}, free:S.free||null, flags:S.flags||{}, log:S.log, date:new Date().toLocaleString("ja-JP")};
localStorage.setItem(SAVE_KEY+i, JSON.stringify(d));
toast("スロット"+i+"にセーブしました"); openSlots("save");
} else {
const raw2 = localStorage.getItem(SAVE_KEY+i);
if(!raw2){ toast("データがありません"); return;}
const d = JSON.parse(raw2);
S = normalizeState(d); mergeCollectionFromRun();
document.getElementById("title").style.display="none";
modal.style.display="none"; showScene(); toast("ロードしました");
}
};
wrap.appendChild(b);
}
modal.style.display="block";
}
function openLog(){
const list = document.getElementById("loglist");
if(!S || S.log.length===0){ list.textContent = "まだ記録がありません。";}
else{
list.innerHTML = S.log.map(l=> l[0]? '<div><span class="lw">'+l[0]+"</span>　"+l[1]+"</div>": "<div>"+l[1]+"</div>").join("");
}
document.getElementById("logModal").style.display="block";
}
function stopAuto(){
if(autoTimer){ clearTimeout(autoTimer); autoTimer=null;}
document.getElementById("mAuto").classList.remove("on");
}
function scheduleAuto(){
if(!document.getElementById("mAuto").classList.contains("on")) return;
stopAutoKeep();
autoTimer = setTimeout(advance, 2400);
}
function stopAutoKeep(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null;}}

菓子を用意した。人同士の距離も、猫たちと同じなのかもしれない。無理に縮めなくても、同じ景色を見ていれば、少しずつ隣が当たり前になっていく。やがてノワールがモコの隣で丸くなり、ルチアも観念したように菓子へ手を伸ばした。作戦会議は、いつの間にかお茶会へ姿を変えていた。","options":[{"label":"四人分のお茶を用意する","result":"ルチアは文句を言いながら、猫たちと同じ窓辺に座った。静かな時間は、誰の作戦でもなかった。","shoku":1,"iyashi":3,"money":0},{"label":"モコとノワールの写真を撮る","result":"シャッターの瞬間、二匹が同時にこちらを見た。ルチアはその写真を、なぜか保存していた。","shoku":2,"iyashi":2,"money":0},{"label":"窓辺で何もせず過ごす","result":"会話のない時間も、不思議と居心地が悪くなかった。隣にいることを、急いで名前で呼ばなくてもよかった。","shoku":0,"iyashi":0,"money":0}]},"3-salon":{"title":"客のふりをした悪魔","text":"サロンの予約表に、見慣れない名前があった。現れたのは、帽子で角を隠したルチアである。『癒しの実力を確かめに来た』と言うが、受付に座る姿は少し緊張していた。セラフィナは正体を知らないふりをして、お茶を出し、先輩に取り次ぐ。施術室から出てきたルチアは、肩を回しながら『べ、別に……悪くなかった』とだけ言い、正規の料金と、なぜか大きめの心づけを置いて帰った。店を出たルチアは、振り返って小さく『予約、また入れるかも』と漏らした。セラフィナは聞こえないふりをして、受付の花を整えた。","options":[{"label":"最後まで丁寧に接客する","result":"悪魔の偵察は、満足そうな背中で終わった。敵にも味方にも、丁寧な接客は届くものらしい。","shoku":1,"iyashi":3,"money":800},{"label":"帰り際に甘い飴を渡す","result":"ルチアは飴を握りしめ、振り返らずに手を振った。次に来る理由が、ひとつ増えたようだった。","shoku":2,"iyashi":2,"money":600}]},"4-nippon":{"title":"季節の入れ替え市","text":"日本橋の店先では、季節の入れ替えで小さな市が開かれていた。春のカード、夏の扇子、秋色のリボン、冬の手袋が、少しずつ値札を変えて並んでいる。セラフィナは過ぎた季節の品を手に取り、次に来る季節の色を選んだ。店員は『季節ものは、思い出ごと持ち帰る人が多いんです』と話す。買い物とは、品物だけでなく、これから過ごす時間を選ぶことでもあった。帰り際、店員が次の季節の入荷日を教えてくれた。予定表に小さな印を付けるだけで、未来の自分への贈り物になる気がした。","options":[{"label":"次の季節の小物を選ぶ","result":"小さな袋の中に、これからの予定が入った。未来の季節を楽しみにできることが、少し大人びて感じられた。","shoku":3,"iyashi":1,"money":0},{"label":"過ぎた季節の品を丁寧に眺める","result":"値札の裏に、店員の短いおすすめ文があった。季節を大切にする人の手触りが、品物に残っていた。","shoku":2,"iyashi":2,"money":0}]},"4-home":{"title":"四季の品をしまう午後","text":"机の上には、桜の押し花、夏祭りのうちわ、紅葉のしおり、雪の日に買った手袋が並んだ。セラフィナは一つずつ手に取り、どの日に、誰と、どんな空の下で手に入れたかを思い出す。モコはうちわの端を前足で押さえ、片づけを邪魔しながら参加していた。品をしまう作業は、季節を閉じることではなく、次の年にまた開ける約束を置くことだった。最後に残ったのは、名前を書き忘れた小さな葉書だった。誰から届いたのか思い出せず、セラフィナは笑って来年の自分へ問いを残した。","options":[{"label":"写真と押し花でアルバムを完成させる","result":"四季の思い出アルバムが完成した。ページを閉じても、季節の色が手のひらに残っている気がした。","shoku":1,"iyashi":3,"money":0,"item":"season_album"},{"label":"モコと一緒にのんびり片づける","result":"片づけは遅れたが、笑う回数は増えた。思い出は、急がず触れる方が鮮やかに残る。","shoku":0,"iyashi":3,"money":0},{"label":"途中で横になって休む","result":"品々は半分だけ片づいた。けれど体は正直で、短い眠りが次の季節への力を戻してくれた。","shoku":0,"iyashi":0,"money":0}]},"4-salon":{"title":"季節の変わり目のサロン","text":"季節が移る頃、サロンには『なんとなく眠い』『体が重い』と話す人が増えた。先輩は効き目を断言せず、暖かいお茶と静かな照明で、まず気持ちがほどける時間を作る。セラフィナは季節の花を小さく生け、来店した人が帰りに外の空気を楽しめるよう声をかけた。仕事の成果は数字だけでは測れない。けれど、予約表に同じ名前が戻ってくることが、信頼の形のひとつだった。閉店準備の頃、先輩は『季節に置いていかれないようにね』と冗談を言った。体も街も、少しずつ衣替えをしていく。","options":[{"label":"季節の花を受付に生ける","result":"花を見た常連が、帰りに花屋へ寄ると笑った。癒しの連鎖は、店の外でも続いていく。","shoku":0,"iyashi":3,"money":500},{"label":"常連の話をゆっくり聞く","result":"話し終えた人は、来た時より穏やかな顔で頷いた。聞く時間も、立派な仕事だった。","shoku":0,"iyashi":2,"money":700}]},"5-nippon":{"title":"仕事道具を選ぶ目","text":"日本橋の一角には、サロンで使うタオルやアロマ用品を扱う店もあった。セラフィナは香りを一つずつ確かめ、肌に触れる布の厚みを手で比べる。派手な宣伝文句よりも、洗いやすさや、部屋に残りすぎない香りを選ぶ姿は、すっかり仕事人のものだった。ルチアは『買い物にも染まってる』と笑ったが、自分用に甘い香りの小袋をひとつ、そっと籠へ入れていた。店員は用途を聞くと、宣伝文句ではなく保管方法から説明してくれた。信頼できる店の選び方も、仕事道具のうちだと感じた。","options":[{"label":"香りと手触りを比べて選ぶ","result":"道具選びの基準が少し増えた。良い仕事は、客に触れる前の準備から始まっていた。","shoku":2,"iyashi":2,"money":0},{"label":"先輩への相談メモを作る","result":"独断で買わず、店で働く人の意見を聞くことにした。学ぶ姿勢が、買い物にも表れていた。","shoku":1,"iyashi":3,"money":0}]},"5-home":{"title":"手を休める日","text":"仕事を覚えるほど、セラフィナの手には小さな疲れが残るようになった。温かいタオルで手を包み、モコを膝に乗せて、何もしない時間を作る。以前なら『もっと誰かを助けなければ』と焦ったかもしれない。けれど倒れた日のことを思い出すと、休むことも仕事の一部だと分かる。モコの規則正しい寝息が、今日の予定表より正確に、休む時刻を教えてくれた。膝のモコが小さく身じろぎし、セラフィナは慌てて姿勢を戻した。休む時間にも相手がいる。その気づかいが、心をほどいていく。","options":[{"label":"温かいタオルで手をいたわる","result":"指先の力が抜け、明日の仕事への不安も薄れた。自分の体を聞く練習にもなった。","shoku":0,"iyashi":3,"money":0},{"label":"モコと昼寝して体力を戻す","result":"目覚めた時、部屋の光が少し傾いていた。しっかり休んだ体は、素直に軽かった。","shoku":0,"iyashi":2,"money":0},{"label":"静かに座って呼吸を数える","result":"予定も成果もない数分間。けれど、その空白が心の皺を伸ばしてくれた。","shoku":0,"iyashi":0,"money":0}]},"5-salon":{"title":"給料日の小さな達成感","text":"サロンの休憩室で、先輩が今月の勤務表を見せてくれた。セラフィナの名前の横には、研修を終えた印と、常連から名指しで届いた感想が添えられている。『誰かの帰り道を少し明るくできた』という実感は、天界の報告書よりも身近な形で胸に残った。帰り際には、感謝の手紙をファイルへまとめる仕事も任された。仕事は施術室の中だけで完結せず、言葉を受け取る所まで続いていた。休憩室を出る時、自分の名前が書かれた小さなロッカーが目に入った。働く場所に自分の場所がある。その事実が、背筋を伸ばさせた。","options":[{"label":"感謝の手紙をファイルにまとめる","result":"感謝の手紙束を託された。ページごとに、仕事を続ける理由が静かに増えていった。","shoku":0,"iyashi":3,"money":1200,"item":"gratitude_letter"},{"label":"次の勤務に向けて技術メモを整える","result":"先輩から追加の仕事を任され、謝礼が増えた。積み重ねは、給料明細の数字にも表れ始めていた。","shoku":0,"iyashi":2,"money":1800}]},"6-nippon":{"title":"日用品と好きなものの両立","text":"日本橋の買い物籠には、洗剤とタオル、そして小さな推し活グッズが同居していた。生活に必要なものと、心が躍るもの。その両方を選ぶ姿に、店員は『一人暮らしが上手ですね』と笑う。セラフィナは少し照れながら、値段と残りの日数を頭の中で計算した。大阪の生活者として染まることは、欲しいものを我慢することでも、無計画に買うことでもなく、暮らしの中で選び取ることだった。レジで受け取ったポイントカードには、小さな星のスタンプが押された。暮らしの積み重ねが、目に見える形になるのは少し嬉しかった。","options":[{"label":"家計メモを見ながら買い分ける","result":"必要な物と好きな物が、喧嘩せずに袋へ収まった。生活の技術が、またひとつ身についた。","shoku":3,"iyashi":1,"money":0},{"label":"店員に長持ちする日用品を聞く","result":"地味だが確かな品を選べた。暮らしを支える物ほど、静かに頼もしかった。","shoku":1,"iyashi":2,"money":0}]},"6-home":{"title":"模様替えと猫の検品","text":"部屋の模様替えを始めると、モコとノワールが新しい家具の位置を一つずつ検品しに来た。本棚の向きを変え、棚の天使を窓に近づけ、猫たちの昼寝場所を最後に決める。ルチアは『悪魔の部屋より居心地がいいのは悔しい』と言いながら、クッションの座り心地を確かめている。家は、任務のための仮住まいではなく、帰ってくる人の顔を覚えていく場所になっていた。模様替えの途中で見つけた古いメモには、大阪に来たばかりの頃の震える字が残っていた。今の字と比べると、少しだけ丸くなっている。","options":[{"label":"猫たちの場所を優先して整える","result":"窓辺の特等席が完成した。人間と天使と悪魔は、その周りに自然と集まってきた。","shoku":1,"iyashi":3,"money":0},{"label":"棚と机を思い切って並べ替える","result":"部屋が少し広く見えた。暮らしの形を自分で決める楽しさに、また染まってしまった。","shoku":3,"iyashi":1,"money":0},{"label":"途中の床に座って休む","result":"模様替えは未完成のまま終わった。けれど、散らかった部屋でのお茶も悪くなかった。","shoku":0,"iyashi":0,"money":0}]},"6-salon":{"title":"紹介で来た新しい客","text":"商店街の常連が、友人を連れてサロンへ来た。『この人に一度、話を聞いてもらいたくて』という紹介の言葉に、セラフィナは少し緊張する。先輩は無理のない範囲で予定を組み、セラフィナには受付と帰り際の案内を任せた。人づきあいは、店の宣伝よりもゆっくり広がる。けれど一度結ばれた縁は、季節の挨拶や小さな差し入れになって、確かに戻ってきていた。紹介客が帰った後、常連は『ええ仕事してたで』と店員のように頷いた。町の評価は、拍手ではなく日常の言葉で届く。","options":[{"label":"紹介客を丁寧に案内する","result":"帰り際、二人から次の予約の相談があった。信頼が人を連れてくる瞬間を目撃した。","shoku":0,"iyashi":3,"money":900},{"label":"常連への礼状をしたためる","result":"短い礼状に、店の電話番号ではなく手書きの花の絵を添えた。心のこもった仕事が評価された。","shoku":0,"iyashi":2,"money":700}]},"7-nippon":{"title":"先輩への土産探し","text":"ガブリエラへの土産を探して、日本橋を歩く。厳格な先輩には、派手な飾りよりも、大阪で過ごした日々が伝わるものがよい。店員と相談しながら、セラフィナは小さな箱と手書きのカードを選んだ。自分が染まった証拠を隠すのではなく、そこで得た笑顔ごと渡したい。そう思えるようになったことが、視察の前とは違う成長だった。ルチアは横で『報告書より饅頭よ』と、実に悪魔らしい助言をしていた。包み紙の色で最後まで迷うと、店員が『相手を思う時間も贈り物です』と笑った。その一言を、カードの余白に書き添えたくなった。","options":[{"label":"店員と相談して丁寧に選ぶ","result":"土産の箱には、大阪の色が少しずつ詰まった。渡す相手の顔を思い浮かべる買い物は温かかった。","shoku":2,"iyashi":3,"money":0},{"label":"ルチアの助言も聞いて甘い物を足す","result":"箱の隅に、小さな焼き菓子が増えた。先輩の頬が少しでも緩めば、それで作戦成功である。","shoku":3,"iyashi":2,"money":0}]},"7-home":{"title":"報告書と手紙の夜","text":"机には天界へ送る報告書と、大阪で受け取った手紙が並んでいた。数字で測れる成果は少ない。けれど、名前を呼んでくれる人、帰り際に笑う人、一緒にお茶を飲む悪魔と先輩がいる。セラフィナは報告書の最後に、整いすぎていない一文を添えた。モコはその紙の端に座り、提出を少しだけ遅らせる。残る日々は有限でも、今日の温かさは今日のものとして確かにあった。モコが報告書から降りると、紙の端には小さな足跡が残っていた。完璧ではない記録も、この町で生きた証として悪くなかった。","options":[{"label":"手紙を読み返して返事を書く","result":"返事の便箋には、大阪の夕日色の封筒を選んだ。つながりは、送って終わりではなかった。","shoku":1,"iyashi":3,"money":0},{"label":"報告書に正直な一文を添える","result":"飾らない言葉が、かえって胸に残った。自分の日々を、自分の言葉で天界へ届けられた。","shoku":2,"iyashi":2,"money":0},{"label":"机の前で静かに目を閉じる","result":"書くべきことは、まだ頭の中で温まっている。急がず置いた時間が、言葉の輪郭を作っていった。","shoku":0,"iyashi":0,"money":0}]},"7-salon":{"title":"継続が決まった仕事場","text":"視察を経て、サロンの予定表にはセラフィナの名前が前よりはっきりと残るようになった。先輩は『ここでの仕事も、あなたの任務の一部として認められたのね』と笑う。常連たちは難しい話には触れず、いつものようにお茶を飲み、他愛ない近況を話していった。特別な祝福があるわけではない。けれど、明日も同じ場所で待っていると言えることが、セラフィナにとって大きな変化だった。帰り際、店の窓に映る自分の輪は薄かったが、表情は五百年前よりずっと人らしく笑っていた。先輩の言葉が、胸の中で静かに頷いた。","options":[{"label":"常連一人ひとりに挨拶する","result":"短い挨拶の積み重ねが、この場所の信用を作っていた。謝礼と一緒に、温かな差し入れも受け取った。","shoku":0,"iyashi":3,"money":1000},{"label":"先輩と次の目標を相談する","result":"新しい研修の話が出て、追加の仕事も任された。認められることは、次の責任の入口でもあった。","shoku":1,"iyashi":2,"money":1300}]}};

ない話で笑い合った。顔なじみとは、特別な約束なしに時間を分け合える関係だった。","shoku":1,"iyashi":3,"money":0}]},"shotengai-mid":{"title":"常連として扱われる日","text":"商店街の花屋は、セラフィナの顔を見ると『いつもの小さい花ね』と手を動かした。注文を言い終わる前に好みを覚えられている。その気恥ずかしさと嬉しさに、輪が少し揺れる。隣の魚屋では常連同士が夕飯の献立を相談し、セラフィナも輪に加わった。町の人にとって彼女は、珍しい来客ではなく、買い物ついでに世間話をする一員になりつつあった。別れ際、花屋が余った一輪を包んでくれた。常連扱いは値引きだけではなく、こうした小さな心遣いにも表れるのだと知った。","options":[{"label":"花屋と次の季節の花を相談する","result":"花の名前と咲く時期を教わった。暮らしの中に、未来の小さな楽しみが増えていく。","shoku":2,"iyashi":2,"money":0},{"label":"常連たちと献立の相談に加わる","result":"夕飯の主役は、安くて旬の魚に決まった。生活の知恵は、会話の中で受け継がれていく。","shoku":2,"iyashi":3,"money":0}]},"shotengai-late":{"title":"行事の手伝いと花の鉢","text":"商店街の小さな行事準備では、提灯の確認や椅子並べで人手が必要になっていた。セラフィナは顔なじみとして自然に声をかけられ、花屋の店先では水やりを待つ鉢植えが並ぶ。店主は『一鉢、預かってくれへん？　あんたの部屋なら大事にしてくれそうや』と笑った。頼られることは、町の歯車に組み込まれることでもある。重さではなく、居場所の確かさとして、その鉢は両手に収まった。鉢を受け取った帰り道、すれ違う店主たちが『頼んだで』と声をかけた。両手の重さは、町からの信頼の重さでもあった。","options":[{"label":"花屋の鉢植えを預かる","result":"商店街の鉢植えを託された。窓辺の緑が、町とのつながりを毎日思い出させてくれそうだった。","shoku":1,"iyashi":3,"money":0,"item":"shotengai_plant"},{"label":"行事の椅子並べを手伝う","result":"作業の後のお茶が、いつもよりおいしかった。町の一員として働く実感が、静かに残った。","shoku":1,"iyashi":2,"money":300}]}};
let seraphinaCollection = loadCollectionData();
let craneState = {active:false,pos:0,dir:1,timer:null};
function emptyCollection(){ return {items:{},endings:{},chapters:{}};}
function loadCollectionData(){
try{ const raw = localStorage.getItem(COLLECTION_KEY); if(!raw) return emptyCollection(); const d = JSON.parse(raw); return {items:(d&&d.items&&typeof d.items==="object")?d.items:{}, endings:(d&&d.endings&&typeof d.endings==="object")?d.endings:{}, chapters:(d&&d.chapters&&typeof d.chapters==="object")?d.chapters:{}};}catch(e){ return emptyCollection();}
}
function saveCollectionData(){ try{ localStorage.setItem(COLLECTION_KEY, JSON.stringify(seraphinaCollection));}catch(e){}}
function assetSrc(name){ return (typeof BGURI!== "undefined" && BGURI[name])? BGURI[name]: "assets/" + name + ".webp";}
function chapterForScene(sid){
if(!sid) return null;
if(sid.indexOf("end_")===0 || sid[0]==="g") return "final";
if(sid==="sys_intro" || sid[0]==="p") return "prologue";
if(sid[0]==="c") return "ch1";
if(sid[0]==="n" || sid[0]==="f" || sid==="teaser2") return "ch2";
if(sid[0]==="t") return "ch3";
if(sid[0]==="s") return "ch4";
if(sid[0]==="w") return "ch5";
if(sid[0]==="l") return "ch6";
if(sid[0]==="v") return "ch7";
if(sid[0]==="k") return "ch8";
if(sid.indexOf("INT")===0){ const map={INT1:"ch1",INT2:"ch2",INT3:"ch3",INT4:"ch4",INT5:"ch5",INT6:"ch6",INT7:"ch7"}; return map[sid]||null;}
return null;
}
function recordSceneProgress(sid){
const ch = chapterForScene(sid);
if(ch &&!seraphinaCollection.chapters[ch]){ seraphinaCollection.chapters[ch]=true; saveCollectionData();}
if(sid && sid.indexOf("end_")===0 && ENDING_DEFS[sid] &&!seraphinaCollection.endings[sid]){ seraphinaCollection.endings[sid]=true; saveCollectionData();}
}
function grantItem(id){
if(!ITEMS[id]) return false;
let newly = false;
if(S &&!S.items[id]){ S.items[id]=true; newly=true;}
if(!seraphinaCollection.items[id]){ seraphinaCollection.items[id]=true; newly=true; saveCollectionData();}
if(newly) seItem();
return newly;
}
function mergeCollectionFromRun(){
if(!S) return;
Object.keys(S.items||{}).forEach(id=>{ if(ITEMS[id]) seraphinaCollection.items[id]=true;});
saveCollectionData();
}
function normalizeState(d){
const base = newState();
if(!d || typeof d!=="object") return base;
base.scene = (typeof d.scene==="string" && SCENES[d.scene])? d.scene: "p0";
const sc = SCENES[base.scene];
base.line = Number.isFinite(d.line)? Math.max(0, Math.min(sc.lines.length-1, Math.floor(d.line))): 0;
base.shoku = Number.isFinite(d.shoku)? Math.max(0, Math.floor(d.shoku)): 0;
base.iyashi = Number.isFinite(d.iyashi)? Math.max(0, Math.floor(d.iyashi)): 0;
base.flags = (d.flags && typeof d.flags==="object" &&!Array.isArray(d.flags))? d.flags: {};
base.log = Array.isArray(d.log)? d.log: [];
base.money = Number.isFinite(d.money)? Math.max(0, Math.floor(d.money)): 3000;
base.items = {};
if(d.items && typeof d.items==="object" &&!Array.isArray(d.items)){ Object.keys(d.items).forEach(id=>{ if(ITEMS[id] && d.items[id]) base.items[id]=true;});}
base.free = null;
if(d.free && typeof d.free==="object" && base.scene.indexOf("INT")===0){
const idx = Number.isFinite(d.free.idx)? Math.floor(d.free.idx): parseInt(base.scene.replace("INT",""),10);
if(idx>=1 && idx<=7 && SCENES[base.scene] && SCENES[base.scene].interlude===idx){
base.free = {idx:idx,target:SCENES[base.scene].target,slot:Number.isFinite(d.free.slot)?Math.max(0,Math.min(2,Math.floor(d.free.slot))):0,view:["choose","event","result","finish","shop","gacha","crane"].indexOf(d.free.view)>=0?d.free.view:"choose",dest:(d.free.dest&&FREE_DESTS[d.free.dest])?d.free.dest:null,eventKey:(typeof d.free.eventKey==="string")?d.free.eventKey:null,result:(typeof d.free.result==="string")?d.free.result:"",effectText:(typeof d.free.effectText==="string")?d.free.effectText:"",notice:(typeof d.free.notice==="string")?d.free.notice:"",shopMsg:(typeof d.free.shopMsg==="string")?d.free.shopMsg:"",gachaMsg:(typeof d.free.gachaMsg==="string")?d.free.gachaMsg:"",craneMsg:(typeof d.free.craneMsg==="string")?d.free.craneMsg:""};
if(!base.free.dest && ["event","result","shop","gacha","crane"].indexOf(base.free.view)>=0) base.free.view="choose";
}
}
return base;
}

if(rw.item && grantItem(rw.item)) toast("グッズ図鑑に登録："+ITEMS[rw.item].name);
updateHUD();
}

const BGM_SHRINE_BG = {"03-meeting-amaterasu":1,"04-amaterasu-tea":1,"07-meeting-kannon":1,"08-kannon-and-seraphina":1,"27-hatsumode":1,"02-sumiyoshi-bridge":1,"media-generation-09-inari-shrine-visit-0-7e512796-f25c-4f0e-a7e9-71e9c4941395":1,"media-generation-17-ema-wishes-0-c75692b5-a001-43a1-a169-a553e70f1339":1,"media-generation-26-healing-together-kannon-0-3fdee95a-7810-46fd-8688-e2b79935e7dd":1,"media-generation-28-sumiyoshi-dusk-farewell-0-9ec7dd29-1cd8-47c4-90d2-a3e53721b3e2":1};
const BGM_NIGHT_BG = {"22-night-view":1,"27-nipponbashi-neon-night":1,"28-osaka-sunset-tadaima":1,"28-dusk-walk":1,"24-kotatsu":1,"23-first-snow":1,"25-christmas-lights":1,"18-tsukimi":1,"media-generation-29-window-lights-night-0-37a01af4-7bfe-4aa5-b02b-962a52478ada":1};
const BGM_FEST_BG = {"11-summer-festival":1,"13-fireworks":1,"media-generation-19-festival-night-0-f58d3bb3-6560-4839-9008-6c3c8917476c":1};
function themeForScene(sid, bg){
if(!sid) return "title";
if(sid.indexOf("end_")===0) return "ending";
if(sid.indexOf("INT")===0) return "osaka";
if(bg && BGM_FEST_BG[bg]) return "festival";
if((bg && BGM_SHRINE_BG[bg]) || sid[0]==="k") return "shrine";
if(sid[0]==="v") return "gabriela";
if(sid[0]==="t") return "lucia";
if(bg && BGM_NIGHT_BG[bg]) return "night";
if((bg && BGM_HEAVEN_BG[bg]) || sid[0]==="p" || sid[0]==="g") return "heaven";
if((bg && BGM_NIPPON_BG[bg]) || sid[0]==="n" || sid[0]==="f") return "nipponbashi";
return "osaka";
}
let AC = null, bgmGain = null, seGain = null, noiseBuf = null;
let wantTheme = "title";
let bgmCur = {theme:null, step:0, next:0, timer:null};
let lastMoney = null, lastAudioScene = null;
let voiceEl = null;
function audioCtx(){
try{
if(!AC){
const Ctor = (typeof window!=="undefined")? (window.AudioContext || window.webkitAudioContext): null;
if(!Ctor) return null;
AC = new Ctor();
bgmGain = AC.createGain(); bgmGain.connect(AC.destination);
seGain = AC.createGain(); seGain.connect(AC.destination);
applyAudioVolumes();
}
if(AC.state==="suspended"){ const p = AC.resume(); if(p && p.catch) p.catch(()=>{}); }
return AC;
}catch(e){ return null; }
}
function applyAudioVolumes(){
try{
if(bgmGain) bgmGain.gain.value = [0.20,0.42,0.68][audioSet.bgmVol-1] || 0.42;
if(seGain) seGain.gain.value = 0.9;
}catch(e){}
}
function mf(m){ return 440*Math.pow(2,(m-69)/12); }
function toneAt(m, t, dur, type, vol, dest){
if(!AC) return;
try{
const o = AC.createOscillator(), g = AC.createGain();
o.type = type; o.frequency.value = mf(m);
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002), t+0.02);
g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
o.connect(g); g.connect(dest || bgmGain);
o.start(t); o.stop(t+dur+0.05);
}catch(e){}
}
function padAt(m, t, dur, vol){
if(!AC) return;
try{
const o = AC.createOscillator(), g = AC.createGain();
o.type = "triangle"; o.frequency.value = mf(m);
g.gain.setValueAtTime(0.0001, t);
g.gain.linearRampToValueAtTime(vol, t+Math.min(0.5, dur*0.3));
g.gain.setValueAtTime(vol, t+dur*0.7);
g.gain.linearRampToValueAtTime(0.0001, t+dur);
o.connect(g); g.connect(bgmGain);
o.start(t); o.stop(t+dur+0.05);
}catch(e){}
}
function hatAt(t, vol){
if(!AC) return;
try{
if(!noiseBuf){ noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate*0.08), AC.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
const s = AC.createBufferSource(); s.buffer = noiseBuf;
const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6500;
const g = AC.createGain();
g.gain.setValueAtTime(vol, t);
g.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
s.connect(f); f.connect(g); g.connect(bgmGain);
s.start(t); s.stop(t+0.07);
}catch(e){}
}
function donAt(t){
if(!AC) return;
try{
const o = AC.createOscillator(), g = AC.createGain();
o.type = "sine";
o.frequency.setValueAtTime(150, t);
o.frequency.exponentialRampToValueAtTime(52, t+0.16);
g.gain.setValueAtTime(0.28, t);
g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
o.connect(g); g.connect(bgmGain);
o.start(t); o.stop(t+0.25);
}catch(e){}
}
function bgmScheduleStep(th, step, t, spb){
const m = th.mel[step];
if(m) toneAt(m, t, Math.min(0.55, spb*3.2), th.lead, th.lv, bgmGain);
const b = th.bass[step];
if(b) toneAt(b, t, spb*1.9, "sine", 0.17, bgmGain);
if(step%8===0){ const ch = th.pad[Math.floor(step/8)%th.pad.length]; if(ch) ch.forEach(n=>padAt(n, t, spb*8.2, 0.028)); }
if(th.hat && step%4===2) hatAt(t, 0.045);
if(th.don && step%8===0) donAt(t);
if(th.don && step%8===5) donAt(t);
}
function bgmTick(){
if(!AC || !bgmCur.theme) return;
const th = BGM_THEMES[bgmCur.theme]; if(!th) return;
const spb = 60/th.bpm/4;
try{
while(bgmCur.next < AC.currentTime + 0.45){
bgmScheduleStep(th, bgmCur.step, Math.max(bgmCur.next, AC.currentTime+0.02), spb);
bgmCur.step = (bgmCur.step+1) % th.mel.length;
bgmCur.next += spb;
}
}catch(e){}
}
function bgmStart(theme){
bgmStop();
if(!AC || !BGM_THEMES[theme]) return;
bgmCur.theme = theme; bgmCur.step = 0; bgmCur.next = AC.currentTime + 0.08;
bgmCur.timer = setInterval(bgmTick, 180);
bgmTick();
}
function bgmStop(){
if(bgmCur.timer){ clearInterval(bgmCur.timer); bgmCur.timer = null; }
bgmCur.theme = null;
}
function setTheme(name){
wantTheme = name;
if(!audioSet.bgm){ bgmStop(); return; }
if(!AC) return;
if(bgmCur.theme===name && bgmCur.timer) return;
bgmStart(name);
}
function audioUserStart(){
const c = audioCtx();
if(c && audioSet.bgm) bgmStart(wantTheme);
}
function audioToTitle(){
stopVoice(); stopSpeak();
setTheme("title");
}
function audioTap(){
audioUserStart();
seTap();
}
function audioSceneHook(){
try{
if(!S) return;
const sc = SCENES[S.scene]; if(!sc) return;
setTheme(themeForScene(S.scene, sc.bg));
if(sc.interlude && lastAudioScene!==S.scene) seFanfare();
lastAudioScene = S.scene;
}catch(e){}
}
function audioMoneyWatch(){
try{
if(!S) return;
const m = S.money||0;
if(lastMoney===null){ lastMoney = m; return; }
if(m>lastMoney) seCoin(true);
else if(m<lastMoney) seCoin(false);
lastMoney = m;
}catch(e){}
}
function seTone(m, delay, dur, type, vol){
if(!AC) return;
try{ toneAt(m, AC.currentTime + (delay||0), dur, type, vol, seGain); }catch(e){}
}
function seTap(){ if(!AC) return; seTone(88, 0, 0.07, "square", 0.05); }
function seCoin(up){
if(!AC) return;
if(up){ seTone(79, 0, 0.08, "sine", 0.16); seTone(88, 0.07, 0.14, "sine", 0.16); }
else { seTone(88, 0, 0.08, "sine", 0.13); seTone(76, 0.07, 0.13, "sine", 0.13); }
}
function seGacha(){
if(!AC) return;
try{
const t = AC.currentTime;
const o = AC.createOscillator(), g = AC.createGain();
o.type = "square";
o.frequency.setValueAtTime(620, t);
o.frequency.exponentialRampToValueAtTime(180, t+0.24);
g.gain.setValueAtTime(0.07, t);
g.gain.exponentialRampToValueAtTime(0.0001, t+0.26);
o.connect(g); g.connect(seGain);
o.start(t); o.stop(t+0.28);
}catch(e){}
seTone(64, 0.27, 0.1, "sine", 0.2);
seTone(88, 0.34, 0.16, "sine", 0.16);
}
function seCraneOK(){ if(!AC) return; [76,83,88,95].forEach((m,i)=>seTone(m, i*0.09, 0.16, "sine", 0.15)); }
function seCraneNG(){
if(!AC) return;
try{
const t = AC.currentTime;
const o = AC.createOscillator(), g = AC.createGain();
o.type = "sawtooth";
o.frequency.setValueAtTime(196, t);
o.frequency.exponentialRampToValueAtTime(98, t+0.22);
g.gain.setValueAtTime(0.06, t);
g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
o.connect(g); g.connect(seGain);
o.start(t); o.stop(t+0.26);
}catch(e){}
}
function seItem(){ if(!AC) return; seTone(93, 0, 0.12, "sine", 0.13); seTone(100, 0.08, 0.2, "sine", 0.12); }
function seFanfare(){ if(!AC) return; [72,76,79,84].forEach((m,i)=>seTone(m, i*0.09, 0.34, "triangle", 0.14)); }
function voiceSrc(name){ return (typeof AUDIOURI!=="undefined" && AUDIOURI[name])? AUDIOURI[name]: "assets/audio/" + name; }
function stopVoice(){
try{ if(voiceEl){ voiceEl.pause(); voiceEl = null; } }catch(e){}
}
function playVoice(file){
if(!audioSet.voice) return;
try{
if(typeof Audio==="undefined") return;
stopVoice(); stopSpeak();
voiceEl = new Audio(voiceSrc(file));
voiceEl.volume = [0.45,0.75,1][audioSet.voiceVol-1] || 0.75;
const p = voiceEl.play();
if(p && p.catch) p.catch(()=>{});
}catch(e){}
}
function ttsAvailable(){
try{ return typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined"; }catch(e){ return false; }
}
const TTS_PITCH = {"セラフィナ":1.15,"ルチア":1.05,"ガブリエラ":0.9,"モコ":1.4,"ノワール":1.3};
function stopSpeak(){
if(!ttsAvailable()) return;
try{ speechSynthesis.cancel(); }catch(e){}
}
function speakLine(who, text){
if(!audioSet.tts || !ttsAvailable() || !text) return;
try{
speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
u.lang = "ja-JP";
u.rate = 1.12;
u.pitch = TTS_PITCH[who] || 1.0;
try{
const vs = speechSynthesis.getVoices();
if(vs && vs.length){ for(let i=0;i<vs.length;i++){ if((vs[i].lang||"").indexOf("ja")===0){ u.voice = vs[i]; break; } } }
}catch(e){}
speechSynthesis.speak(u);
}catch(e){}
}
function onLineShown(){
try{
if(!S) return;
const sc = SCENES[S.scene]; if(!sc || sc.interlude) return;
const line = sc.lines[S.line]; if(!line) return;
if(S.scene.indexOf("end_")===0 && S.line===0) seFanfare();
const key = S.scene + ":" + S.line;
if(VOICE_CLIPS[key]){ playVoice(VOICE_CLIPS[key]); }
else { stopVoice(); speakLine(line[0]||"", line[1]||""); }
}catch(e){}
}
function renderSoundSettings(){
const body = document.getElementById("soundBody"); if(!body) return;
const onoff = v => v? "オン": "オフ";
const vol = v => ["小","中","大"][v-1] || "中";
let html = '<p class="colnote">音の設定は、この端末に保存されます。BGMは端末の中で合成しているオリジナル曲で、場面に合わせて自動で切り替わります。</p>';
html += '<button class="slot" id="sbBgm">BGM：'+onoff(audioSet.bgm)+'</button>';
html += '<button class="slot" id="sbBgmVol">BGM音量：'+vol(audioSet.bgmVol)+'</button>';
html += '<button class="slot" id="sbVoice">決め台詞ボイス：'+onoff(audioSet.voice)+'</button>';
html += '<button class="slot" id="sbVoiceVol">ボイス音量：'+vol(audioSet.voiceVol)+'</button>';
html += '<button class="slot" id="sbTts">全台詞読み上げ：'+onoff(audioSet.tts)+'</button>';
html += '<p class="colnote">'+(ttsAvailable()? "読み上げは端末の音声合成（日本語）を使います。決め台詞ボイスのある行では、ボイスが優先されます。": "この端末・ブラウザでは音声合成が使えないため、読み上げは利用できません。")+'</p>';
body.innerHTML = html;
const bind = (id, fn)=>{ const el = document.getElementById(id); if(el) el.addEventListener("click", fn); };
bind("sbBgm", ()=>{ audioSet.bgm = !audioSet.bgm; saveAudioSettings(); if(audioSet.bgm){ audioUserStart(); setTheme(wantTheme); } else bgmStop(); renderSoundSettings(); });
bind("sbBgmVol", ()=>{ audioSet.bgmVol = audioSet.bgmVol%3 + 1; saveAudioSettings(); applyAudioVolumes(); audioUserStart(); renderSoundSettings(); });
bind("sbVoice", ()=>{ audioSet.voice = !audioSet.voice; saveAudioSettings(); if(!audioSet.voice) stopVoice(); renderSoundSettings(); });
bind("sbVoiceVol", ()=>{ audioSet.voiceVol = audioSet.voiceVol%3 + 1; saveAudioSettings(); if(voiceEl) voiceEl.volume = [0.45,0.75,1][audioSet.voiceVol-1] || 0.75; renderSoundSettings(); });
bind("sbTts", ()=>{ audioSet.tts = !audioSet.tts; saveAudioSettings(); if(!audioSet.tts) stopSpeak(); renderSoundSettings(); });
}
function openSound(){
renderSoundSettings();
document.getElementById("soundModal").style.display = "block";
}
document.getElementById("mSound").addEventListener("click", e=>{ e.stopPropagation(); audioUserStart(); openSound(); });
if(document.addEventListener) document.addEventListener("pointerdown", ()=>{ audioUserStart(); }, {once:true});
S = newState();
document.getElementById("bg").src = "assets/02-florence.webp";
updateHUD();
</script>
