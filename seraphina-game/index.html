セラフィナはお茶と小さな菓子を用意しました。人同士の距離も猫たちと同じなのかもしれません。無理に縮めなくても、同じ景色を見ていれば隣が当たり前になっていきます。やがてノワールがモコの隣で丸くなり、ルチアも観念したように菓子へ手を伸ばしました。作戦会議は、いつの間にかお茶会へ姿を変えていたのです。","options":[{"label":"四人分のお茶を用意する","result":"ルチアは文句を言いながら、猫たちと同じ窓辺に座りました。静かな時間は、誰の作戦でもありませんでした。","shoku":1,"iyashi":3,"money":0},{"label":"モコとノワールの写真を撮る","result":"シャッターの瞬間、二匹が同時にこちらを見ました。ルチアはその写真を、なぜか保存していたのです。","shoku":2,"iyashi":2,"money":0},{"label":"窓辺で何もせず過ごす","result":"会話のない時間も、不思議と居心地が悪くありませんでした。隣にいることを、急いで名前で呼ばなくてもよかったのです。","shoku":0,"iyashi":0,"money":0}]},"3-salon":{"title":"お客さんのふりをしたルチア","text":"サロンの予約表に、見慣れない名前がありました。現れたのは帽子で角を隠したルチアです。『癒しの実力を確かめに来たの』と言うものの、受付に座る姿は少し緊張していました。セラフィナは知らないふりをして温かいお茶を出し、柚月さんへ取り次ぎます。施術室から出てきたルチアは肩を回し、『べ、別に……悪くなかったわ』とだけ言い、正規の料金と大きめの心づけを置いて帰りました。店を出たあとも小さく『また予約、入れるかも』と漏らし、セラフィナは聞こえないふりで受付の花を整えました。","options":[{"label":"最後まで丁寧に接客する","result":"悪魔の偵察は、満足そうな背中で終わりました。敵にも味方にも、丁寧な接客は届くものらしいです。","shoku":1,"iyashi":3,"money":800},{"label":"帰り際に甘い飴を渡す","result":"ルチアは飴を握りしめ、振り返らずに手を振りました。次に来る理由が、ひとつ増えたようでした。","shoku":2,"iyashi":2,"money":600}]},"4-nippon":{"title":"季節の入れ替え市で迷う色","text":"日本橋の店先では、季節の入れ替えで小さな市が開かれていました。春のカード、夏の扇子、秋色のリボン、冬の手袋が、少しずつ値札を変えて並んでいます。セラフィナは過ぎた季節の品を手に取り、次に来る季節の色を選びました。店員さんは『季節ものは、思い出ごと持ち帰る人が多いんです』と話します。『なんで今のうちに選ぶんやろ、と思ったら、未来を選んでたんですね』と口にして、はっと口元を押さえました。帰り際に入荷日を教えてもらい、予定表へ小さな印を付けます。","options":[{"label":"次の季節の小物を選ぶ","result":"小さな袋の中に、これからの予定が入りました。未来の季節を楽しみにできることが、少し大人びて感じられました。","shoku":3,"iyashi":1,"money":0},{"label":"過ぎた季節の品を丁寧に眺める","result":"値札の裏に、店員さんの短いおすすめ文がありました。季節を大切にする人の手触りが、品物に残っていました。","shoku":2,"iyashi":2,"money":0}]},"4-home":{"title":"四季の品をしまう午後","text":"机の上には桜の押し花、夏祭りのうちわ、紅葉のしおり、雪の日に買った手袋が並びました。一つずつ手に取り、どの日に誰と、どんな空の下で手に入れたかを思い出します。モコはうちわの端を前足で押さえ、片づけを邪魔しながら参加していました。品をしまう作業は季節を閉じることではなく、来年また開ける約束を置くことでした。最後に残ったのは名前を書き忘れた小さな葉書です。誰から届いたのか思い出せず、笑って来年の自分へ問いを残しました。季節の色が、手のひらにまだ残っている気がします。","options":[{"label":"写真と押し花でアルバムを完成させる","result":"四季の思い出アルバムが完成しました。ページを閉じても、季節の色が手のひらに残っている気がしました。","shoku":1,"iyashi":3,"money":0,"item":"season_album"},{"label":"モコと一緒にのんびり片づける","result":"片づけは遅れましたが、笑う回数は増えました。思い出は、急がず触れる方が鮮やかに残ります。","shoku":0,"iyashi":3,"money":0},{"label":"途中で横になって休む","result":"品々は半分だけ片づきました。けれど体は正直で、短い眠りが次の季節への力を戻してくれました。","shoku":0,"iyashi":0,"money":0}]},"4-salon":{"title":"季節の変わり目、柚月さんの灯り","text":"季節が移る頃、サロンには『なんとなく眠い』『体が重い』と話す人が増えました。柚月さんは効き目を断言せず、温かいお茶と静かな照明で、まず気持ちがほどける時間を作ります。セラフィナは季節の花を小さく生け、帰りに外の空気を楽しめるよう声をかけました。仕事の成果は数字だけでは測れません。けれど予約表に同じ名前が戻ってくることが、信頼の形のひとつでした。閉店準備の頃、柚月さんは『季節に置いていかれないようにね』と冗談を言い、体も街も少しずつ衣替えをしていくのだと感じました。","options":[{"label":"季節の花を受付に生ける","result":"花を見た常連さんが、帰りに花屋へ寄ると笑いました。癒しの連鎖は、店の外でも続いていきます。","shoku":0,"iyashi":3,"money":500},{"label":"常連さんの話をゆっくり聞く","result":"話し終えた人は、来た時より穏やかな顔で頷きました。聞く時間も、立派な仕事でした。","shoku":0,"iyashi":2,"money":700}]},"5-nippon":{"title":"仕事道具を選ぶ目が育つ頃","text":"日本橋の一角には、サロンで使うタオルやアロマ用品を扱う店もありました。セラフィナは香りを一つずつ確かめ、肌に触れる布の厚みを手で比べます。派手な宣伝文句よりも、洗いやすさや部屋に残りすぎない香りを選ぶ姿は、すっかり仕事人のものでした。ルチアは『買い物まで染まってるわね』と笑いながら、自分用に甘い香りの小袋をそっと籠へ入れています。店員さんが用途を聞き、保管方法から説明してくれる様子に、信頼できる店の選び方も仕事道具のうちだと感じました。","options":[{"label":"香りと手触りを比べて選ぶ","result":"道具選びの基準が少し増えました。良い仕事は、お客さんに触れる前の準備から始まっていました。","shoku":2,"iyashi":2,"money":0},{"label":"柚月さんへの相談メモを作る","result":"独断で買わず、店で働く人の意見を聞くことにしました。学ぶ姿勢が、買い物にも表れていました。","shoku":1,"iyashi":3,"money":0}]},"5-home":{"title":"手を休める日、モコの寝息","text":"仕事を覚えるほど、セラフィナの手には小さな疲れが残るようになりました。温かいタオルで手を包み、モコを膝に乗せて、何もしない時間を作ります。以前なら『もっと誰かを助けなければ』と焦ったかもしれません。けれど倒れた日のことを思い出すと、休むことも仕事の一部だと分かります。モコの規則正しい寝息が、今日の予定表より正確に休む時刻を教えてくれました。膝の上でモコが小さく身じろぎすると、慌てて姿勢を戻します。休む時間にも相手がいる。その気づかいが、心を静かにほどいていきました。","options":[{"label":"温かいタオルで手をいたわる","result":"指先の力が抜け、明日の仕事への不安も薄れました。自分の体を聞く練習にもなりました。","shoku":0,"iyashi":3,"money":0},{"label":"モコと昼寝して体力を戻す","result":"目覚めた時、部屋の光が少し傾いていました。しっかり休んだ体は、素直に軽かったです。","shoku":0,"iyashi":2,"money":0},{"label":"静かに座って呼吸を数える","result":"予定も成果もない数分間でした。けれど、その空白が心の皺を伸ばしてくれました。","shoku":0,"iyashi":0,"money":0}]},"5-salon":{"title":"給料日、小さなロッカーの前で","text":"サロンの休憩室で、柚月さんが今月の勤務表を見せてくれました。セラフィナの名前の横には、研修を終えた印と、常連さんから名指しで届いた感想が添えられています。誰かの帰り道を少し明るくできた実感は、天界の報告書よりも身近な形で胸に残りました。帰り際には感謝の手紙をファイルへまとめる仕事も任されます。仕事は施術室の中だけで完結せず、言葉を受け取る所まで続いていました。休憩室を出る時、自分の名前が書かれた小さなロッカーが目に入り、働く場所に自分の場所がある事実が背筋を伸ばさせました。","options":[{"label":"感謝の手紙をファイルにまとめる","result":"感謝の手紙束を託されました。ページごとに、仕事を続ける理由が静かに増えていきました。","shoku":0,"iyashi":3,"money":1200,"item":"gratitude_letter"},{"label":"次の勤務に向けて技術メモを整える","result":"柚月さんから追加の仕事を任され、謝礼が増えました。積み重ねは、給料明細の数字にも表れ始めていました。","shoku":0,"iyashi":2,"money":1800}]},"6-nippon":{"title":"日用品と推し活グッズの同居","text":"日本橋の買い物籠には、洗剤とタオル、そして小さな推し活グッズが同居していました。生活に必要なものと、心が躍るもの。その両方を選ぶ姿に、店員さんは『一人暮らしが上手ですね』と笑います。セラフィナは少し照れながら、値段と残りの日数を頭の中で計算しました。欲しいものを我慢することでも、無計画に買うことでもなく、暮らしの中で選び取ること。それが大阪の生活者として染まるということでした。レジで受け取ったポイントカードには小さな星の印が押され、暮らしの積み重ねが見える形になるのが少し嬉しくなりました。","options":[{"label":"家計メモを見ながら買い分ける","result":"必要な物と好きな物が、喧嘩せずに袋へ収まりました。生活の技術が、またひとつ身につきました。","shoku":3,"iyashi":1,"money":0},{"label":"店員さんに長持ちする日用品を聞く","result":"地味だけれど確かな品を選べました。暮らしを支える物ほど、静かに頼もしいものでした。","shoku":1,"iyashi":2,"money":0}]},"6-home":{"title":"模様替えと猫たちの検品","text":"部屋の模様替えを始めると、モコとノワールが新しい家具の位置を一つずつ検品しに来ました。本棚の向きを変え、棚の天使を窓に近づけ、猫たちの昼寝場所を最後に決めます。ルチアは『悪魔の部屋より居心地がいいのは悔しい』と言いながら、クッションの座り心地を確かめていました。家は任務のための仮住まいではなく、帰ってくる人の顔を覚えていく場所になっていたのです。途中で見つけた古いメモには、大阪に来たばかりの頃の震える字が残っていました。今の字と比べると、少しだけ丸くなっています。","options":[{"label":"猫たちの場所を優先して整える","result":"窓辺の特等席が完成しました。人間と天使と悪魔は、その周りに自然と集まってきました。","shoku":1,"iyashi":3,"money":0},{"label":"棚と机を思い切って並べ替える","result":"部屋が少し広く見えました。暮らしの形を自分で決める楽しさに、また染まってしまいました。","shoku":3,"iyashi":1,"money":0},{"label":"途中の床に座って休む","result":"模様替えは未完成のまま終わりました。けれど、散らかった部屋でのお茶も悪くありませんでした。","shoku":0,"iyashi":0,"money":0}]},"6-salon":{"title":"紹介で来た新しいお客さん","text":"商店街の常連さんが、友人を連れてサロンへ来ました。『この人に一度、話を聞いてもらいたくて』という紹介の言葉に、セラフィナは少し緊張します。柚月さんは無理のない範囲で予定を組み、セラフィナには受付と帰り際の案内を任せてくれました。人づきあいは店の宣伝よりもゆっくり広がります。けれど一度結ばれた縁は、季節の挨拶や小さな差し入れになって確かに戻ってきていました。紹介のお客さんが帰ったあと、常連さんは『ええ仕事してたで』と頷き、町の評価は拍手ではなく日常の言葉で届くのだと知りました。","options":[{"label":"紹介のお客さんを丁寧に案内する","result":"帰り際、二人から次の予約の相談がありました。信頼が人を連れてくる瞬間を目撃しました。","shoku":0,"iyashi":3,"money":900},{"label":"常連さんへの礼状をしたためる","result":"短い礼状に、店の電話番号ではなく手書きの花の絵を添えました。心のこもった仕事が評価されました。","shoku":0,"iyashi":2,"money":700}]},"7-nippon":{"title":"ガブリエラへの土産探し","text":"ガブリエラへの土産を探して、日本橋を歩きました。厳格な先輩には派手な飾りよりも、大阪で過ごした日々が伝わるものがよいはずです。店員さんと相談しながら、小さな箱と手書きのカードを選びました。自分が染まった証拠を隠すのではなく、そこで得た笑顔ごと渡したい。そう思えるようになったことが、視察の前とは違う成長でした。横でルチアが『報告書より饅頭よ』と助言をし、包み紙の色で迷うと、店員さんは『相手を思う時間も贈り物です』と笑いました。その一言を、カードの余白に書き添えたくなります。","options":[{"label":"店員さんと相談して丁寧に選ぶ","result":"土産の箱には、大阪の色が少しずつ詰まりました。渡す相手の顔を思い浮かべる買い物は温かかったです。","shoku":2,"iyashi":3,"money":0},{"label":"ルチアの助言も聞いて甘い物を足す","result":"箱の隅に、小さな焼き菓子が増えました。先輩の頬が少しでも緩めば、それで作戦成功です。","shoku":3,"iyashi":2,"money":0}]},"7-home":{"title":"報告書と手紙とモコの足跡","text":"机には天界へ送る報告書と、大阪で受け取った手紙が並んでいました。数字で測れる成果は多くありません。けれど名前を呼んでくれる人、帰り際に笑う人、一緒にお茶を飲む悪魔と先輩がいます。セラフィナは報告書の最後に、整いすぎていない一文を添えました。モコはその紙の端に座り、提出を少しだけ遅らせます。モコが降りたあとの紙には小さな足跡が残っていました。完璧ではない記録も、この町で生きた証として悪くありません。残る日々は有限でも、今日の温かさは今日のものとして、静かに祈るように書き留めました。","options":[{"label":"手紙を読み返して返事を書く","result":"返事の便箋には、大阪の夕日色の封筒を選びました。つながりは、送って終わりではありませんでした。","shoku":1,"iyashi":3,"money":0},{"label":"報告書に正直な一文を添える","result":"飾らない言葉が、かえって胸に残りました。自分の日々を、自分の言葉で天界へ届けられました。","shoku":2,"iyashi":2,"money":0},{"label":"机の前で静かに目を閉じる","result":"書くべきことは、まだ頭の中で温まっています。急がず置いた時間が、言葉の輪郭を作っていきました。","shoku":0,"iyashi":0,"money":0}]},"7-salon":{"title":"明日も待っていると言える場所","text":"視察を経て、サロンの予定表にはセラフィナの名前が前よりはっきり残るようになりました。柚月さんは『ここでの仕事も、あなたの任務の一部として認められたのね』と笑います。常連さんたちは難しい話には触れず、いつものようにお茶を飲み、他愛ない近況を話していきました。特別な祝福があるわけではありません。けれど明日も同じ場所で待っていると言えることが、大きな変化でした。帰り際、店の窓に映る自分の輪は薄くても、表情は五百年前よりずっと人らしく笑っていました。今日もおつかれさまです、と静かに伝えたいと思います。","options":[{"label":"常連さん一人ひとりに挨拶する","result":"短い挨拶の積み重ねが、この場所の信用を作っていました。謝礼と一緒に、温かな差し入れも受け取りました。","shoku":0,"iyashi":3,"money":1000},{"label":"柚月さんと次の目標を相談する","result":"新しい研修の話が出て、追加の仕事も任されました。認められることは、次の責任の入口でもありました。","shoku":1,"iyashi":2,"money":1300}]}};
const PERIOD_EVENTS = {"shrine-early":{"title":"小さな神社の朝","text":"住宅街の小さな神社では、朝の光が石段をまだらに照らしていた。宮司が参道の落ち葉を掃き、通りがかりの人が自然と手を合わせていく。セラフィナは社殿の前で背筋を伸ばし、祀られる存在へ失礼のないよう、静かに頭を下げた。願いを声に出す人、ただ通り過ぎる人、それぞれの距離感がある。神さまとのご近所づきあいは、まず相手の場所を敬うことから始まるのだと感じた。帰り道、近所の人が『いつもありがとう』と声をかけた。参道をきれいにすることは、自分の心の通り道も開くことだった。","options":[{"label":"落ち葉掃きを手伝う","result":"掃いた後の石段は、朝の光をよく反射した。静かな労働が、心のざわめきも一緒に集めてくれた。","shoku":0,"iyashi":3,"money":0},{"label":"境内のベンチで静かに座る","result":"鳥の声と遠くの電車の音だけが聞こえた。何も求めずに座る時間も、確かな休息だった。","shoku":0,"iyashi":0,"money":0}]},"shrine-mid":{"title":"お寺の縁側で聞く話","text":"商店街に近いお寺の縁側では、年配の女性が腰を下ろし、近くの仏さまへ穏やかに手を合わせていた。セラフィナは邪魔をしない距離に座り、相手が話し始めた時だけ耳を傾ける。昔の仕事のこと、最近眠れないこと、帰りに買う野菜のこと。話は大きくも劇的でもないが、最後に『聞いてくれてありがとう』と言われると、縁側の空気が少し温かくなった。癒しの先輩たちは、静けさの使い方を知っている。女性が帰った後も、縁側にはお茶の湯気が残っていた。静かな場所で交わした短い時間が、午後の足取りを少し軽くした。","options":[{"label":"相手の話を最後まで聞く","result":"助言はしなかった。ただ頷き、相槌を打ち、帰り道の安全を祈った。それで十分な日もある。","shoku":0,"iyashi":3,"money":0},{"label":"お茶を買ってきて一緒に休む","result":"温かいお茶を挟むと、会話の速度がゆっくりになった。静かな場所には、静かなもてなしが似合っていた。","shoku":1,"iyashi":2,"money":0}]},"shrine-late":{"title":"広い参道の静けさ","text":"大きな神社の参道は、祭りの日でなくても凛とした空気に満ちていた。木々を抜ける風、砂利の音、遠くで交わされる挨拶。セラフィナは祀られる方々へ敬意を込めて歩き、無闇に写真を撮らず、場所の静けさを味わった。天界とは違う形で、人々の暮らしの中心にいる存在たち。その近さと距離の両方を大切にする姿勢が、ご近所づきあいの作法なのだと思えた。鳥居をくぐって振り返ると、参道の木々が夕日の縁取りをまとい始めた。敬意を持って過ごす時間は、言葉より長く心に残った。","options":[{"label":"参道をゆっくり歩いて心を整える","result":"歩幅に合わせて、考えも整っていった。急がない時間が、帰還や残留といった大きな言葉を少し遠ざけてくれた。","shoku":0,"iyashi":3,"money":0},{"label":"境内の案内板を丁寧に読む","result":"土地の歴史を知ると、挨拶の意味も変わって見えた。敬意は、知ろうとすることから深まっていく。","shoku":1,"iyashi":2,"money":0}]},"shotengai-early":{"title":"商店街の顔つなぎ","text":"商店街では、八百屋が大根の並べ方を教え、パン屋が焼きたての香りで足を止めさせた。セラフィナが挨拶すると、『天使さんも買うんやね』と笑われ、値札の見方や旬の選び方を教えてもらえる。大きな店の便利さとは違い、ここでは買い物のたびに短い近況交換が付いてくる。品物を受け取る前に、人の顔が先に思い浮かぶ。その距離の近さが、町の生活者になる第一歩だった。帰り道、買った野菜の葉が袋から少しはみ出していた。それだけで、今夜の食卓がすでに始まっている気がして、足取りが弾んだ。","options":[{"label":"八百屋で旬の選び方を習う","result":"選んだ野菜の理由を説明できるようになった。小さな知識が、食卓と会話の両方を豊かにした。","shoku":2,"iyashi":2,"money":0},{"label":"パン屋の常連とお茶を飲む","result":"他愛のない話で笑い合った。顔なじみとは、特別な約束なしに時間を分け合える関係だった。","shoku":1,"iyashi":3,"money":0}]},"shotengai-mid":{"title":"常連として扱われる日","text":"商店街の花屋は、セラフィナの顔を見ると『いつもの小さい花ね』と手を動かした。注文を言い終わる前に好みを覚えられている。その気恥ずかしさと嬉しさに、輪が少し揺れる。隣の魚屋では常連同士が夕飯の献立を相談し、セラフィナも輪に加わった。町の人にとって彼女は、珍しい来客ではなく、買い物ついでに世間話をする一員になりつつあった。別れ際、花屋が余った一輪を包んでくれた。常連扱いは値引きだけではなく、こうした小さな心遣いにも表れるのだと知った。","options":[{"label":"花屋と次の季節の花を相談する","result":"花の名前と咲く時期を教わった。暮らしの中に、未来の小さな楽しみが増えていく。","shoku":2,"iyashi":2,"money":0},{"label":"常連たちと献立の相談に加わる","result":"夕飯の主役は、安くて旬の魚に決まった。生活の知恵は、会話の中で受け継がれていく。","shoku":2,"iyashi":3,"money":0}]},"shotengai-late":{"title":"行事の手伝いと花の鉢","text":"商店街の小さな行事準備では、提灯の確認や椅子並べで人手が必要になっていた。セラフィナは顔なじみとして自然に声をかけられ、花屋の店先では水やりを待つ鉢植えが並ぶ。店主は『一鉢、預かってくれへん？　あんたの部屋なら大事にしてくれそうや』と笑った。頼られることは、町の歯車に組み込まれることでもある。重さではなく、居場所の確かさとして、その鉢は両手に収まった。鉢を受け取った帰り道、すれ違う店主たちが『頼んだで』と声をかけた。両手の重さは、町からの信頼の重さでもあった。","options":[{"label":"花屋の鉢植えを預かる","result":"商店街の鉢植えを託された。窓辺の緑が、町とのつながりを毎日思い出させてくれそうだった。","shoku":1,"iyashi":3,"money":0,"item":"shotengai_plant"},{"label":"行事の椅子並べを手伝う","result":"作業の後のお茶が、いつもよりおいしかった。町の一員として働く実感が、静かに残った。","shoku":1,"iyashi":2,"money":300}]}};
let seraphinaCollection = loadCollectionData();
let craneState = {active:false,pos:0,dir:1,timer:null};
function emptyCollection(){ return {items:{},endings:{},chapters:{}};}
function loadCollectionData(){
try{ const raw = localStorage.getItem(COLLECTION_KEY); if(!raw) return emptyCollection(); const d = JSON.parse(raw); return {items:(d&&d.items&&typeof d.items==="object")?d.items:{}, endings:(d&&d.endings&&typeof d.endings==="object")?d.endings:{}, chapters:(d&&d.chapters&&typeof d.chapters==="object")?d.chapters:{}};}catch(e){ return emptyCollection();}
}
function saveCollectionData(){ try{ localStorage.setItem(COLLECTION_KEY, JSON.stringify(seraphinaCollection));}catch(e){}}
function assetSrc(name){ return (typeof BGURI!== "undefined" && BGURI[name])? BGURI[name]: "assets/" + name + ".webp";}
function chapterForScene(sid){
if(!sid) return null;
if(sid.indexOf("end_")===0 || sid[0]==="g") return "final";
if(sid==="sys_intro" || sid[0]==="p") return "prologue";
if(sid[0]==="c") return "ch1";
if(sid[0]==="n" || sid[0]==="f" || sid==="teaser2") return "ch2";
if(sid[0]==="t") return "ch3";
if(sid[0]==="s") return "ch4";
if(sid[0]==="w") return "ch5";
if(sid[0]==="l") return "ch6";
if(sid[0]==="v") return "ch7";
if(sid[0]==="k") return "ch8";
if(sid.indexOf("INT")===0){ const map={INT1:"ch1",INT2:"ch2",INT3:"ch3",INT4:"ch4",INT5:"ch5",INT6:"ch6",INT7:"ch7"}; return map[sid]||null;}
return null;
}
function recordSceneProgress(sid){
const ch = chapterForScene(sid);
if(ch &&!seraphinaCollection.chapters[ch]){ seraphinaCollection.chapters[ch]=true; saveCollectionData();}
if(sid && sid.indexOf("end_")===0 && ENDING_DEFS[sid] &&!seraphinaCollection.endings[sid]){ seraphinaCollection.endings[sid]=true; saveCollectionData();}
}
function grantItem(id){
if(!ITEMS[id]) return false;
let newly = false;
if(S &&!S.items[id]){ S.items[id]=true; newly=true;}
if(!seraphinaCollection.items[id]){ seraphinaCollection.items[id]=true; newly=true; saveCollectionData();}
if(newly) seItem();
return newly;
}
function mergeCollectionFromRun(){
if(!S) return;
Object.keys(S.items||{}).forEach(id=>{ if(ITEMS[id]) seraphinaCollection.items[id]=true;});
saveCollectionData();
}
function normalizeState(d){
const base = newState();
if(!d || typeof d!=="object") return base;
base.scene = (typeof d.scene==="string" && SCENES[d.scene])? d.scene: "p0";
const sc = SCENES[base.scene];
base.line = Number.isFinite(d.line)? Math.max(0, Math.min(sc.lines.length-1, Math.floor(d.line))): 0;
base.shoku = Number.isFinite(d.shoku)? Math.max(0, Math.floor(d.shoku)): 0;
base.iyashi = Number.isFinite(d.iyashi)? Math.max(0, Math.floor(d.iyashi)): 0;
base.flags = (d.flags && typeof d.flags==="object" &&!Array.isArray(d.flags))? d.flags: {};
base.log = Array.isArray(d.log)? d.log: [];
base.money = Number.isFinite(d.money)? Math.max(0, Math.floor(d.money)): 3000;
base.items = {};
if(d.items && typeof d.items==="object" &&!Array.isArray(d.items)){ Object.keys(d.items).forEach(id=>{ if(ITEMS[id] && d.items[id]) base.items[id]=true;});}
base.free = null;
if(d.free && typeof d.free==="object" && base.scene.indexOf("INT")===0){
const idx = Number.isFinite(d.free.idx)? Math.floor(d.free.idx): parseInt(base.scene.replace("INT",""),10);
if(idx>=1 && idx<=7 && SCENES[base.scene] && SCENES[base.scene].interlude===idx){
base.free = {idx:idx,target:SCENES[base.scene].target,slot:Number.isFinite(d.free.slot)?Math.max(0,Math.min(2,Math.floor(d.free.slot))):0,view:["choose","event","result","finish","shop","gacha","crane"].indexOf(d.free.view)>=0?d.free.view:"choose",dest:(d.free.dest&&FREE_DESTS[d.free.dest])?d.free.dest:null,eventKey:(typeof d.free.eventKey==="string")?d.free.eventKey:null,result:(typeof d.free.result==="string")?d.free.result:"",effectText:(typeof d.free.effectText==="string")?d.free.effectText:"",notice:(typeof d.free.notice==="string")?d.free.notice:"",shopMsg:(typeof d.free.shopMsg==="string")?d.free.shopMsg:"",gachaMsg:(typeof d.free.gachaMsg==="string")?d.free.gachaMsg:"",craneMsg:(typeof d.free.craneMsg==="string")?d.free.craneMsg:""};
if(!base.free.dest && ["event","result","shop","gacha","crane"].indexOf(base.free.view)>=0) base.free.view="choose";
}
}
return base;
}

if(rw.price){ if(S.money>=rw.price){ S.money-=rw.price; toast("所持金から "+rw.price+"円を使いました");}}
if(rw.item && grantItem(rw.item)) toast("グッズ図鑑に登録："+ITEMS[rw.item].name);
updateHUD();
}

function judgeCrane(pos){ const v=Number(pos); return Number.isFinite(v) && v>=42 && v<=58;}

}

}

function themeForScene(sid, bg){
if(!sid) return "title";
if(sid.indexOf("end_")===0) return "ending";
if(sid.indexOf("INT")===0) return "osaka";
if(bg && BGM_FEST_BG[bg]) return "festival";
if((bg && BGM_SHRINE_BG[bg]) || sid[0]==="k") return "shrine";
if(sid[0]==="v") return "gabriela";
if(sid[0]==="t") return "lucia";
if(bg && BGM_NIGHT_BG[bg]) return "night";
if((bg && BGM_HEAVEN_BG[bg]) || sid[0]==="p" || sid[0]==="g") return "heaven";
if((bg && BGM_NIPPON_BG[bg]) || sid[0]==="n" || sid[0]==="f") return "nipponbashi";

let AC = null, bgmGain = null, seGain = null, noiseBuf = null;

function audioCtx(){
try{
if(!AC){
const Ctor = (typeof window!=="undefined")? (window.AudioContext || window.webkitAudioContext): null;
if(!Ctor) return null;
AC = new Ctor();
bgmGain = AC.createGain(); bgmGain.connect(AC.destination);
seGain = AC.createGain(); seGain.connect(AC.destination);
applyAudioVolumes();
}
if(AC.state==="suspended"){ const p = AC.resume(); if(p && p.catch) p.catch(()=>{}); }
return AC;
}catch(e){ return null; }
}
function applyAudioVolumes(){
try{
if(bgmGain) bgmGain.gain.value = [0.20,0.42,0.68][audioSet.bgmVol-1] || 0.42;
if(seGain) seGain.gain.value = 0.9;
}catch(e){}
}
function mf(m){ return 440*Math.pow(2,(m-69)/12); }
function toneAt(m, t, dur, type, vol, dest){
if(!AC) return;
try{
const o = AC.createOscillator(), g = AC.createGain();
o.type = type; o.frequency.value = mf(m);
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(Math.max(vol,0.0002), t+0.02);
g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
o.connect(g); g.connect(dest || bgmGain);
o.start(t); o.stop(t+dur+0.05);
}catch(e){}
}
function padAt(m, t, dur, vol){
if(!AC) return;
try{
const o = AC.createOscillator(), g = AC.createGain();
o.type = "triangle"; o.frequency.value = mf(m);
g.gain.setValueAtTime(0.0001, t);
g.gain.linearRampToValueAtTime(vol, t+Math.min(0.5, dur*0.3));
g.gain.setValueAtTime(vol, t+dur*0.7);
g.gain.linearRampToValueAtTime(0.0001, t+dur);
o.connect(g); g.connect(bgmGain);
o.start(t); o.stop(t+dur+0.05);
}catch(e){}
}
function hatAt(t, vol){
if(!AC) return;
try{
if(!noiseBuf){ noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate*0.08), AC.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
const s = AC.createBufferSource(); s.buffer = noiseBuf;
const f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 6500;
const g = AC.createGain();
g.gain.setValueAtTime(vol, t);
g.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
s.connect(f); f.connect(g); g.connect(bgmGain);
s.start(t); s.stop(t+0.07);
}catch(e){}
}
function donAt(t){
if(!AC) return;
try{
const o = AC.createOscillator(), g = AC.createGain();
o.type = "sine";
o.frequency.setValueAtTime(150, t);
o.frequency.exponentialRampToValueAtTime(52, t+0.16);
g.gain.setValueAtTime(0.28, t);
g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
o.connect(g); g.connect(bgmGain);
o.start(t); o.stop(t+0.25);
}catch(e){}
}
function bgmScheduleStep(th, step, t, spb){
const m = th.mel[step];
if(m) toneAt(m, t, Math.min(0.55, spb*3.2), th.lead, th.lv, bgmGain);
const b = th.bass[step];
if(b) toneAt(b, t, spb*1.9, "sine", 0.17, bgmGain);
if(step%8===0){ const ch = th.pad[Math.floor(step/8)%th.pad.length]; if(ch) ch.forEach(n=>padAt(n, t, spb*8.2, 0.028)); }
if(th.hat && step%4===2) hatAt(t, 0.045);
if(th.don && step%8===0) donAt(t);
if(th.don && step%8===5) donAt(t);
}
function bgmTick(){
if(!AC || !bgmCur.theme) return;
const th = BGM_THEMES[bgmCur.theme]; if(!th) return;
const spb = 60/th.bpm/4;
try{
while(bgmCur.next < AC.currentTime + 0.45){
bgmScheduleStep(th, bgmCur.step, Math.max(bgmCur.next, AC.currentTime+0.02), spb);
bgmCur.step = (bgmCur.step+1) % th.mel.length;
bgmCur.next += spb;
}
}catch(e){}
}
function bgmStart(theme){
bgmStop();
if(!AC || !BGM_THEMES[theme]) return;
bgmCur.theme = theme; bgmCur.step = 0; bgmCur.next = AC.currentTime + 0.08;
bgmCur.timer = setInterval(bgmTick, 180);
bgmTick();
}
function bgmStop(){
if(bgmCur.timer){ clearInterval(bgmCur.timer); bgmCur.timer = null; }
bgmCur.theme = null;
}
function setTheme(name){
wantTheme = name;
if(!audioSet.bgm){ bgmStop(); return; }
if(!AC) return;
if(bgmCur.theme===name && bgmCur.timer) return;

}

function ttsAvailable(){
try{ return typeof speechSynthesis!=="undefined" && typeof SpeechSynthesisUtterance!=="undefined"; }catch(e){ return false; }
}
const TTS_PITCH = {"セラフィナ":1.15,"ルチア":1.05,"ガブリエラ":0.9,"モコ":1.4,"ノワール":1.3};
function stopSpeak(){
if(!ttsAvailable()) return;
try{ speechSynthesis.cancel(); }catch(e){}
}
function speakLine(who, text){
if(!audioSet.tts || !ttsAvailable() || !text) return;
try{
speechSynthesis.cancel();
const u = new SpeechSynthesisUtterance(text);
u.lang = "ja-JP";
u.rate = 1.12;
u.pitch = TTS_PITCH[who] || 1.0;
try{
const vs = speechSynthesis.getVoices();
if(vs && vs.length){ for(let i=0;i<vs.length;i++){ if((vs[i].lang||"").indexOf("ja")===0){ u.voice = vs[i]; break; } } }
}catch(e){}
speechSynthesis.speak(u);
}catch(e){}
}

}

const VIDEO_SEEN_KEY = "seraphina_video_seen_v1";
const ED_VIDEOS = {end_special:"ed_special.mp4", end_stay:"ed_stay.mp4", end_travel:"ed_travel.mp4", end_return:"ed_return.mp4"};
function videoSrc(name){ return "assets/video/" + name; }
let videoBusy = false;
let videoCloseFn = null;
function opSeen(){ try{ return !!localStorage.getItem(VIDEO_SEEN_KEY); }catch(e){ return true; } }
function markOpSeen(){ try{ localStorage.setItem(VIDEO_SEEN_KEY, "1"); }catch(e){} }
function playGameVideo(name, done){
const finish = ()=>{ if(typeof done === "function") done(); };
if(videoBusy){ finish(); return; }
const src = videoSrc(name);
if(!src || typeof HTMLVideoElement === "undefined"){ finish(); return; }
const modal = document.getElementById("videoModal");
const v = document.getElementById("gameVideo");
if(!modal || !v || typeof v.play !== "function"){ finish(); return; }
videoBusy = true;
bgmStop(); stopVoice(); stopSpeak();
let closed = false;
const close = ()=>{
if(closed) return; closed = true; videoCloseFn = null;
try{ v.pause(); }catch(e){}
v.removeEventListener("ended", close);
v.removeEventListener("error", close);
modal.style.display = "none";
videoBusy = false;
finish();
};
videoCloseFn = close;
v.addEventListener("ended", close);
v.addEventListener("error", close);
v.muted = !audioSet.video;
v.volume = [0.45, 0.75, 1][audioSet.videoVol-1] || 0.75;
modal.style.display = "block";
try{ v.src = src; const pr = v.play(); if(pr && pr.catch) pr.catch(()=>close()); }catch(e){ close(); }
setTimeout(()=>{ if(!closed && v.readyState === 0 && v.networkState === 3) close(); }, 2500);
}
document.getElementById("btnVideoSkip").addEventListener("click", e=>{ e.stopPropagation(); if(videoCloseFn) videoCloseFn(); });

bind("sbOpPlay", ()=>{ audioSet.opPlay = !audioSet.opPlay; saveAudioSettings(); renderSoundSettings(); });
}

updateHUD();
</script>
