<script>
"use strict";
const SCENES = {"p0": {"bg": "02-florence", "next": "p1", "lines": [["", "1500年ごろ。イタリア、フィレンツェ。赤い屋根の上に、朝の光がゆっくりと広がっていく。"], ["", "大聖堂の鐘が鳴ると、市場には焼きたてのパンの香りと、職人たちの元気な話し声があふれた。"], ["セラフィナ", "おはようございます。今日も、いい天気になりそうですね"], ["", "見習い天使セラフィナの仕事は、目立たない場所で、疲れた人のそばにいることだった。"], ["", "重い石材を運ぶ職人の肩にそっと手を置けば、不思議と荷が軽くなる。絵筆を持つ手が震える若い画家のそばに立てば、震えが少しずつ収まっていく。"], ["セラフィナ", "がんばりすぎなくて、大丈夫ですよ。ほら、深呼吸。……ね、少し楽になったでしょう"], ["", "誰も、天使がそばにいたことには気づかない。それでいいのだと、セラフィナはいつも思っていた。"], ["", "昼には市場で荷運びを手伝い、夕方には教会の階段でうたた寝する老人に、そっと毛布のような温かさを置いていく。"], ["セラフィナ", "お礼は要りませんよ。わたしは、ただの通りすがりですから"]]}, "p1": {"bg": "02-florence", "next": "p2", "lines": [["", "セラフィナに大げさな力はない。ただ、疲れた人に、とても敏感だった。"], ["", "誰かが小さくため息をつくと、背中の羽根がふるっと震える。放っておけなくて、つい近づいてしまうのだ。"], ["ガブリエラ", "セラフィナ。よくやってるみたいね"], ["セラフィナ", "ガブリエラ先輩！　えへへ、見ていてくれたんですか"], ["ガブリエラ", "ええ。だからこそ、次の大きな任務は、あなたに任せたいの"], ["", "先輩天使ガブリエラが差し出した封筒には、見たことのない形の文字と、聞いたことのない地名が、丁寧に書かれていた。"], ["セラフィナ", "わたしが、大きな任務……？　本当に、わたしでいいんですか"], ["ガブリエラ", "あなただから、よ。疲れた人を見つける力は、天界でも随一なんですから"], ["", "セラフィナは封筒を両手で受け取って、何度も小さく頷いた。羽根が、緊張と誇りで小さく震えていた。"]]}, "p2": {"bg": "02-florence", "next": "c0", "lines": [["ガブリエラ", "行き先は、遠い東の島国。日本の、大阪という街よ"], ["セラフィナ", "おおさか……。前回の降臨から、もう五百年も経つというのに？"], ["ガブリエラ", "ええ。世界は大きく変わったわ。人も、街も、食べ物もね。……くれぐれも、現地に染まりすぎないように"], ["", "五百年。セラフィナにとっては、長いお昼寝くらいの時間のはずだった。"], ["セラフィナ", "分かりました。行ってきます。疲れた人がいるのなら、どこへでも"], ["", "こうして見習い天使は、五百年ぶりの地上任務へと旅立った。――まさかあんなことになるなんて、この時はまだ、知る由もなく。"], ["セラフィナ", "先輩の言う通り、染まりすぎないように気をつけます。わたしは天使ですから、しっかりと！"]]}, "c0": {"bg": "11-descending-sky", "next": "c1", "lines": [["", "雲を抜けると、夜の海のような、光の粒の広がりが見えてきた。"], ["セラフィナ", "わあ……！　星が、地面に落ちているみたいです"], ["", "それは星ではなかった。街の明かり、車の明かり、眠らない店の明かり。五百年前にはなかった、数えきれないほどの光だった。"], ["セラフィナ", "すごい、すごいです……！　あれ全部、人が作った明かりなんですか？"], ["", "あまりの眩しさに目を細めるセラフィナ。その小さな翼は、まだ真っ白に輝いていた。"], ["セラフィナ", "大阪、見えました。セラフィナ、降臨します！"], ["", "降りていくにつれて、街の音が少しずつ近づいてきた。電車の音、人々の声、店の呼び込み。五百年前にはなかった、忙しくて温かい音。"], ["セラフィナ", "なんだか、胸がどきどきします。怖いのとは、少し違う……楽しみ、なのかもしれません"]]}, "c1": {"bg": "03-osaka-arrival", "next": "c2", "lines": [["", "大阪、到着。最初の試練は、人混みだった。 , "next": null, "lines": [["", "改札。薄いカードを機械にかざすと、小さな音が鳴って、扉が開く場所。"], ["セラフィナ", "あの音……『ピッ』。みなさん、あの音と一緒に通っているんですね"], ["", "セラフィナも、見よう見まねでカードをそっとかざしてみた。"], ["セラフィナ", "ピッ！　……開きました！　わたしまで、つい『ピッ』って言ってしまいました"], ["", "小さな音と一緒に扉が開くのが、なんだか小さな魔法みたいで、セラフィナは少し嬉しくなっていた。"], ["", "周りの人々は慣れた手つきでカードをかざし、足早に通り抜けていく。その流れの速さに、セラフィナは目を丸くした。"]], "choices": [{"text": "嬉しくて、もう一度ピッとする", "shoku": 6, "iyashi": 0, "next": "r2a"}, {"text": "落ち着いて、一度だけにする", "shoku": 2, "iyashi": 0, "next": "r2b"}]}, "r2a": {"bg": "14-ic-gate", "next": "c5", "lines": [["駅員さん", "お客さん、そのカードは入場済みですよー"], ["セラフィナ", "あっ、すみません！　つい楽しくて……この音、なんだか癖になりますね"], ["", "駅員さんは笑って許してくれた。セラフィナの頭の輪が、ほんの少しだけ薄くなったのを、その場の誰も気づかなかった。"], ["セラフィナ", "ピッ、は一日一回まで。……覚えました。多分"], ["", "改札の向こうでは、次の電車の案内が流れていた。セラフィナは慌てて小走りになり、翼が少しだけはみ出しそうになった。"]]}, "r2b": {"bg": "14-ic-gate", "next": "c5", "lines": [["セラフィナ", "一度で十分です。……十分です。……ちょっとだけ、もう一度したかったですけど"], ["", "名残惜しそうに改札を離れる天使。現代の誘惑は、小さな音の形でも、そっとやってくる。"], ["セラフィナ", "我慢も任務のうち、です。ええ、任務のうち"]]}, "c5": {"bg": "15-crowded-train", "next": null, "lines": [["", "電車の中は、立ったままうとうとする人、画面を見つめる人、ため息を飲み込む人でいっぱいだった。"], ["セラフィナ", "（羽根が震えています……この車両、疲れた人がこんなに）"], ["", "吊り革につかまる会社員の肩が、小さく震えている。目は閉じているのに、眉間には深い皺が寄っていた。"], ["セラフィナ", "（わたしの仕事は、こういう人のそばにいることです）"], ["", "フィレンツェでも、大阪でも。疲れた人の姿は、五百年経っても変わらなかった。"], ["", "混んだ車内では、誰も大きな声を出さない。静かに耐えて、静かに譲って、静かに眠る。それもこの街の、優しさの形なのかもしれない。"], ["セラフィナ", "（大丈夫ですよ。少しだけ、わたしが見ていますから）"]], "choices": [{"text": "肩にそっと手を置く（天使のやり方で）", "shoku": 2, "iyashi": 8, "next": "r3a"}, {"text": "静かに見守るだけにする", "shoku": 0, "iyashi": 3, "next": "r3b"}]}, "r3a": {"bg": "15-crowded-train", "next": "c6", "lines": [["", "セラフィナがそっと手を置くと、会社員の眉間の皺が、ゆっくりとほどけていった。"], ["会社員", "……あれ。少し、楽になった気がする。気のせい、かな"], ["セラフィナ", "気のせいじゃ、ありませんよ。今日もおつかれさまです"], ["", "聞こえないはずの声に、会社員はなぜか小さく頷いて、安心した顔でそっと目を閉じた。"], ["", "車両のざわめきは変わらない。それでも、一人の人の肩の力が抜けた。それで十分だと、セラフィナは思った。"], ["", "電車が駅に近づくと、会社員は鞄を持ち直し、少しだけ伸びをして立ち上がった。その足取りは、乗ってきた時より軽かった。"]]}, "r3b": {"bg": "15-crowded-train", "next": "c6", "lines": [["", "セラフィナは騒がず、ただ近くで見守った。それでも不思議と、周りの空気が少しだけ和ら const TITLE_IMG = "assets/01-key-visual.webp";
const SAVE_KEY = "seraphina_proto_save_";
let S = null;
let autoTimer = null;
function newState(){ return {scene:"p0", line:0, shoku:0, iyashi:0, log:[]};}
function stageComment(v){
if(v>=55) return "すっかり染まる兆し……本人は笑顔";
if(v>=38) return "輪と翼が、だいぶ薄れてきた気がする";
if(v>=18) return "輪がほんの少し薄れた気が……本人は無自覚";
if(v>=1) return "まだぴかぴか。でも何か始まっている";
return "輪はぴかぴか、翼もふんわり";
}
function updateHUD(){
document.getElementById("shokunum").textContent = S.shoku;
document.getElementById("iyashinum").textContent = S.iyashi;
document.getElementById("bar").style.width = Math.min(100, S.shoku/75*100) + "%";
document.getElementById("stagec").textContent = stageComment(S.shoku);
}
function endingFor(v){ return v>=26? "e_high": (v>=15? "e_mid": "e_low");}
function endingFor2(v){ return v>=52? "f_high": (v>=34? "f_mid": "f_low");}
function showScene(){
const sc = SCENES[S.scene];
document.getElementById("bg").src = "assets/" + sc.bg + ".webp";
const line = sc.lines[S.line];
document.getElementById("who").textContent = line[0] || "";
document.getElementById("text").textContent = line[1];
document.getElementById("next").style.display = "";
updateHUD();
}
function pushLog(){
const sc = SCENES[S.scene]; const line = sc.lines[S.line];
S.log.push([line[0], line[1]]);
if(S.log.length>400) S.log.shift();
}
function advance(){
if(!S) return;
pushLog();
const sc = SCENES[S.scene];
if(S.line < sc.lines.length-1){ S.line++; showScene(); scheduleAuto(); return;}
// scene end
if(sc.choices){ stopAuto(); showChoices(sc); return;}
let nxt = sc.next;
if(nxt === "BRANCH"){ nxt = endingFor(S.shoku);}
if(nxt === "BRANCH2"){ nxt = endingFor2(S.shoku);}
if(!nxt || sc.end){ stopAuto(); toTitle(true); return;}
S.scene = nxt; S.line = 0; showScene(); scheduleAuto();
}
function showChoices(sc){
const box = document.getElementById("choices");
box.querySelectorAll("button").forEach(b=>b.remove());
sc.choices.forEach(ch=>{
const b = document.createElement("button");
b.textContent = ch.text;
b.onclick = (e)=>{ e.stopPropagation();
S.shoku += ch.shoku||0; S.iyashi += ch.iyashi||0;
S.log.push(["", ch.text]);
box.style.display = "none";
S.scene = ch.next; S.line = 0; showScene();
};
box.appendChild(b);
});
box.style.display = "flex";
}
function startGame(){ S = newState(); document.getElementById("title").style.display="none"; showScene();}
function toTitle(finished){
stopAuto();
const t = document.getElementById("title");
t.style.display = "flex";
if(finished) toast("おしまい。ありがとうございました");
}
function toast(msg){
const el = document.getElementById("toast"); el.textContent = msg; el.style.display="block";
setTimeout(()=>{ el.style.display="none";}, 2200);
}
function openSlots(mode){
const modal = document.getElementById("saveModal");
document.getElementById("saveTitle").textContent = mode==="save"? "セーブ": "ロード";
const wrap = document.getElementById("slots"); wrap.innerHTML = "";
for(let i=1;i<=6;i++){
const raw = localStorage.getItem(SAVE_KEY+i);
const b = document.createElement("button"); b.className="slot";
if(raw){
const d = JSON.parse(raw);
b.innerHTML = "スロット"+i+"<br><small>"+d.date+"／場面："+d.scene+"／蝕まれ度 "+d.shoku+"・癒し "+d.iyashi+"</small>";
} else {
b.innerHTML = "スロット"+i+"<br><small>（空き）</small>";
}
b.onclick = ()=>{
if(mode==="save"){
if(!S){ toast("まだ始まっていません"); return;}
const d = {scene:S.scene, line:S.line, shoku:S.shoku, iyashi:S.iyashi, log:S.log, date:new Date().toLocaleString("ja-JP")};
localStorage.setItem(SAVE_KEY+i, JSON.stringify(d));
toast("スロット"+i+"にセーブしました"); openSlots("save");
} else {
const raw2 = localStorage.getItem(SAVE_KEY+i);
if(!raw2){ toast("データがありません"); return;}
const d = JSON.parse(raw2);
S = {scene:d.scene, line:d.line, shoku:d.shoku, iyashi:d.iyashi, log:d.log||[]};
document.getElementById("title").style.display="none";
modal.style.display="none"; showScene(); toast("ロードしました");
}
};
wrap.appendChild(b);
}
modal.style.display="block";
}
function openLog(){
const list = document.getElementById("loglist");
if(!S || S.log.length===0){ list.textContent = "まだ記録がありません。";}
else{
list.innerHTML = S.log.map(l=> l[0]? '<div><span class="lw">'+l[0]+"</span>　"+l[1]+"</div>": "<div>"+l[1]+"</div>").join("");
}
document.getElementById("logModal").style.display="block";
}
function stopAuto(){
if(autoTimer){ clearTimeout(autoTimer); autoTimer=null;}
document.getElementById("mAuto").classList.remove("on");
}
function scheduleAuto(){
if(!document.getElementById("mAuto").classList.contains("on")) return;
stopAutoKeep();
autoTimer = setTimeout(advance, 2400);
}
function stopAutoKeep(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null;}}
document.getElementById("textbox").addEventListener("click", ()=>{ if(S && document.getElementById("title").style.display==="none") advance();});
document.getElementById("btnStart").addEventListener("click", startGame);
document.getElementById("btnLoadT").addEventListener("click", ()=>openSlots("load"));
document.getElementById("mSave").addEventListener("click", e=>{ e.stopPropagation(); openSlots("save");});
document.getElementById("mLoad").addEventListener("click", e=>{ e.stopPropagation(); openSlots("load");});
document.getElementById("mLog").addEventListener("click", e=>{ e.stopPropagation(); openLog();});
document.getElementById("mTitle").addEventListener("click", e=>{ e.stopPropagation(); toTitle(false);});
document.getElementById("mAuto").addEventListener("click", function(e){
e.stopPropagation();
if(this.classList.contains("on")){ stopAuto();}
else{ this.classList.add("on"); scheduleAuto(); toast("オート再生 ON");}
});
document.querySelectorAll("[data-close]").forEach(b=> b.addEventListener("click", ()=>{ document.getElementById(b.dataset.close).style.display="none";}));
document.getElementById("title").style.backgroundImage = "url('" + TITLE_IMG + "')";
S = newState();
document.getElementById("bg").src = "assets/02-florence.webp";
updateHUD();
</script>
