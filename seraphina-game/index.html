<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;background:#10131f;color:#fff;overflow:hidden}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;background:#000;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.6)}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity.45s}
#shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,10,24,.25) 0%,rgba(8,10,24,0) 30%,rgba(8,10,24,0) 52%,rgba(8,10,24,.88) 82%)}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(to bottom,rgba(8,10,24,.78),rgba(8,10,24,0));z-index:5}
#hud.row{display:flex;align-items:center;gap:8px;font-size:13px}
#hud.lbl{font-weight:700;color:#ffe9a8;white-space:nowrap;text-shadow:0 1px 3px #000}
#barwrap{flex:1;height:10px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
#bar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#ffd76e,#ff9ecb);transition:width.6s}
#hud.num{font-weight:700;min-width:26px;text-align:right;text-shadow:0 1px 3px #000}
#hud.sub{display:flex;justify-content:space-between;margin-top:3px;font-size:11.5px;color:#eaf2ff;text-shadow:0 1px 3px #000}
#stagec{color:#ffd9ec;font-weight:600}
#menu{position:absolute;top:calc(64px + env(safe-area-inset-top));right:8px;display:flex;flex-direction:column;gap:6px;z-index:6}
#menu button{background:rgba(16,20,40,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:7px 12px;font-size:12.5px;font-weight:700;min-width:64px;cursor:pointer;backdrop-filter:blur(3px)}
#menu button.on{background:#ffd76e;color:#442c00;border-color:#ffd76e}
#textbox{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(12,15,32,.86);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:14px 16px 18px;min-height:132px;cursor:pointer;z-index:4;backdrop-filter:blur(4px)}
#who{font-size:14px;font-weight:800;color:#ffd76e;margin-bottom:5px;min-height:18px}
#text{font-size:16.5px;line-height:1.75;letter-spacing:.02em;word-break:break-all}
#next{position:absolute;right:14px;bottom:8px;font-size:13px;color:#ffd9ec;animation:bob 1.1s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
#choices{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:stretch;gap:14px;padding:0 34px;background:rgba(6,8,20,.55);z-index:8}
#choices button{background:rgba(255,252,240,.97);color:#33302a;border:none;border-radius:14px;padding:17px 14px;font-size:16px;font-weight:700;line-height:1.5;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45);min-height:60px}
#choices button:active{transform:scale(.98)}
#choices.q{text-align:center;color:#fff;font-size:14px;font-weight:700;text-shadow:0 2px 6px #000;margin-bottom:2px}
#title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 26px calc(34px + env(safe-area-inset-bottom));background-size:cover;background-position:center top}
#title::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,12,28,.05) 40%,rgba(10,12,28,.82))}
#title>*{position:relative}
#title h1{font-size:37px;letter-spacing:.14em;text-shadow:0 3px 14px rgba(0,0,0,.75);text-align:center}
#title.subt{margin-top:6px;font-size:14.5px;color:#ffe9a8;text-shadow:0 2px 8px #000;text-align:center;line-height:1.7}
#title button{width:100%;max-width:320px;margin-top:12px;padding:15px;border:none;border-radius:99px;font-size:16.5px;font-weight:800;cursor:pointer;min-height:54px}
#btnStart{background:linear-gradient(90deg,#ffd76e,#ffb3d9);color:#4a2c00}
#btnLoadT{background:rgba(255,255,255,.92);color:#333}
#btnOpT{background:rgba(255,255,255,.92);color:#333}
#videoModal{position:absolute;inset:0;z-index:35;display:none;background:#000}
#gameVideo{width:100%;height:100%;object-fit:contain;background:#000}
#btnVideoSkip{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(20,24,48,.88);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:11px 20px;font-size:14.5px;font-weight:700;cursor:pointer;min-height:46px}
#title.note{margin-top:14px;font-size:11.5px;color:#dfe8ff;text-align:center;line-height:1.6;text-shadow:0 1px 4px #000}
.modal{position:absolute;inset:0;z-index:30;display:none;background:rgba(5,7,18,.9);padding:calc(18px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:12px;color:#ffd76e}
.modal.close{position:sticky;top:0;float:right;background:#ffd76e;color:#442c00;border:none;border-radius:99px;padding:9px 18px;font-weight:800;font-size:14px;cursor:pointer;min-height:44px}
.slot{width:100%;text-align:left;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:13px 14px;margin-bottom:9px;font-size:14px;line-height:1.55;cursor:pointer;min-height:56px}
.slot small{color:#bcd0ff}
#loglist{font-size:14.5px;line-height:1.8}
#loglist.lw{color:#ffd76e;font-weight:700}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:170px;z-index:40;background:rgba(20,24,48,.95);border:1px solid rgba(255,255,255,.35);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;display:none;white-space:nowrap}
@media(min-width:481px){#app{border-left:1px solid #333;border-right:1px solid #333}}

#hud .sub{gap:10px;flex-wrap:wrap}
.free{position:absolute;inset:0;z-index:18;display:none;background:linear-gradient(to bottom,rgba(7,9,22,.72),rgba(7,9,22,.94));padding:calc(62px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
.freehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px;text-shadow:0 2px 5px #000}
.freetitle{font-size:21px;font-weight:900;color:#ffe9a8}.freesub{font-size:12.5px;color:#dfe8ff;margin-top:2px}.freestats{font-size:12.5px;text-align:right;line-height:1.55;color:#fff;white-space:nowrap}.freenotice{background:rgba(255,215,110,.18);border:1px solid rgba(255,215,110,.55);border-radius:12px;padding:9px 11px;font-size:13.5px;margin-bottom:10px}
.freecard{background:rgba(13,16,36,.94);border:1px solid rgba(255,255,255,.28);border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.freecard h3{font-size:18px;color:#ffe9a8;margin-bottom:9px}.freecard p{font-size:14.5px;line-height:1.75;margin-bottom:10px}.freecard .effect{color:#ffd9ec;font-weight:700}.destlabel{font-size:12px;color:#bcd0ff;font-weight:800;margin-bottom:5px}
.destgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.destbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:14px;padding:13px;text-align:left;cursor:pointer;min-height:74px}.destbtn b{display:block;font-size:16px;margin-bottom:4px}.destbtn span{font-size:12px;color:#dfe8ff;line-height:1.45}
.fbtn{display:block;width:100%;background:rgba(255,252,240,.96);color:#332d24;border:none;border-radius:12px;padding:13px 14px;font-size:14.5px;font-weight:800;cursor:pointer;margin-top:9px;min-height:48px}.fbtn.main{background:linear-gradient(90deg,#ffd76e,#ffb3d9);color:#4a2c00}.fbtn:disabled{opacity:.45;cursor:not-allowed}.sysbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.sysbtns .fbtn{font-size:12.5px;padding:10px 6px}.optbtns{margin-top:12px}
.itemgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.itemcard{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.24);border-radius:14px;padding:10px;overflow:hidden}.itemcard img{width:100%;height:92px;object-fit:cover;border-radius:9px;margin-bottom:7px}.itemcard p{font-size:12.5px;line-height:1.6}.itemcard.locked img{filter:grayscale(1) brightness(.28)}.itemname{font-weight:900;font-size:14.5px;line-height:1.4;margin-bottom:5px}.colnote{font-size:13px;line-height:1.65;color:#dfe8ff;margin-bottom:10px}.coltabs{display:flex;gap:7px;margin-bottom:12px}.coltabs button{flex:1;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:10px 5px;font-weight:800;cursor:pointer}.coltabs button.on{background:#ffd76e;color:#442c00;border-color:#ffd76e}
.cranetrack{position:relative;height:34px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:99px;margin:16px 0;overflow:hidden}.cranezone{position:absolute;top:0;bottom:0;left:42%;width:16%;background:rgba(255,215,110,.55)}.cranemarker{position:absolute;top:3px;bottom:3px;left:0;width:5px;margin-left:-2px;background:#fff;border-radius:99px;box-shadow:0 0 8px #fff}
@media(max-width:380px){.destgrid,.itemgrid{grid-template-columns:1fr}.sysbtns{grid-template-columns:1fr}}
</style>
</head>

<h1>セラフィナ</h1>
<div class="subt">― 全章版 ―<br>序章「フィレンツェの天使」＋ 第1章「降臨」＋ 第2章「日本橋どっぷり」＋ 第3章「ライバル降臨」＋ 第4章「日本の四季」＋ 第5章「癒しの仕事」＋ 第6章「日本の生活者」＋ 第7章「先輩視察」＋ 第8章「神仏ご近所」＋ 最終章「帰還と選択」</div>
<button id="btnStart">はじめから</button>

<div class="note">見習い天使セラフィナの、500年ぶりの大阪。<br>タップで読み進める、短編ビジュアルノベルです。</div>
</div>
<div class="modal" id="saveModal"><button class="close" data-close="saveModal">閉じる</button><h2 id="saveTitle">セーブ</h2><div id="slots"></div></div>
<div class="modal" id="logModal"><button class="close" data-close="logModal">閉じる</button><h2>バックログ</h2><div id="loglist"></div></div>
<div id="freeAction" class="free"><div id="freeContent"></div></div>
<div class="modal" id="collectionModal"><button class="close" data-close="collectionModal">閉じる</button><h2>コレクション図鑑</h2><div class="coltabs"><button data-coltab="goods">グッズ</button><button data-coltab="endings">エンディング</button><button data-coltab="gallery">場面回想</button></div><div id="collectionBody"></div></div>
<div class="modal" id="soundModal"><button class="close" data-close="soundModal">閉じる</button><h2>音の設定</h2><div id="soundBody"></div></div>

<script>
"use strict";
const SCENES = {"p0":{"bg":"02-florence","next":"p1","lines":[["","西暦一五〇〇年頃、イタリアはフィレンツェ。赤瓦の屋根並みを、朝日が端から順に照らしておりました。"],["","大聖堂の鐘がひとつ鳴れば、市場いっぱいに焼きたてパンの香ばしさと、職人たちの威勢のよい声が満ちてまいります。"],["セラフィナ","おはようございます。本日も、よいお天気になりそうです。"],["","見習い天使セラフィナの務めは、目立たぬところで疲れた方のそばに寄り添うこと。それが、彼女に課せられた仕事でございました。"],["","重い石材を担ぐ職人の肩へそっと手を添えれば、不思議と荷の重みが和らぎ、筆の震えに悩む若い画家の側に立てば、その震えは静かに収まってゆくのです。"],["セラフィナ","無理をなさらなくて結構ですよ。ほら、ゆっくり深呼吸を。……ね、肩の力が少し抜けたでしょう。"],["","誰ひとり、天使が傍らにいたとは気づきません。それでよいのだと、セラフィナは常々思っておりました。"],["","昼は市場で荷運びを手伝い、夕刻には教会の石段でまどろむ老人の背へ、毛布のような温もりをそっと残してまいります。"],["セラフィナ","お礼には及びません。わたしは通りすがりの者でございますから。"]]},"p1":{"bg":"02-florence","next":"p2","lines":[["","セラフィナに大それた力はございません。ただ、人の疲れには人一倍敏感でございました。"],["","誰かが小さくため息をつけば、背の羽根がふるりと震えます。放っておけず、つい足がそちらへ向いてしまうのです。"],["ガブリエラ","セラフィナ。よく務めているようですね。"],["セラフィナ","ガブリエラ先輩！　……見ていてくださったのですか。"],["ガブリエラ","ええ。だからこそ申し上げます。次の大任は、あなたに託したいのです。"],["","先輩天使ガブリエラの差し出した封筒には、見慣れぬ形の文字と、聞いたこともない土地の名が端正に記されておりました。"],["セラフィナ","わたしが、大任を……？　本当に、わたしでよろしいのでしょうか。"],["ガブリエラ","あなただからです。疲れた方を見分ける力は、天界随一。報告書にも、そう書きます。"],["","セラフィナは封筒を両手で受け、幾度も小さく頷きました。羽根は緊張と誇りとで、かすかに震え続けておりました。"]]},"p2":{"bg":"02-florence","next":"sys_intro","lines":[["ガブリエラ","行き先は、遠く東の島国。日本の、大阪という街です。"],["セラフィナ","おおさか……。前回の降臨から、五百年も経つというのに、ですか？"],["ガブリエラ","ええ。世界は大きく様変わりしました。人も、街も、食べ物も。……現地に染まりすぎることのないよう、くれぐれも。"],["","五百年と申せば、セラフィナにとっては長い昼寝ほどの歳月のはずでございました。"],["セラフィナ","承知いたしました。行ってまいります。疲れた方がおられるのなら、どこへでも。"],["","かくして見習い天使は、五百年ぶりの地上任務へ旅立ったのでございます。――この先に何が待つか、この時はまだ知る由もなく。"],["セラフィナ","先輩のお言葉どおり、染まらぬよう心いたします。わたしは天使でございますから、しっかりと。"]]},"c0":{"bg":"11-descending-sky","next":"c1","lines":[["","雲を抜けますと、夜の海原のように光の粒が広がる景色が目に飛び込んでまいりました。"],["セラフィナ","まあ……！　星が、地面に落ちて散らばっているみたいです。"],["","それは星ではございませんでした。街の灯り、車の灯り、眠らぬ店の灯り。五百年前には存在しなかった、数え切れぬほどの光でございました。"],["セラフィナ","すごい、すごいことです……！　あれは皆、人が作った明かりなのですか？"],["","あまりの眩しさに目を細めるセラフィナ。その小さな翼は、降臨の光を浴びて、まだ真っ白に輝いておりました。"],["セラフィナ","大阪、見えました。セラフィナ、これより降臨いたします！"],["","地へ近づくにつれ、街の音が少しずつ聞こえてまいります。電車の走る音、行き交う声、店の呼び込み。五百年前にない、忙しくも温かな響きでございました。"],["セラフィナ","なんだか胸が高鳴ります。怖いというのとは、少し違う……楽しみ、なのかもしれません。"]]},"c1":{"bg":"03-osaka-arrival","next":"c2","lines":[["","大阪へ到着いたしました。最初の試練は、人混みでございました。"],["セラフィナ","ひゃっ。……あ、申し訳ございません。……わっ、そちらからも人が……！"],["","四方八方から流れてくる人の波です。五百年前のフィレンツェの祭りの日より、なお賑やかでございました。"],["","行き交う人々の手には、薄く光る板。文字や絵の映る、不思議な道具でございました。"],["セラフィナ","皆さま、あの板を逆さにお持ちで……あ、いえ。逆になっておりましたのは、わたしの方でございました。"],["","真似て持ってみましたら、映る文字が皆さかさまでした。セラフィナは慌てず、そっと板を持ち直しました。"],["セラフィナ","落ち着いて、観察です、観察。……あの方の肩、震えておられますね。疲れた方が、こんなにもたくさん。"],["","駅の天井は高く、案内の文字は光を放ち、床は磨かれて靴音を響かせておりました。フィレンツェの大聖堂とは違いますが、ここにも人の真剣な空気が満ちておりました。"],["セラフィナ","まず、この街の歩き方を覚えなくては。右側でしょうか、左側でしょうか……郷に入っては郷に従え、でございますね。"]]},"c2":{"bg":"12-vending-machine","next":null,"lines":[["セラフィナ","……あ！　この箱、光っております。中に飲み物が並んでいるのに、店員さまが見当たりません。"],["","自動販売機。お金を入れますと、冷たい飲み物が『がしゃん』と落ちてくる、現代の不思議な箱でございます。"],["セラフィナ","無人なのに、働いている箱……？　五百年で、箱まで働く世の中になったのですね。"],["","販売機の前を行く人々は、誰一人驚きません。驚いているのは、五百年ぶりの天使ばかりでございました。"],["セラフィナ","ええと、どれにいたしましょう。任務の前に、まず一口いただきます。"],["","並んだボタンの向こうでは、色とりどりの缶と瓶が、静かに出番を待っておりました。"]],"choices":[{"text":"甘いジュースに挑んでみる","shoku":8,"iyashi":0,"next":"r1a"},{"text":"無難に、お水にしておく","shoku":1,"iyashi":0,"next":"r1b"}]},"r1a":{"bg":"12-vending-machine","next":"c3","lines":[["","一口含んだ瞬間、セラフィナの目がまん丸になりました。"],["セラフィナ","あま……！　甘くて、冷たくて、しゅわしゅわいたします！　果物が口の中で踊っているみたいです！"],["","通りすがりの子どもが、嬉しそうに笑う天使を二度見いたしました。"],["","翼は、気のせいか少しばかり――ほんの少しばかり、色が薄らいだように見えました。本人は、もちろん気づいておりません。"],["セラフィナ","任務の前の腹ごしらえ、完了でございます！　……あれ、今の言い方、少し人間らしくありませんでしたか。"]]},"r1b":{"bg":"12-vending-machine","next":"c3","lines":[["セラフィナ","お水、おいしゅうございます。故郷の泉のように、すっと体に入ってまいります。"],["","慎ましく喉を潤す天使を、販売機の明かりが静かに照らしておりました。翼はまだ、ぴかぴかのままでございます。"],["セラフィナ","よし、落ち着きました。任務、開始でございます！"],["","販売機は今日も、来る人ごとに冷たい一本を手渡し続けるのでしょう。無人の箱の静かな働きぶりに、セラフィナは小さく頭を下げました。"]]},"c3":{"bg":"26-automatic-door","next":"c4","lines":[["","駅の建物に入ろうといたしましたら、目の前の扉が――"],["セラフィナ","わっ！　扉が、独りでに開きました！　どなたか中から開けて……おられないですね？"],["","自動ドア。人が近づくだけで開く、親切な扉でございます。セラフィナは確かめるため三度通って、三度とも驚きました。"],["通りすがりの人","お姉さん、さっきから何往復してはるん？"],["セラフィナ","す、すみません！　確認です、確認なのです！　……便利な世の中ですねえ。"],["","笑って手を振る通行人。怒る方はおられませんでした。大阪の人は、少しだけ優しいのかもしれません。"],["セラフィナ","扉にまで気を配る国なのですね。開くたびに『どうぞ』と言われているような気がいたします。"],["","セラフィナは最後にもう一度だけ扉を通り、今度は小さくお辞儀をしてから、駅の奥へ進みました。"]]},"c4":{"bg":"14-ic-gate","next":null,"lines":[["","改札。薄いカードを機械にかざしますと、小さな音が鳴って扉の開く場所でございます。"],["セラフィナ","あの音……『ピッ』。皆さま、あの音とともに通っておられるのですね。"],["","セラフィナも、見よう見まねでカードをそっとかざしてみました。"],["セラフィナ","ピッ！　……開きました！　わたしまで、つい『ピッ』と申してしまいました。"],["","小さな音とともに扉の開くさまは、なんだか小さな魔法のようで、セラフィナは少し嬉しくなっておりました。"],["","周りの人々は慣れた手つきでカードをかざし、足早に通り抜けてまいります。その流れの速さに、セラフィナは目を丸くいたしました。"]],"choices":[{"text":"嬉しくて、もう一度ピッとしてみる","shoku":6,"iyashi":0,"next":"r2a"},{"text":"落ち着いて、一度だけにしておく","shoku":2,"iyashi":0,"next":"r2b"}]},"r2a":{"bg":"14-ic-gate","next":"c5","lines":[["駅員さん","お客さん、そのカードは入場済みですよー。"],["セラフィナ","あっ、すみません！　つい楽しくて……この音、なんだか癖になりますね。"],["","駅員さんは笑って許してくださいました。セラフィナの頭の輪が、ほんの少し薄くなったことに、その場の誰も気づきませんでした。"],["セラフィナ","ピッ、は一日一回まで。……覚えました。多分。"],["","改札の向こうでは、次の電車の案内が流れておりました。セラフィナは慌てて小走りになり、翼が少しだけはみ出しそうになりました。"]]},"r2b":{"bg":"14-ic-gate","next":"c5","lines":[["セラフィナ","一度で十分です。……十分です。……少しだけ、もう一度したかったですけれど。"],["","名残惜しそうに改札を離れる天使。現代の誘惑は、小さな音の形をしても、そっとやってまいります。"],["セラフィナ","我慢も任務のうち、です。ええ、任務のうち。"]]},"c5":{"bg":"15-crowded-train","next":null,"lines":[["","電車の中は、立ったままうとうとする人、画面を見つめる人、ため息を飲み込む人でいっぱいでございました。"],["セラフィナ","（羽根が震えております……この車両、疲れた方がこんなにも）"],["","吊り革につかまる会社員の肩が、小さく震えております。目は閉じているのに、眉間には深い皺が寄っておりました。"],["セラフィナ","（わたしの仕事は、こういう方のそばにいることでございます）"],["","フィレンツェでも、大阪でも。疲れた人の姿は、五百年経っても変わらぬものでございました。"],["","混んだ車内では、誰も大きな声を出しません。静かに耐え、静かに譲り、静かに眠る。それもこの街の、優しさの形なのかもしれません。"],["セラフィナ","（大丈夫ですよ。少しだけ、わたしが見ておりますから）"]],"choices":[{"text":"肩にそっと手を置く（天使のやり方で）","shoku":2,"iyashi":8,"next":"r3a"},{"text":"静かに見守るだけにする","shoku":0,"iyashi":3,"next":"r3b"}]},"r3a":{"bg":"15-crowded-train","next":"c6","lines":[["","セラフィナがそっと手を置きますと、会社員の眉間の皺が、ゆっくりとほどけてまいりました。"],["会社員","……あれ。少し、楽になった気がする。気のせい、かな。"],["セラフィナ","気のせいでは、ございませんよ。今日もおつかれさまです。"],["","聞こえるはずのない声に、会社員はなぜか小さく頷いて、安心した顔でそっと目を閉じました。"],["","車両のざわめきは変わりません。それでも、一人の方の肩の力が抜けました。それで十分だと、セラフィナは思いました。"],["","電車が駅に近づきますと、会社員は鞄を持ち直し、少しだけ伸びをして立ち上がりました。その足取りは、乗ってきた時より軽うございました。"]]},"r3b":{"bg":"15-crowded-train","next":"c6","lines":[["","セラフィナは騒がず、ただ近くで見守りました。それでも不思議と、周りの空気が少しだけ和らいだ気がいたしました。"],["セラフィナ","直接でなくても、そばにいるだけでよいことも、ございますよね。"],["","見守ることも、立派な仕事のひとつ。五百年の間、セラフィナがずっと続けてきたことでございました。"],["","会社員は小さく深呼吸をして、少しだけ穏やかな顔で目を閉じました。"]]},"c6":{"bg":"04-conveni-pudding","next":null,"lines":[["","夜でも眩しく光る店。扉を開けますと、涼しい空気と、おいしそうな香りが迎えてくれました。"],["セラフィナ","ここがコンビニ……。二十四時間開いている、まるで小さな神殿のような場所ですね。明るくて、食べ物があって、どなたでも入れる。"],["","棚には色とりどりの菓子、温かい料理、飲み物、雑誌、傘まで。五百年前の市場が、そのまま小さな店に詰め込まれたようでございました。"],["セラフィナ","あ……あれは。黄色くて、つやつやしていて、カップの中で光っている、あの子は……"],["","プリン。現代日本が誇る、小さくて、しかし偉大な発明でございます。"],["セラフィナ","天使の食事には、こんな色のものは、ございませんでした……"],["","温かいお弁当の棚、冷たい飲み物の棚、お菓子の棚。小さな店の中に、一日分の暮らしが全部そろっておりました。"],["セラフィナ","この国は、夜に働く方のために、夜の間も店を開けておくんですね。……優しい仕組みです。"]],"choices":[{"text":"プリンと、気になるお菓子も買う","shoku":9,"iyashi":0,"next":"r4a"},{"text":"プリンは、ひとつだけにしておく","shoku":4,"iyashi":0,"next":"r4b"}]},"r4a":{"bg":"04-conveni-pudding","next":"c7","lines":[["セラフィナ","プリンと、この丸いのと、この袋と……あと、これも気になります！"],["","気づけば、買い物かごはお菓子でいっぱいになっておりました。レジの店員さんが、少し驚いた顔をなさいました。"],["店員さん","袋、お分けしますか？"],["セラフィナ","お願いいたします！　……わたし、いつの間に、こんなに。"],["","翼の白さが、またほんの少しだけ薄くなっておりました。本人は、プリンしか見ておりません。"],["セラフィナ","これは任務に必要な買い物です。……たぶん、きっと、おそらく。"]]},"r4b":{"bg":"04-conveni-pudding","next":"c7","lines":[["セラフィナ","ひとつだけ。……ひとつだけですよ、セラフィナ。"],["","自分に言い聞かせるように頷いて、プリンを大事に両手で持ちました。その姿は、五百年前と何も変わらぬ、慎ましい天使でございました。"],["セラフィナ","いただきます。……！　とろけます……。これは、危険なおいしさです。"],["","ほんの一口で頬が緩みます。天使は小さくため息をついて、もう一口、丁寧に味わいました。"]]},"c7":{"bg":"13-escalator","next":"c8","lines":[["","駅の大きな建物の中。階段が、自分で動いておりました。"],["セラフィナ","階段が……動いております！　立っているだけで、上へ運んでくれるのですか？"],["","エスカレーター。大阪では右側に立って、左側を急ぐ方のために空けるのが、暗黙の約束だそうです。"],["セラフィナ","右に立つ街と、左に立つ街がある……。同じ国の中でも違うのですね。旅は、学びです。"],["","律儀に右側に立って運ばれてゆく天使。周りの人々は、そんな天使に気づかず、それぞれの目的地へ急いでおりました。"],["セラフィナ","わたしも、ちゃんと大阪の方みたいに立ててますか？"],["","隣に立った学生が、器用に片手で本を読みながら運ばれてゆきます。セラフィナは感心して、その背中を見送りました。"],["セラフィナ","皆さま、この動く階段の上で、とても落ち着いておられますね。慣れって、すごいです。"]]},"c8":{"bg":"20-dotonbori-bridge","next":null,"lines":[["","夕方。川沿いの橋の上は、写真を撮る人、笑う人、食べ歩く人で賑わっておりました。"],["セラフィナ","道頓堀……。看板が大きくて、光が水に映って、まるでお祭りの夜みたいです。"],["","屋台からは、ソースの香ばしい香り。丸く焼かれた小さな食べ物が、鉄板の上で上手に踊っておりました。"],["屋台の主","たこ焼き、焼きたてやでー！　お姉ちゃん、寄ってきなー。"],["セラフィナ","たこ、焼き……。丸くて、熱くて、とても、おいしそうな……！"],["","セラフィナの羽根が、今度は食欲の方へ向かって、小さく震えておりました。"],["","橋の上では、大きな人形の看板が腕を広げ、かにの看板が足を動かし、街全体が誰かを歓迎しているようでございました。"]],"choices":[{"text":"たこ焼きを食べて、関西の言葉を真似てみる","shoku":8,"iyashi":0,"next":"r5a"},{"text":"橋の上から、静かに景色を眺める","shoku":2,"iyashi":2,"next":"r5b"}]},"r5a":{"bg":"20-dotonbori-bridge","next":"c9","lines":[["セラフィナ","あつっ、あつあつ……！　でも、おいしいです！　外はかりっと、中はとろっとろです！"],["屋台の主","うまいこと言うなあ。……で、どうや、この味。"],["セラフィナ","最高です！　……あの、『なんでやねん』と申すと褒められるって、本当ですか？"],["屋台の主","ははっ、今のは使い方がちゃうけど、まあ合格や！"],["","笑う屋台の主人と、笑う天使。頭の輪は夕日に紛れて、だいぶ見えにくくなっておりました。"],["セラフィナ","なんでやねん……。難しいですけど、温かい言葉ですね。"],["","屋台の主は、セラフィナの分にソースを少しだけ多めにかけてくれました。言葉は荒くても、手つきはとても優しかったのです。"]]},"r5b":{"bg":"20-dotonbori-bridge","next":"c9","lines":[["","セラフィナは橋の欄干にもたれて、水面に揺れる光を、静かに眺めました。"],["セラフィナ","五百年前のフィレンツェにも、川と橋がございました。……国は違っても、夕方の川は、人の心を休ませますね。"],["","行き交う人々の笑い声を聞きながら、天使はしばらく、その景色の中に立っておりました。"],["","その穏やかな横顔は、紛れもなく、癒しの天使のものでございました。"],["セラフィナ","おいしいものも、楽しい音も、たくさんありました。でも、こうして静かに立つ時間も、この街はくれるんですね。"]]},"c9":{"bg":"23-otsukaresama","next":"c10","lines":[["","帰り道。駅のベンチに、うつむく人がおりました。"],["","スーツには少し皺が寄り、手には重そうな鞄。今日一日を、精一杯に生きた人の姿でございました。"],["セラフィナ","（羽根が、強く震えております。この人です。今日わたしが会いに来たのは、きっと、この人）"],["","セラフィナは音もなく隣に座り、祈るように、そっと声をかけました。姿は見えなくても、言葉が届くことは、あるのです。"],["セラフィナ","今日もおつかれさまです。あなたのがんばり、ちゃんと届いておりますよ。"],["","人はふっと顔を上げ、理由もなく少し笑って、重い鞄を持ち直して歩き出しました。その背中は、来た時より少しだけ、軽そうでございました。"],["セラフィナ","よかった。……今日も、ちゃんとお役に立てたみたいです。"],["","ベンチを離れる時、セラフィナは小さく手を振りました。相手には見えていなくても、それが彼女の挨拶でございました。"],["セラフィナ","明日も、誰かのそばにおられますように。"]]},"c10":{"bg":"22-night-view","next":"c11","lines":[["","夜。借りた小さな部屋の窓から、大阪の夜景が見えました。"],["セラフィナ","明かりが、こんなにたくさん。……あの明かりのひとつひとつに、今日みたいな一日があるんですね。"],["","プリンの空きカップが、テーブルの端に置いてあります。自動販売機のジュースの缶も、仲良く並んでおりました。"],["セラフィナ","わたし、今日一日で、ずいぶんいろんなものを好きになってしまいました。"],["セラフィナ","でも、疲れた人のそばにいることは、忘れておりません。それだけは、ちゃんと覚えております。"],["","窓の外では、街が静かに眠り始めておりました。天使の長い一日も、そろそろ終わろうとしておりました。"],["セラフィナ","フィレンツェの夜は、鐘の音で終わりました。大阪の夜は、明かりが少しずつ消えてゆくんですね。"],["","買ってきたお菓子の袋が、椅子の背に掛けてあります。明日の分だと、セラフィナは自分に言い訳をしておりました。"]]},"c11":{"bg":"28-report-sleep","next":"BRANCH","lines":[["","天界への報告書を書き始めたセラフィナでしたが――"],["セラフィナ","ええと、『大阪は眩しくて、ピッという音が楽しくて、プリンは危険なほどおいしくて……』"],["セラフィナ","……あれ。これ、報告書じゃなくて、日記みたいになってますね……"],["","ペンを持ったまま、こっくり、こっくり。やがて、小さな寝息が聞こえてまいりました。"],["","見習い天使の、大阪一日目が終わります。――さて、彼女はどこまで、染まったのでしょう。"],["","答えは、薄くなった輪と、少しだけ軽くなった翼と、お菓子の袋の中に、静かに眠っておりました。"]]},"e_high":{"bg":"28-report-sleep","next":"INT1","lines":[["",""],["","報告書の半分は、食べ物の感想で埋まっておりました。輪は薄く、翼はほんのりと色づいて――いや、本人の言葉を借りれば、『気のせい』だそうです。"],["セラフィナ","明日は日本橋に行ってみようと思います。フィギュアというものを、この目で確かめなければ！"],["","使命感と好奇心が、見事に混ざり合っておりました。――この調子では、先輩のガブリエラが心配する日も、近いかもしれません。"],["","それでも、ベンチの人の背中を軽くした手の温かさは、本物のままでございました。"],["セラフィナ","染まっても、わたしはわたしです。……たぶん、きっと。おやすみなさい、大阪。"]]},"e_mid":{"bg":"28-report-sleep","next":"INT1","lines":[["",""],["","報告書には、任務の記録と一緒に、小さな感想が添えられておりました。『ピッの音は楽しい』『プリンはおいしい』と。"],["セラフィナ","染まる、というより……馴染む、です。きっと。たぶん。"],["","翼はまだ白い。でも、確かに一日目の朝の色ではなくなっておりました。"],["","馴染むことと、忘れないこと。その両方を抱えて、天使の大阪の日々は続いてまいります。"],["セラフィナ","明日は、もう少しだけ、この街のことを知りたいです。"]]},"e_low":{"bg":"28-report-sleep","next":"INT1","lines":[["",""],["","報告書は丁寧で、模範的で、少しだけ堅うございました。翼も輪も、降臨の時と変わらぬ輝きのままでございます。"],["セラフィナ","任務は順調です。……ただ、プリンという食べ物だけは、少し気をつけた方がいいかもしれません。"],["","慎ましい天使の大阪生活は、まだ始まったばかり。本当の意味での『蝕まれ』は、これからなのかもしれません。"],["","それでも、疲れた人のそばに立つ姿勢は、五百年前から何ひとつ変わっておりませんでした。"],["セラフィナ","おやすみなさい。明日も、いい日になりますように。"]]},"fin":{"bg":"01-key-visual","next":null,"end":true,"lines":[["","『セラフィナ』序章、第1章「降臨」、第2章「日本橋どっぷり」――これで、おしまいです。"],["","遊んでくださった皆さまへ。ありがとうございました。どうか今夜は、よくお休みください。"]]},"n0":{"bg":"01-ota-road","next":"n1","lines":[["","翌朝。セラフィナは書きかけの報告書をそっと伏せ、昨日より軽い足取りで部屋を出た。"],["セラフィナ","今日は日本橋です。電気のまち、でんでんタウン。フィギュアというものを、自分の目で確かめに行きます"],["","電車を降りると、昨日とは違う熱気が待っていた。大きな看板、開店前の列、手書きのポスターが陽に光る。"],["","通りの両側には電気部品の店、模型の店、カードの店。店先ごとに、詳しい人の手書き案内が貼られている。"],["セラフィナ","ここがオタロード……。皆さん、目がきらきらしています。好きなものがある人の目は、光るんですね"],["","そのとき通りの角で、小さな白い影と目が合った。雲のようにふわふわな子猫が、ちょこんと座ってこちらを見ている。"],["セラフィナ","あら。あなたも、お散歩ですか？"],["","子猫はにゃあ、と穏やかにひと声鳴いて、しっぽを振りながら人混みの向こうへ消えた。なんだか良い一日になりそうだった。"],["セラフィナ","よし。日本橋巡り、始めます！"]]},"n1":{"bg":"05-maid-cafe","next":"n2","lines":[["","最初に足が止まったのは、レースとリボンにあふれた、小さなお城のような店の前だった。"],["メイドさん","お帰りなさいませ、お嬢様！　……まあ、その衣装！　完成度が高すぎて、本物みたいです！"],["セラフィナ","あの、これはコスプレでは……ええと、まあ、そういうことにしておきましょうか"],["","天使のドレスは、この街では『本格派のコスプレ』として大歓迎だった。説明する間もなく、席へ案内されてしまった。"],["メイドさん","こちらが当店のオムライスです。ケチャップでハートを描きますね"],["セラフィナ","食べ物の上に絵を描くのですか……？　もったいなくて、なかなか崩せません"],["セラフィナ","一口ごとに、胸の奥が温かくなります。お料理で人を癒す方も、いるのですね"],["","ふわふわの卵、湯気の向こうの笑顔。フィレンツェの食堂にも同じ温かさがあった。形は違っても、もてなす心は同じだ。"],["セラフィナ","（この街の人たちは、好きなものを誰かと分け合うのが上手ですね）"]]},"n2":{"bg":"05-maid-cafe","next":null,"lines":[["メイドさん","お嬢様、もっと美味しくなる魔法をかけましょう！　ご一緒に、『萌え萌え、きゅん！』です！"],["セラフィナ","魔法……ですか？　わたし、かける側には少し心当たりがありまして"],["","メイドさんは両手でハートを作り、期待に満ちた目でこちらを見ている。"],["セラフィナ","（ただの掛け声のはずです。……はず、ですよね？）"],["","セラフィナは小さく息を吸って、ポーズを真似した。"]],"choices":[{"text":"心を込めて、真剣に『萌え萌えきゅん！』","shoku":6,"iyashi":6,"next":"r6a"},{"text":"恥ずかしいので、小さな声でそっと","shoku":2,"iyashi":3,"next":"r6b"}]},"r6a":{"bg":"05-maid-cafe","next":"n3","lines":[["セラフィナ","萌え萌え……きゅん！"],["","――その瞬間、店内に淡い金の光が、ふわりと広がりました。本物の、祝福の光でございます。"],["メイドさん","え……？　今の、演出……じゃないですよね…？　オムライスが、光って……"],["お客さん","なんだか、肩の疲れがすっと取れた……。昨日の残業の疲れが、嘘みたいだ。"],["","店内は騒然となり、そして、静かになりました。誰もが少しだけ泣きそうな、穏やかな顔をしておりました。"],["セラフィナ","あ、あの、これは、その……愛情表現の、上級者向けのやつ、です！　きっと！"],["メイドさん","上級者……！　さすがお嬢様です……！"],["","誰も深くは追及しませんでした。この街の人々は、説明のつかない素敵なことを、素敵なまま受け取るのが上手だったのです。"]]},"r6b":{"bg":"05-maid-cafe","next":"n3","lines":[["セラフィナ","も、萌え萌え……きゅん、です。"],["","小さな声でしたけれど、光は正直でございました。オムライスの上に、金色のきらめきが、ほんのりと降り積もりました。"],["メイドさん","わ……今、キラキラって……。お嬢様、魔法、本当に使える方なんですね。"],["セラフィナ","気のせいです！　照明です、きっと照明の加減です！"],["","隣の席のお客さんが、ほっと息をついて笑いました。理由は分からないけれど、今日はいい日になりそうだ、と言って。"],["","大きさは控えめでも、届くものは届きます。セラフィナは、ほっと胸をなで下ろしました。"]]},"n3":{"bg":"02-maid-cafe-cheki","next":"n4","lines":[["メイドさん","記念にチェキはいかがですか？　お嬢様の衣装が素敵で……私たちも一緒に撮りたいです！"],["セラフィナ","写真ですか。……はい、ぜひ。わたしにとっても、今日は記念日ですから"],["","シャッターの瞬間、セラフィナの翼が嬉しそうに揺れたのを、メイドさんたちは『衣装のギミック』だと思って大喜びした。"],["メイドさん","また来てくださいね、お嬢様。今度はぜひ、魔法の掛け方を教えてください！"],["セラフィナ","（教えるのは、少し難しいかもしれません……）はい、また来ます。皆さんも、今日はおつかれさまでした"],["","店を出る時、ガラス窓の向こうにあの白い子猫が座っていた。チェキを撮る様子を、最初から最後まで見ていたらしい。"],["セラフィナ","あら、あなたも見ていたんですか。……ふふ、あの光は内緒ですよ"],["","子猫はにゃ……と小さく鳴いて目を細め、路地の向こうへ歩いていった。"]]},"n4":{"bg":"06-figure-shop","next":null,"lines":[["","次に入ったのは、ガラスケースの並ぶフィギュアの店だった。棚の上では小さな人々が、それぞれの物語の中で静かに立っている。"],["セラフィナ","すごい……。小さいのに、服の皺も表情も、その人そのものです。作った方の愛が詰まっていますね"],["","ケースを一つずつ眺めて歩くセラフィナ。その足が、ある一点でぴたりと止まった。"],["セラフィナ","……あれは"],["","金髪のウェーブ、サイドの三つ編み。空色の瞳に小さな白い翼と淡く光る輪。白と金のドレス、水色のリボン。"],["セラフィナ","わたし……ですよね、これ。わたしが小さくなって、ケースの中にいます"],["店員さん","お目が高いですね。その天使さん、人気シリーズなんですよ。残り、あと一体だけです"],["セラフィナ","（どうしましょう。自分の姿の人形を買うことは、天使の規則のどこにも書いてありませんでした……）"]],"choices":[{"text":"買います。……わたしを、買います！","shoku":10,"iyashi":0,"next":"r7a"},{"text":"今日は我慢して、見るだけにします","shoku":3,"iyashi":2,"next":"r7b"}]},"r7a":{"bg":"06-figure-shop","next":"n5","lines":[["セラフィナ","あの……これ、ください。わたしを、わたしが買います。"],["店員さん","ありがとうございます！　……熱心なファンの方なんですね、その格好も、その子にそっくりで。"],["セラフィナ","ふふ。……ええ、熱心な、ファンです。"],["","財布が、音を立てて開きました。任務のお金が、自分の姿をした小さな天使に変わってゆく。その事実に、なぜか胸がいっぱいでした。"],["店員さん","大事にしてくださいね。その子、きっと良いことがありますよ。"],["セラフィナ","はい。……絶対に、大事にします。なんといっても、わたしですから。"],["","箱を両手で抱えるセラフィナの頬は、少し赤うございました。翼の色がまた薄くなったことには、今日も誰も気づきませんでした。"]]},"r7b":{"bg":"06-figure-shop","next":"n5","lines":[["セラフィナ","だめです、セラフィナ。任務中です。今日は見るだけ……見るだけ、です。"],["","店を出かけた足が、ケースの前で止まります。進んでは、止まる。止まっては、振り返る。"],["店員さん","あの……小さいサイズなら、ストラップ型もありますよ。お手頃です。"],["セラフィナ","小さい方……。小さい方なら、任務の範囲内……ですよね？　たぶん、きっと。"],["","こうしてセラフィナは、小さな自分のストラップを一つだけ買いました。大きな方は、名残惜しそうに、また今度と手を振りました。"],["セラフィナ","（次に来る時は、きっと……。いえ、その『次』が怖いですね、わたし）"],["","レジの店員さんの肩が疲れて見えたので、セラフィナは帰り際にそっと声をかけました。今日もおつかれさまです、と囁くように。店員さんは不思議そうに、それでも笑顔で頭を下げました。"]]},"n5":{"bg":"11-figure-unboxing","next":"n6","lines":[["","部屋に戻ると、セラフィナは正座をして、買ってきた箱を目の前に置いた。"],["セラフィナ","開封の儀、です。……緊張しますね。自分を開けるのですから"],["","フィルムを丁寧に剥がし、箱をそっと開ける。中では小さな天使が、目を閉じて眠るように座っていた。"],["セラフィナ","わあ……。髪の流れまでそっくりです。この、少し天然そうな顔まで……"],["","小さな自分と目が合った気がした。五百年の任務の中で、こんな再会は初めてだった。"],["セラフィナ","初めまして、セラフィナさん。これからよろしくお願いしますね"],["","部屋の隅では、なぜかついてきてしまった白い子猫が、新しい箱の中へ興味津々に顔を覗かせていた。"],["セラフィナ","あら、あなた、いつの間に……。まあ、いいでしょう。その箱は、あなたのものにしていいですよ"]]},"n6":{"bg":"12-figure-shelf","next":"n7","lines":[["","翌日、セラフィナは小さな棚を組み立てていた。説明書と格闘すること、二時間。"],["セラフィナ","できました……！　ここが、あなたの場所です"],["","棚の真ん中に小さな天使が座った。朝の光が輪に当たって、ほんのり輝いて見える。"],["セラフィナ","ふふ。なんだか、部屋が明るくなったみたいです"],["","報告書に、この棚のことは書けなかった。書けばきっと、ガブリエラ先輩に心配をかけてしまう。だからこれは、二人だけの秘密である。"],["セラフィナ","任務と、好きなもの。両方を大事にできたらいいのですが"],["","棚の小さな天使は、静かに微笑んでいるように見えた。それで十分だと、セラフィナは思った。"],["セラフィナ","さて、今日の日本橋はゲームのお店からです！"]]},"n7":{"bg":"03-rhythm-game","next":null,"lines":[["","ゲームセンター。音と光の洪水に、セラフィナは思わず立ち尽くした。"],["セラフィナ","ここは……祭りの屋台と、音楽堂と、訓練場が一緒になったような場所ですね"],["","ひときわ大きな音を立てているのは、流れる譜面を叩く音楽ゲームだった。隣の若者の指は、ピアノを弾くように動いている。"],["セラフィナ","音楽に合わせて叩く……。フィレンツェで歌った賛美歌とは違いますけど、リズムは好きです"],["","コインを入れる場所は、もう分かっている。自販機で覚えたのだ。セラフィナは少し得意げに、ゲームの前に立った。"]],"choices":[{"text":"音楽に乗って、本気で叩く","shoku":7,"iyashi":0,"next":"r8a"},{"text":"一曲だけ、と控えめに試す","shoku":2,"iyashi":0,"next":"r8b"}]},"r8a":{"bg":"03-rhythm-game","next":"n8","lines":[["","曲が始まりますと、セラフィナの体が自然に動き出しました。五百年、讃美歌で鍛えたリズム感は、本物でございました。"],["セラフィナ","ここ、ここ、ここですね！　なんだか、踊っているみたいです！"],["","気づけば小さな観客が集まっておりました。翼がリズムに合わせて揺れるのを、皆は衣装の飾りだと思って拍手しておりました。"],["若者","すごい、初めてでそのスコア……！　お姉さん、昔やってたんですか？"],["セラフィナ","ええと……五百年ほど前に、似たようなことを少し。"],["","画面には、見事な判定の文字が並びました。セラフィナは額の汗を拭って、深く息を吐きました。任務より疲れた、かもしれません。"]]},"r8b":{"bg":"03-rhythm-game","next":"n8","lines":[["セラフィナ","一曲だけ。……一曲だけ、ですからね。"],["","結果は、真ん中より少し上くらい。それでも最後の音を叩き終えた時、セラフィナは小さくガッツポーズをしておりました。"],["セラフィナ","楽しい……。これは、楽しい部類の訓練ですね。もう一曲、という気持ちが、とてもよく分かります。"],["","二曲目に伸びかけた手は、理性で押し戻しました。ただし、その理性はかなり弱々しいものでございました。"],["セラフィナ","次に来る口実を、考えてはいけません。……考えてしまいますけど。"]]},"n8":{"bg":"04-crane-game","next":"n9","lines":[["","隣では、ガラスの箱の中でアームが動き、ぬいぐるみを掴もうとしていた。"],["セラフィナ","あと少しのところで落ちてしまうのですね……。見ている方まで力が入ります"],["","何度も挑戦するうちに、小さな白い子猫のぬいぐるみがゆっくり持ち上がり――落ちずに、出口へ滑り込んだ。"],["セラフィナ","取れました！　……あら、この子、どことなく"],["","その時、近くの小さな女の子が、取れなかったぬいぐるみを見て泣きそうな顔をしていた。セラフィナは少し考えて、取ったばかりの子猫をそっと差し出した。"],["","アームが動くたび、周りの見物人まで一緒に息を止める。不思議な一体感のある戦いだった。"],["セラフィナ","この子は、あなたのおうちに行きたがっています。……わたしには、本物がついてきてくれますから"],["女の子","ありがとう、お姉ちゃん！"],["","女の子の笑顔は、どんなスコアよりも輝いていた。セラフィナの仕事は、結局いつもこういうことなのだ。"]]},"n9":{"bg":"05-doujin-shop","next":null,"lines":[["","同人ショップ。壁一面の棚に、薄くて、けれど熱のこもった本が並んでいる。"],["セラフィナ","これは……個人の方が作った本なのですね。『好き』という気持ちだけで、こんなにたくさん"],["","表紙を眺めて歩くうちに、セラフィナは一冊の前に立ち止まった。愛を込めて描かれた物語の本だった。"],["セラフィナ","中身は、その……少し刺激が強いものもあるみたいですけど。作った方の真剣さは本物です"],["","フィレンツェの画家たちも、同じ目をしていた。描きたいものがある人の目は、時代を超えて同じなのだ。"]],"choices":[{"text":"文化の研究として、一冊買ってみる","shoku":6,"iyashi":0,"next":"r9a"},{"text":"そっと棚に戻して、目を伏せる","shoku":1,"iyashi":1,"next":"r9b"}]},"r9a":{"bg":"05-doujin-shop","next":"n10","lines":[["セラフィナ","研究、です。あくまで、地上の文化の、研究です。"],["","レジに持っていくまでの数歩が、今日一番長く感じました。店員さんは何も聞かず、丁寧に袋に入れてくれました。"],["セラフィナ","（帰ってから、ゆっくり読みます。……少し、どきどきしますけど）"],["","紙袋の中の本は、作り手の何か月もの時間が詰まっております。その重さを、セラフィナは大切に抱えて歩きました。"]]},"r9b":{"bg":"05-doujin-shop","next":"n10","lines":[["セラフィナ","わたしには、まだ少し、早いかもしれません……"],["","本を棚に戻す手つきは、とても丁寧でございました。戻した先で、その本はきっと、本当に欲しい人の手に渡るでしょう。"],["セラフィナ","でも、作った方のがんばりは、ちゃんと伝わりました。それだけでも、来てよかったです。"],["","店を出る時、セラフィナは棚に向かって小さく会釈をいたしました。五百年経っても、作り手への敬意は変わりません。"]]},"n10":{"bg":"06-junk-shop","next":null,"lines":[["","ジャンク屋。看板のないその店には、部品、機械、用途の分からない道具が山のように積まれていた。"],["店主さん","いらっしゃい。……お嬢ちゃん、変わった格好だねえ。その羽根、うちの部品より精巧じゃないか"],["セラフィナ","あ、ありがとうございます。……部品じゃ、ないんですけど"],["","店主さんは笑って、山のような部品の説明を始めた。どれも壊れているのに、どれも捨てられずにここにいる。"],["セラフィナ","壊れたものが集まって、誰かを待っている場所なのですね。……なんだか、天界の倉庫に似ています"]],"choices":[{"text":"掘り出し物を探して、山を掘る","shoku":5,"iyashi":0,"next":"r10a"},{"text":"店主さんの昔話に、耳を傾ける","shoku":1,"iyashi":6,"next":"r10b"}]},"r10a":{"bg":"25-junk-treasure","next":"n11","lines":[["","部品の山を、奥へ、奥へ。ほこりの向こうで、何かが小さく光りました。"],["セラフィナ","これは……羽根の形の、飾り？　古いものみたいですけど、とても丁寧に作られています。"],["店主さん","おお、それか。何十年もそこにいたんだ。……あんたが見つけたんだから、あんたのものだよ。安くしとく。"],["セラフィナ","ありがとうございます。大事にします。……わたしの羽根と、少し似ていますね。"],["","掘り出し物とは、探す人のもとへ来るために、ずっと待っていたものなのかもしれません。"]]},"r10b":{"bg":"06-junk-shop","next":"n11","lines":[["店主さん","昔はね、この辺りも小さな工場ばっかりでね……"],["","店主さんの話は長うございました。けれど、セラフィナは相槌を打ちながら、最後まで聞いておりました。話したい人のそばにいるのも、天使の仕事のうちでございます。"],["店主さん","いやあ、聞いてくれてありがとう。……なんだか、肩の荷が下りた気分だよ。"],["セラフィナ","こちらこそ、良いお話でした。今日もおつかれさまです。"],["","店主さんは笑って、帰り際に小さな飴を一つくれました。それは、どんな掘り出し物よりも温かかったのです。"]]},"n11":{"bg":"07-cosplay-shop","next":"n12","lines":[["","コスプレ衣装店。壁には色とりどりの衣装が並び、天使の羽根のセットも堂々と売られていた。"],["店員さん","いらっしゃいませ！　……わあ、その天使衣装、すごいですね！　羽根の質感、どこの造形師さんの作ですか？"],["セラフィナ","あの、これは衣装ではなくて、本物で……"],["店員さん","本物！？　……なるほど、その設定で押し通すタイプですね、分かります！　こだわり、素敵です！"],["セラフィナ","（違うんです、本当に違うんです……）"],["","店員さんの目は本気で尊敬していた。セラフィナは説明を諦めて、少し誇らしそうに衣装の棚を眺めて回った。"],["セラフィナ","（この街では、本物が一番、作り物に見えるんですね……）"],["","帰り際、店員さんが言った。『また来てください、今度はぜひ大会に』。大会とは何なのか、セラフィナはまだ知らない。"]]},"n12":{"bg":"10-used-bookstore","next":"n12b","lines":[["","夕方近く、古本屋に寄った。紙の匂いと静けさと背表紙の並びが、フィレンツェの図書室を思い出させた。"],["セラフィナ","この漫画、何十年も前のものなのに絵が生き生きしています……。大事に読まれてきたんですね"],["","棚の本は、どれも誰かの手を渡ってここに来た。古いものが大切にされ続ける街は、優しい街だと思う。"],["セラフィナ","新しいものと古いものが、喧嘩せずに並んでいる。この街の、そういうところが好きです"],["","セラフィナは古い漫画を一冊買い、そっと鞄に入れた。帰りの電車で読むのが、今から楽しみだった。"],["セラフィナ","文化の研究、順調です。……本当に、研究ですからね"],["","店先のベンチでは、白い子猫が夕日の中でうたた寝をしていた。起こさないように、セラフィナは静かに通り過ぎた。"]]},"n13":{"bg":"16-limited-goods-queue","next":null,"lines":[["","日が傾く頃、駅前の広場に長い行列ができていた。人気作品とコラボしたカフェの、限定メニューの列だという。"],["セラフィナ","すごい人数です……。皆さん、好きなもののためなら、こんなに並べるんですね"],["","列の人々は疲れた顔をしていない。むしろ、待つ時間まで含めて楽しんでいるようだった。"],["セラフィナ","あの紙袋の絵の子が、今日の『推し』……ですよね。ふふ、覚えたての言葉、使えました。わたしの棚の子も、いつか誰かの推しになるのでしょうか"],["","列の最後尾は、まだ伸び続けている。セラフィナは、自分の足と気持ちと、静かに相談した。"]],"choices":[{"text":"行列に並んで、限定メニューを目指す","shoku":8,"iyashi":0,"next":"r11a"},{"text":"並ぶ人たちを応援して、今日は離れる","shoku":1,"iyashi":7,"next":"r11b"}]},"r11a":{"bg":"15-collab-cafe","next":"n14","lines":[["","並ぶこと、一時間弱。ようやく通された席で出てきたのは、作品の世界をそのまま映したような、夢のようなメニューでございました。"],["セラフィナ","か、可愛い……！　飲むのがもったいないです……でも飲みます！"],["","コースターには、抽選で絵柄がついてきます。開けてみますと――天使の羽根を背負った、女の子の絵でございました。"],["セラフィナ","ふふ。また、わたしに似た子です。この街は、わたしを歓迎してくれているんでしょうか。"],["","並んだ時間も、待つ間のわくわくも、全部含めての美味しさでございました。推し活というものの入口を、セラフィナは確かに覗いてしまったのです。"],["セラフィナ","（これは、先輩には内緒の方がいいかもしれません……）"]]},"r11b":{"bg":"16-limited-goods-queue","next":"n14","lines":[["セラフィナ","皆さま、がんばってくださいね。……あの、どなたか、お水はいりませんか？"],["","セラフィナは近くの販売機で水を買い、列の後ろの方の人たちに配って回りました。天使の本分は、こういう時にこそ出てしまうのです。"],["お客さん","え、いいんですか？　ありがとうございます……！　なんだか、元気出ました。"],["セラフィナ","好きなものに会う日は、元気な方がいいですから。今日もおつかれさまです。"],["","限定メニューは食べられませんでした。けれど、振り返って手を振ってくれる列を見て、セラフィナはそれで十分だと思いました。"],["セラフィナ","染まることと、癒すこと。今日は、癒す方を選びました。"]]},"n14":{"bg":"27-nipponbashi-neon-night","next":"BRANCH2","lines":[["","夜。日本橋のネオンが、水たまりと看板と人々の笑顔を色とりどりに照らしていた。"],["セラフィナ","今日一日で、ずいぶん歩きました。メイドさんに、フィギュアに、ゲームに、本に……"],["","両手の紙袋は昨日よりも重い。けれど不思議と、足取りは軽かった。"],["","帰り際、閉店作業をする店員さんが重いシャッターに苦戦していた。セラフィナは黙って近づき、そっと手を貸した。"],["セラフィナ","好きなものが増えるって、荷物が増えることでもあるんですね。……心の方も、鞄の方も"],["店員さん","あ、助かります……！　もう腕が上がらなかったんです。本当に、ありがとうございます"],["セラフィナ","今日もおつかれさまです。……この一言、この街でもちゃんと届くのですね"],["","夜道の途中まで、白い子猫がついてきた。分かれ道で座り込み、にゃあと穏やかに鳴いてこちらを見ている。"],["セラフィナ","また会いましょうね。あなたとは、きっとまた会える気がします"],["","天使の長い、日本橋の一日が終わろうとしていた。"]]},"f_high":{"bg":"27-nipponbashi-neon-night","next":"INT2","lines":[["","紙袋の中身は、もはや任務の範疇を超えていた。棚には小さな自分、鞄には研究資料、心には『沼』という言葉まで住み着いていた。"],["","輪は夜のネオンに紛れてほとんど見えない。翼の白さも、夕日の色を覚えてしまったようだった。"],["セラフィナ","染まっている……とは思いません。馴染んでいる、んです。多分。きっと。おそらく"],["","その言い訳の上達ぶりこそが、何よりの証拠だった。――ガブリエラがこの報告書を読んだら、間違いなく額に手を当てるだろう。"],["","それでも、疲れた人を見つける羽根の震えは、昨日より敏感になっていた。好きなものが増えることは、世界が広がることなのだ。"],["セラフィナ","明日もいい日になりますように。……あと、棚の隣のスペース、空けておきましょう"]]},"f_mid":{"bg":"27-nipponbashi-neon-night","next":"INT2","lines":[["","紙袋は、ちょうど両手に一つずつ。任務と好奇心の、絶妙なバランスだった。"],["","輪は少しだけ薄くなり、翼には街の色がほんのり移っていた。本人は『気のせい』で通すつもりらしい。"],["セラフィナ","好きなものが増えるのは悪いことじゃないはずです。誰かの『尊い』に、少し近づけた気がしますから"],["","その理屈は半分は本当で、半分は言い訳だった。けれどセラフィナの笑顔は、降臨の日より少しだけ、この街の人のものに近づいていた。"],["","癒しの手の温かさは変わらない。変わったのは、その手が紙袋も持てるようになったことくらいである。"],["セラフィナ","報告書には……ほどほどに書いておきましょう"]]},"f_low":{"bg":"27-nipponbashi-neon-night","next":"INT2","lines":[["","紙袋は軽く、報告書は丁寧で、翼と輪は降臨の日の輝きを保っていた。模範的な天使の一日と言ってよかった。"],["セラフィナ","今日も任務は順調でした。……少しだけ、名残惜しい気もしますけど"],["","それでも、メイドカフェの光も、店主さんの昔話も、並ぶ人への一杯の水も、確かにこの街に残った。染まり方だけが、全てではない。"],["","セラフィナの歩幅はいつも通りで、 ode","next":"BRANCH4","lines":[["","初詣からの帰り道、初日の光が境内の石段を温かく照らしていた。"],["セラフィナ","おつかれさまでした、ルチア、モコ。一年、本当にありがとうございました。"],["ルチア","……あんたの輪、春よりやっぱり薄いわ。隠さなくていいのよ。"],["セラフィナ","薄くなっても、ここにありますよ。出会った人たちの分、軽くなったのかもしれません。"],["モコ","ぼくは輪っか、大好き！　薄くたって、セラフィナはセラフィナだよ！"],["","目を潤ませながら、セラフィナは笑った。そして新しい一年の光の中へ歩き出した。"],["","季節は巡っていく。癒やしの輪も、姿を変えながら、誰かのそばへ巡っていく。"]]},"s_end_high":{"bg":"27-hatsumode","next":"INT4","lines":[["","四季をひと巡りして、セラフィナの輪は驚くほど淡くなり、夕日の向こうへ溶け出しそうだった。"],["ルチア","ここまでやれば、見習いとはもう呼べないわね。……心配は、してるけど。"],["セラフィナ","心配してくれる人がいる。それだけで、まだ立っていられます。"],["","届いた評価は、こうだった。人の痛みに近づきすぎた分、輪は姿を変えたのだと。"],["セラフィナ","それでも。おつかれさまです、と。その言葉だけは、まだ言えます。"],["","淡い光は細く、それでも帰り道の足元を優しく照らし続けていた。"]]},"s_end_mid":{"bg":"27-hatsumode","next":"INT4","lines":[["","一年が暮れ、輪の濃さは春の半分ほど。それでも光は、静かに頭上にあった。"],["ルチア","完璧とは言わない。けど、あんたらしいバランスだったんじゃない？"],["セラフィナ","助けることも、休むことも大事。その両方を学んだ一年でした。"],["","評価の声は、寄り添いながら自分の足場も残した一年だった、と告げていた。"],["セラフィナ","おつかれさまです。来年は、休むのも上手になって、助け続けます。"],["","控えめな光は消えず、確かに新しい季節の方を向いていた。"]]},"s_end_low":{"bg":"27-hatsumode","next":"INT4","lines":[["","四季を巡っても、輪は春と変わらぬ明るさで、頭上に浮かび続けていた。"],["ルチア","自分の分を、ちゃんと守ったのね。それも立派なことよ、あんた。"],["セラフィナ","無理をしないから続けられる。続けられるから、出会える人もいるんです。"],["","届いた評価は、穏やかな歩みで季節と人を丁寧に見送った一年、というものだった。"],["セラフィナ","おつかれさまです。来年も、ぼちぼちいきましょうね。"],["","輪は朝日に光り、三人は笑って、新しい一年の坂道を下りていった。"]]},"w0":{"bg":"07-salon-training","next":"w1","lines":[["","小さな癒しサロンの扉を開けると、木の香りがした。静かな音楽が、奥からかすかに聞こえる。"],["","今日から見習いセラピスト。制服の袖はまだ硬くて、腕を曲げるたびに少しつっぱった。"],["柚月","セラフィナさん、初日は分からなくて当たり前。遠慮せず、何度でも聞いてね。"],["セラフィナ","はい、柚月さん。……今日もおつかれさまです、と笑って言えるお店にしたいです。"],["柚月","いい挨拶。まずはタオルの置き場所から。一緒に覚えていこう。"],["","カウンターには予約表とタオル、小さな花。明日の誰かを迎える準備が、静かに並んでいた。"],["セラフィナ","できることはまだ小さいですけど、一つずつ、丁寧にやってみます。"]]},"w1":{"bg":"26-morning-breath","next":"w2","lines":[["","開店まで三十分。窓を開けて空気を入れ替え、床を拭く。最後に、大きく息を吸った。"],["ルチア","おはよう、セラフィナ。焦る朝ほど呼吸はゆっくり。それ、今のあんたに一番大事よ。"],["セラフィナ","ルチア先輩、おはようございます。昨夜は緊張して、なかなか寝つけませんでした。"],["ルチア","分かるわよ。わたしも最初は、タオルを畳む順番だけで頭が真っ白だったもの。"],["モコ","にゃーん。"],["","モコがカウンターの下から顔を出し、セラフィナの靴ひもを前足でちょい、と触った。"],["セラフィナ","モコも来てくれたの。ありがとう。……よし、今日の研修、やってみます。"]]},"w2":{"bg":"07-salon-training","next":"w3","lines":[["","研修初日。練習用のベッドを前に、セラフィナはタオルを握ったまま動けなくなっていた。"],["柚月","力じゃないよ。相手の呼吸に合わせる。急がなくていい、そこだけ意識して。"],["セラフィナ","は、はい……あれ。手が、震えてます。止まって、止まってください、私の手。"],["","指先の震えは止まらず、きれいに畳んだはずのタオルが、くしゃりと形を崩した。"],["ルチア","誰でも最初はそうよ。震えるくらいでちょうどいいくらい。一生懸命ってことなんだから。"],["セラフィナ","でも、お客さまの前でこの手では、不安にさせてしまいます。困りました……。"],["柚月","だから練習があるの。崩れたところから、一緒に見直そう。"]]},"w3":{"bg":"07-salon-training","choices":[{"text":"正直に謝って、最初からやり直す","shoku":0,"iyashi":12,"next":"w_r1a"},{"text":"深呼吸をして、手が落ち着くのを待つ","shoku":1,"iyashi":10,"next":"w_r1b"},{"text":"ルチアに隣で見てもらい、手本と比べる","shoku":0,"iyashi":14,"next":"w_r1c"}],"lines":[["","震える手を見つめ、セラフィナは唇を結んだ。立て直し方は、自分で選ぶことにした。"],["セラフィナ","このまま焦って続けても、きっとまた崩れます。少し考えさせてください。"],["柚月","いいよ、自分の言葉で選びなさい。仕事の答えは、一つじゃないから。"],["ルチア","焦らなくていいわ。選んだやり方で、もう一回やればいいだけよ。"],["","練習室の時計が、静かに針を進めていた。逃げずに向き合う時間が、始まろうとしていた。"]]},"w_r1a":{"bg":"26-morning-breath","next":"w4","lines":[["セラフィナ","すみません。緊張して、失敗しました。……もう一度、最初からやらせてください。"],["柚月","正直に言えたね。謝るのも、大切な仕事の一つだよ。"],["","タオルを畳み直し、今度は動きを一つずつ、小さな声で確かめながら進めた。"],["ルチア","声に出すと落ち着くでしょ。さっきより、ずっと手つきが丁寧よ。"],["セラフィナ","本当ですか。よかった……。私、焦ると早口になるので、気をつけます。"],["柚月","その気づきで十分。今日直せたことは、明日の慌て方も変えてくれる。"]]},"w_r1b":{"bg":"26-morning-breath","next":"w4","lines":[["","セラフィナは目を閉じ、朝教わった呼吸を思い出した。吐く息を、なるべく長くした。"],["セラフィナ","一、二、三……。手だけじゃありません。心の方が、先に走ってました。"],["ルチア","そう、その調子。自分の呼吸が整えば、相手も無理に構えなくて済むのよ。"],["","三度目に息を吐き終えるころ、震えは小さくなり、タオルをまっすぐ置くことができた。"],["柚月","よく待てたね。待つことも技術だよ。覚えておいて。"],["セラフィナ","待つことも技術。……ノートに書きます。心にも、大きく書いておきます。"]]},"w_r1c":{"bg":"07-salon-training","next":"w4","lines":[["セラフィナ","ルチア先輩、隣にいてもらえませんか。手本を見ながら、比べたいんです。"],["ルチア","いいわよ。ほら、わたしは始める前に、相手の様子を一度見てから手を置くわ。"],["","横で見ると、速さよりも間の取り方が大事だと分かった。先輩の動きには、無駄がなかった。"],["セラフィナ","始める前に、一呼吸置くんですね。私、ずっと先へ先へと急いでました。"],["ルチア","気づいたなら上出来よ。人の動きを見て学べる子は、伸びるのが早いの。"],["柚月","頼るのも仕事のうち。一人で抱えたままにしないこと。"]]},"w4":{"bg":"07-salon-training","next":"w5","lines":[["","研修三日目。予約表の書き写しで、午後の枠に同じ名前が二つ並んでいるのを見つけた。"],["セラフィナ","大変です。二時と三時を間違えました。すぐお電話して、確かめます。"],["柚月","早く気づけてよかった。間違いは、隠すより早く伝える方が親切だよ。"],["","電話口で事情を話してお詫びすると、相手は少し笑って、予定をずらしてくれた。"],["会社員の客","わざわざ電話をありがとう。忙しいだろうに、正直な店だね。"],["セラフィナ","ありがとうございます。……同じ間違いでも、伝え方でこんなに違うんですね。"],["ルチア","予約表は約束の紙よ。雑に扱わなければ、気持ちはちゃんと伝わるわ。"]]},"w5":{"bg":"01-office-worker-shoulder","next":"w6","lines":[["","初めてのお客さまを迎える日。スーツ姿の会社員が、少し遠慮がちに扉を開けた。"],["会社員の客","こんにちは。あの、初めてで。よろしくお願いします。"],["セラフィナ","いらっしゃいませ。今日もおつかれさまです。……実は私も、今日が初めてで緊張しています。"],["","思わず出た本音に、二人は顔を見合わせて小さく笑った。部屋の空気が、ふっと緩んだ。"],["会社員の客","はは、正直だね。肩の辺りが張ってる気がして。今日はゆっくりできればと。"],["セラフィナ","かしこまりました。無理のない範囲でどうぞ。寒くないか、時々お聞きしますね。"],["柚月","（小声で）いい出迎え。笑顔で迎えられたら、準備の半分は終わってるよ。"]]},"w6":{"bg":"01-office-worker-shoulder","next":"w7","lines":[["","柔らかな明かりと控えめな音楽の部屋で、セラフィナは一度深呼吸をしてから声をかけた。"],["セラフィナ","寒くありませんか。タオルの重さは、このくらいで大丈夫でしょうか。"],["会社員の客","ちょうどいい。細かいところまで聞いてくれるんだな。"],["","始めてみると、手は思いのほか落ち着いていた。朝の呼吸を、頭の隅で数えながら進めた。"],["会社員の客","仕事が詰まった週でね。誰かにゆっくり接してもらうの、久しぶりだ。"],["セラフィナ","そうでしたか。今日は急がなくて大丈夫です。……ゆっくり、どうぞ。"],["","相手の言葉を急いで受け止めず、うなずいて聞く。セラフィナはそれだけを心がけた。"]]},"w7":{"bg":"08-listening","choices":[{"text":"香りの好みを聞き、アロマオイルを選んでもらう","shoku":1,"iyashi":14,"next":"w_r2a"},{"text":"話に寄り添い、聞き役に徹する","shoku":0,"iyashi":16,"next":"w_r2b"},{"text":"足湯を用意し、温かいタオルで迎える","shoku":1,"iyashi":12,"next":"w_r2c"}],"lines":[["","施術の合間、お客さまがぽつりと今週の出来事を話し始めた。セラフィナは手を止めずに考えた。"],["セラフィナ","この時間、もう少し心地よくできないかな。私にできること、選んでみよう。"],["会社員の客","なんか、ここはほっとするね。うまく言えないけど。"],["","窓の外では商店街を行く人の足音が遠く、この部屋だけ時間がゆっくり流れていた。"],["セラフィナ","急がなくて大丈夫ですよ。今日は、あなたの時間ですから。"]]},"w_r2a":{"bg":"09-aroma-oil","next":"w8","lines":[["セラフィナ","よかったら香りを選んでみませんか。柑橘の爽やかなものと、花の柔らかいものです。"],["会社員の客","選べるのか。じゃあ柑橘で。……ふうん、鼻を通ると、気分が切り替わる感じだね。"],["","小さな瓶を渡すと、お客さまは目を閉じて香りを確かめ、穏やかな顔でうなずいた。"],["セラフィナ","選ぶ時間も、楽しんでもらえたらと思って。無理に決めなくて大丈夫ですよ。"],["会社員の客","自分のために選ぶなんて、普段しないからね。新鮮だったよ。ありがとう。"],["","部屋に広がる香りの中で、会話は無理なく生まれ、途切れても気まずくならなかった。"]]},"w_r2b":{"bg":"08-listening","next":"w8","lines":[["","セラフィナは口数を減らした。今日は話すより、聞く方が合っている気がした。"],["会社員の客","部下の失敗、叱れなくてね。自分が新人だった頃を思い出してさ。"],["セラフィナ","そうなんですね。……その頃の気持ち、まだ大事にしてるんですね。"],["","相づちは少なく、でも丁寧に。話し終えたお客さまは、深く息を吐いて少し笑った。"],["会社員の客","最後まで聞いてくれてありがとう。話したら、頭の中が少し整理できた。"],["セラフィナ","聞くことも仕事なんだと、今日やっと実感しました。"]]},"w_r2c":{"bg":"11-foot-bath","next":"w8","lines":[["セラフィナ","少しお待ちくださいね。足湯の用意と、温かいタオルをお持ちします。"],["会社員の客","おお、足湯もあるのかい。靴を脱いで座るだけで、休日みたいだな。"],["","湯気の立つ足元と柔らかなタオルに、お客さまは目を細め、肩の力を抜いた様子だった。"],["セラフィナ","大阪の街は、みんな歩くのが速いですから。ここではゆっくりでいいんですよ。"],["会社員の客","はは、確かに。時間に追われない場所があるのは、ありがたいよ。"],["","他愛ない雑談が少し弾んで、部屋の空気はますます柔らかくなった。"]]},"w8":{"bg":"12-seeing-off-guest","next":"w9","lines":[["","初めてのお客さまを見送る時間。セラフィナは扉の前で、深くお辞儀をした。"],["会社員の客","今日はありがとう。来たときより、笑う余裕が戻った気がするよ。"],["セラフィナ","今日もおつかれさまです。また疲れたな、という日に思い出してもらえたら嬉しいです。"],["","お客さまは手を振って商店街へ歩いていった。その背中を見送り、胸が熱くなった。"],["柚月","初めてのお客さま、無事に終わったね。震えていた手が、今日は違って見えたよ。"],["セラフィナ","私、誰かの笑顔のために働くの、好きかもしれません。……すごく。"],["モコ","にゃん。"],["","モコが足元にすり寄ってきた。それが小さな合格のしるしのように思えた。"]]},"w9":{"bg":"02-nurse-tea","next":"w10","lines":[["","夕方、夜勤明けの看護師さんが、音を立てないように扉を開けた。挨拶の声も小さかった。"],["看護師の客","こんばんは。少しだけ、静かに過ごせる場所を探してたんです。"],["セラフィナ","いらっしゃいませ、今日もおつかれさまです。奥の席が静かですよ。どうぞこちらへ。"],["","多くを聞かず、温かいお茶と毛布を用意した。湯気を見つめ、相手の目元が少し和らいだ。"],["看護師の客","ありがとう。誰にも気を遣わず、ぼんやりできる時間って貴重でね。"],["セラフィナ","ぼんやり、ですね。私も最近、大事さが分かってきたところです。"],["ルチア","（小声で）何も求めてないときは、そっとしておくのも優しさよ。覚えておきなさい。"]]},"w10":{"bg":"02-nurse-tea","choices":[{"text":"お茶のおかわりをそっと置き、声をかけず見守る","shoku":0,"iyashi":13,"next":"w_r3a"},{"text":"短く様子を聞き、話したくなったら聞くと伝える","shoku":1,"iyashi":15,"next":"w_r3b"},{"text":"好みの香りのハンドタオルを用意して渡す","shoku":0,"iyashi":11,"next":"w_r3c"}],"lines":[["","看護師さんはお茶を両手で包み、窓の外を眺めていた。セラフィナは少し離れて考えた。"],["セラフィナ","声をかけるべきか、かけないべきか。相手の時間を、邪魔したくないな。"],["看護師の客","……ここ、時計の音が優しいね。急かされない感じがする。"],["","カウンターの花が夕方の光で揺れた。静けさをそのままにしておくのも、おもてなしだった。"],["ルチア","（小声で）相手の過ごし方をよく見なさい。答えはそこにあるわよ。"]]},"w_r3a":{"bg":"02-nurse-tea","next":"w11","lines":[["","セラフィナは、おかわりのお茶を音がしないよう置いた。声も、できるだけ小さくした。"],["セラフィナ","ごゆっくりどうぞ。何かあれば、いつでも呼んでくださいね。"],["看護師の客","うん、ありがとう。放っておいてくれるのが、今は助かるの。"],["","相手はしばらく目を閉じて過ごし、帰り際、小さく手を合わせて頭を下げた。"],["看護師の客","また来ますね。ここだと、自分の時間を取り戻せる気がするの。"],["セラフィナ","静けさも、おもてなしなんですね。言葉が少なくても、伝わるものがある。"]]},"w_r3b":{"bg":"08-listening","next":"w11","lines":[["セラフィナ","今日は長い一日でしたか。話したくなったらで大丈夫です。私はここにいます。"],["看護師の客","……ありがとう。今日、患者さんに笑ってもらえてね。それが嬉しかったの。"],["","小さな喜びがぽつりぽつりと語られ、セラフィナは相づちを急がずに聞いた。"],["看護師の客","聞いてほしかったのは、つらい話じゃなくて、嬉しい話だったみたい。"],["セラフィナ","嬉しい話を聞けるのも、幸せな仕事ですね。教えてくれて、ありがとうございます。"],["","二人の小さな笑い声が店内に溶け、夕方の光が少し暖かく見えた。"]]},"w_r3c":{"bg":"02-nurse-tea","next":"w11","lines":[["セラフィナ","よかったら、こちらをどうぞ。ほのかに香るタオルです。好きな方を選んでください。"],["看護師の客","わあ、いい香り。手に取っただけで、少しほっとする。"],["","相手はタオルを顔の近くで確かめるように持ち、ふわりと笑った。"],["セラフィナ","香りって、記憶に残りますよね。今日のことを思い出すきっかけになれば嬉しいです。"],["看護師の客","ありがとう、大切に使うね。心遣いって、こういうことだね。"],["","小さなタオル一枚で、二人の間の緊張が少しずつほどけていった。"]]},"w11":{"bg":"03-sleeping-mother","next":"w12","lines":[["","週末、小さな子どもを連れたお母さんがやって来た。子どもは着いて早々に、夢の中へ入った。"],["お母さんの客","すみません、この子が寝ている間に、少しだけ静かな時間をください……。"],["セラフィナ","もちろんです。今日もおつかれさまです。音を立てないよう、気をつけますね。"],["","足音を忍ばせ、毛布の端を直し、明かりを一段だけ落とす。それだけを静かに済ませた。"],["お母さんの客","（小声で）ありがとう。気にかけてくれる人がいるだけで、心がすっとするの。"],["","眠る子の顔は穏やかで、お母さんもようやく目を閉じた。守りたい静けさが、そこにあった。"],["セラフィナ","大声で励ますだけが優しさじゃないんですね。静かに寄り添う形も、ちゃんとある。"]]},"w12":{"bg":"09-aroma-oil","next":"w13","lines":[["","閉店後。セラフィナは香りの瓶を並べ、感じたことを一つずつノートに書き留めていた。"],["柚月","香りは好みが分かれるよ。好きと、落ち着くは、同じとは限らないから。"],["セラフィナ","はい。前に選んでもらったとき、お客さまが嬉しそうで。もっと知りたくなりました。"],["ルチア","足湯の温度の確かめ方も、上手になったじゃない。見習い卒業も遠くないかもね。"],["セラフィナ","本当ですか！　……いえ、まだ失敗も多いです。浮かれたら、なんでやねん、です。……あ、今の、私言いました？"],["","ノートの隅には来週の目標があった。聞き上手になることと、ちゃんと休むこと。"],["柚月","その二つが両立したら、一人前に近づくよ。"]]},"w13":{"bg":"08-listening","next":"w14","lines":[["","常連のお客さまが来た日。施術よりも先に、近況を話したい様子だった。"],["常連さん","セラフィナちゃん、聞いて。孫が初めて自転車に乗れたんだよ。"],["セラフィナ","わあ、すごいです。常連さんも、練習にずっと付き合ったんじゃないですか。"],["常連さん","その通り。転びそうになるたび、こっちまで力が入ってねえ。"],["","話は笑い交じりに続いた。セラフィナは時計を見ず、相手の表情の変化を見ていた。"],["セラフィナ","話を聞く時間が長くても、それが今日の望みなら、それでいいんだと思います。"],["常連さん","今日もありがとう。ここに来ると、話したいことが増えるんだ。不思議だね。"]]},"w14":{"bg":"07-salon-training","next":"w15","lines":[["","店の評判が広がり、予約は日ごとに増えた。手帳の余白は、見る間に埋まっていった。"],["セラフィナ","来てくれる方が増えるのは嬉しいです。だから、頼まれたら断りたくなくて。"],["柚月","気持ちは分かる。でも予約の間に、休む時間も残すこと。そこは譲らないで。"],["セラフィナ","大丈夫です、私は元気ですから。昼ごはんは立ったまま済ませれば、もう一人入れます。"],["ルチア","セラフィナ。最近、笑顔が硬いわよ。本当に大丈夫なの？"],["","笑って答えたものの、その夜、帰り道で何度も足が止まった。"],["セラフィナ","がんばらなきゃ。待ってくれている人がいるんだから。……がんばらなきゃ。"]]},"w15":{"bg":"07-salon-training","next":"w16","lines":[["","忙しい日が続き、セラフィナの挨拶の声は、日ごとに小さくなっていった。"],["会社員の客","この間はありがとう。また来たよ。……あれ、今日は顔色が良くないんじゃない？"],["セラフィナ","そんなこと、ないですよ。さあ、今日もおつかれさまです。ご案内しますね。"],["","笑顔を作るのに力が要るようになっていた。手帳の字も、ところどころ乱れていた。"],["モコ","にゃあ……。"],["","モコが足元をぐるぐる回って鳴いた。それでも予約表から、目を離せなかった。"],["柚月","セラフィナ、最後の枠は私が入る。あなたは今日、早めに上がりなさい。"]]},"w16":{"bg":"07-salon-training","next":"w17","lines":[["","夕方、タオルを取りに行こうとした、その瞬間に視界がぐらりと傾いた。"],["セラフィナ","あれ……ちょっと、めまいが……。ごめんなさい、座らせて……ください。"],["ルチア","セラフィナ！　ゆっくり座って。柚月さん、水と毛布を。急いで！"],["","椅子に座った途端、張り詰めていた糸が切れたように、涙がこぼれた。"],["セラフィナ","ごめんなさい……迷惑をかけて。私、もっとがんばれるはずなのに。"],["柚月","迷惑じゃない。倒れるまで働くのは、がんばることとは違うよ。"],["会社員の客","セラフィナさん、今日は僕らがお茶を入れる番だ。ゆっくり休んでね。"]]},"w17":{"bg":"24-rest-day-wallpaper","next":"w18","lines":[["","翌日、急きょ休みをもらい、自宅のソファで毛布にくるまった。天井をぼんやり見ていた。"],["ルチア","お見舞いよ。常連さんから預かった手紙と、店のみんなからのお菓子。ほら。"],["セラフィナ","手紙まで……。私、癒す側のはずなのに、みんなに癒されてばかりです。"],["モコ","にゃ〜ん。"],["","モコが膝の上で丸くなった。小さな重みと温もりが、そのまま贈り物のようだった。"],["ルチア","癒す側と癒される側は、順番に入れ替わるものよ。それでいいの。"],["セラフィナ","受け取るのが下手だったんですね、私。ありがとうを、素直に受け取らなきゃ。"]]},"w18":{"bg":"24-rest-day-wallpaper","next":"w19","lines":[["","休み二日目。よく眠り、ゆっくりごはんを食べ、近所を少しだけ歩いた。"],["セラフィナ","休むのは、サボることだと思ってました。……違いましたね。"],["柚月","休むことも仕事のうち。元気な笑顔で迎えるための準備だよ。"],["","その言葉を聞きながら、セラフィナはノートの新しいページを開いた。"],["セラフィナ","休むことも仕事のうち。……今日もおつかれさま、って自分にも言ってあげよう。"],["ルチア","その調子よ。自分を大切にできる人は、相手の大切さにも気づけるんだから。"],["","午後の光が窓から差し込み、セラフィナは久しぶりに、無理のない笑顔になった。"]]},"w19":{"bg":"26-morning-breath","choices":[{"text":"予約の間に、休憩の枠を必ず入れる表を作る","shoku":0,"iyashi":16,"next":"w_r4a"},{"text":"一日の終わりに、深呼吸と振り返りの時間を取る","shoku":0,"iyashi":13,"next":"w_r4b"},{"text":"しんどいときは先輩に頼ると、自分と約束する","shoku":2,"iyashi":14,"next":"w_r4c"}],"lines":[["","復帰の朝、手帳を開いた。無理のない働き方を、今度は自分の言葉で決めたかった。"],["セラフィナ","同じことを繰り返したくありません。私に今いちばん必要な約束って、何でしょう。"],["柚月","決めたらノートに書いておきなさい。迷ったとき、戻れる場所になるから。"],["","朝の光がカウンターに落ちていた。新しい予約表のページは、まだ真っ白だった。"],["ルチア","どんな約束でも、自分の言葉で決めたものは力になるわ。応援してる。"]]},"w_r4a":{"bg":"24-rest-day-wallpaper","next":"w20","lines":[["セラフィナ","予約の間に、必ず休憩の枠を入れます。空白はサボりじゃなく、準備の時間です。"],["柚月","いい決め方だね。その表なら、私も安心して任せられる。"],["","新しい表には、仕事の予定の隣に、休みの印が一つずつ書き込まれていった。"],["ルチア","空白があるから、次の一人をちゃんと迎えられるのよ。"],["セラフィナ","はい。詰め込む優しさより、長く続く優しさを目指します。"],["","手帳を閉じたセラフィナの顔は、前より柔らかく、落ち着いて見えた。"]]},"w_r4b":{"bg":"26-morning-breath","next":"w20","lines":[["セラフィナ","一日の終わりに、深呼吸と振り返りの時間を持ちます。自分を労わるために。"],["ルチア","朝の呼吸に、夜の振り返り。あんたらしい習慣になりそうね。"],["","その夜、店を出る前に目を閉じ、今日出会った笑顔を一つずつ思い返した。"],["セラフィナ","今日もおつかれさま、私。明日も、笑顔で迎えられますように。"],["柚月","振り返る癖がつくと、失敗も無駄にならないよ。"],["","星の見える帰り道、足取りは軽かった。明日への小さな期待が、胸に灯っていた。"]]},"w_r4c":{"bg":"24-rest-day-wallpaper","next":"w20","lines":[["セラフィナ","しんどいときは、抱え込まずに先輩に頼る。そう決めます。約束です。"],["ルチア","う、うん。待ってたわ、その言葉。……頼られるの、嫌いじゃないんだから。"],["","指切りをして、二人は笑い合った。子どもみたいな約束が、今は一番頼もしかった。"],["柚月","頼り合える職場が、一番長く続くんだよ。いいチームになってきた。"],["セラフィナ","一人で全部背負うのが優しさだと思ってました。……違いましたね。"],["","分け合っても優しさは減らない。むしろ増えていく。そう学んだ朝だった。"]]},"w20":{"bg":"24-rest-day-wallpaper","next":"w21","lines":[["","復帰から一週間。ペースを守るようになってから、笑顔でいられる時間が増えた。"],["会社員の客","セラフィナさん、今日は一段と笑顔がいいね。こっちまで元気をもらうよ。"],["セラフィナ","ありがとうございます。休むことを覚えてから、迎える時間がもっと好きになりました。"],["看護師の客","分かるわ、その顔。無理をしていない人の笑顔は、見ていて安心するの。"],["","お客さま同士の会話にも笑いが混じり、店内は穏やかな声に包まれた。"],["柚月","良いお店って、働く人が笑っているお店のことだと思うんだ、私は。"],["セラフィナ","今日もおつかれさまです。……みんなで作る笑顔は、こんなに温かいんですね。"]]},"w21":{"bg":"27-thank-you-letter","next":"w22","lines":[["","ある朝、カウンターに封筒があった。丁寧な文字で『セラフィナへ』と書かれていた。"],["お母さんの客","（手紙）あの日、静かに過ごさせてくれてありがとう。おかげで、また頑張ろうと思えました。"],["セラフィナ","手紙……。私の方が、ありがとうなのに。静かに寄り添っただけなのに。"],["ルチア","その『だけ』が、相手には大きかったのよ。ちゃんと届いてる証拠だわ。"],["","手紙を何度も読み返し、セラフィナはノートの間に大切に挟んだ。"],["柚月","言葉の贈り物は、疲れた日の自分を支えてくれる。大事に持っていてね。"],["セラフィナ","はい。私もいつか、こんな手紙を書ける人になりたいです。誰かの疲れた日に届くような。"]]},"w22":{"bg":"30-report-to-heaven","next":"w_last","lines":[["","一か月の終わり。天界への報告の日が近づき、ノートをまとめ直していた。"],["セラフィナ","失敗も、笑顔も、手紙も、全部書きました。休むことを学んだことも、正直にです。"],["ルチア","飾らない報告が一番よ。天界のみんなも、喜んでくれるはずだわ。"],["モコ","にゃんにゃん。"],["","モコがノートの端を前足で押さえた。合格の判を押してくれたみたいだった。"],["柚月","見習いの期間、本当によくがんばった。ここはもう、あなたの居場所だよ。"],["セラフィナ","ありがとうございます。……このお店で働けて、本当に幸せ者です。"]]},"w_last":{"bg":"30-report-to-heaven","next":"BRANCH5","lines":[["","報告の封筒を閉じる前に、セラフィナは店の中をゆっくり見渡した。"],["セラフィナ","タオルを畳む手つきも、予約表の字も、最初の日とは少し違う気がします。"],["セラフィナ","聞くこと。待つこと。休むこと。どれも、誰かを笑顔にする仕事でした。"],["ルチア","さあ、報告を届けに行くわよ。あんたの言葉で、しっかり伝えておいで。"],["セラフィナ","はい。……今日もおつかれさまです。私と関わってくれた、全ての人に。行ってきます。"],["","扉の向こうには、夕方の商店街の光があった。新しい一日が、静かに待っていた。"]]},"w_end_high":{"bg":"27-thank-you-letter","next":"INT5","lines":[["","笑顔と感謝の言葉に包まれた一か月だった。手紙の束が、その証しだった。"],["ルチア","見事だったわ、セラフィナ。聞くことも休むことも、全部自分のものにできたじゃない。"],["セラフィナ","みんなのおかげです。今日もおつかれさまです、と胸を張って言えます。"],["","天界への報告には、関わった人たちへの感謝が、一人ずつ丁寧に綴られていた。"],["セラフィナ","癒しの仕事は、笑顔を交わす仕事なんですね。これからも大切に続けます。"]]},"w_end_mid":{"bg":"30-report-to-heaven","next":"INT5","lines":[["","失敗もあったが、そのたびに学び直した一か月だった。報告の文字は、飾りのないものだった。"],["ルチア","完璧じゃない。でも、ちゃんと前に進んだわ。その歩み方で大丈夫よ。"],["セラフィナ","まだ見習いですけど、休むことも仕事のうちだと、今なら分かります。"],["","倒れた日のことも隠さず書いた報告は、天界で静かに受け取られた。"],["セラフィナ","今日もおつかれさまです。明日も、私のペースでいきます。"]]},"w_end_low":{"bg":"24-rest-day-wallpaper","next":"INT5","lines":[["","倒れた日の記憶は、まだ胸の奥でちくりと痛む。でも、それも必要な経験だった。"],["ルチア","無理をした分、学んだことも大きかったはずよ。次は自分を守ってあげなさい。"],["セラフィナ","はい……。次は倒れる前に休みます。頼ることも、覚えます。"],["","報告の最後には、小さな字で『休むことも仕事のうち』と添えられていた。"],["セラフィナ","今日もおつかれさまです。ゆっくり休んで、また笑顔で会いたいです。"]]},"l0":{"bg":"01-loungewear-dayoff","next":"l1","lines":[["","第6章　日本の生活者編。"],["","休日の朝。洗濯機の終了音が、まだ眠いセラフィナを起こした。"],["セラフィナ","しまった、回しっぱなしでした。干すのは今しかないですね。"],["ルチア","洗濯に追われる天使なんて、ずいぶん人間らしくなったじゃない。"],["セラフィナ","追われているんじゃなくて……あ、追われていますね。暮らすって、こういうことみたいです。"],["","冷蔵庫には付箋、玄関には買い物袋。あちこちに日々の手順が根づいていた。"],["セラフィナ","お休みの日でも、やることは次から次へ、ですね。"]]},"l1":{"bg":"07-room-makeover","next":"l_c1","lines":[["","昼前、セラフィナは部屋の隅を見つめたまま、しばらく動かなかった。"],["セラフィナ","この棚を窓へ寄せたら、光がもっと奥まで届く気がします。"],["ルチア","模様替え？　先月も向きを変えたばかりじゃないの。"],["セラフィナ","部屋も、住む人に合わせて育つんだと思います。暮らしって、そういうものですから。"],["","棚の上ではモコが「にゃあ」とあくびをし、影からノワールが鈴を鳴らして見ていた。"],["セラフィナ","よし、みんなで大移動です。一仕事の前に――今日もおつかれさま、モコ、ノワール。"]]},"l_c1":{"bg":"07-room-makeove lant-start","next":"l3","lines":[["","つやのある大きな葉の株を、両手でそっと抱えて帰ってきた。"],["セラフィナ","ようこそ、うちへ。名前はまだ考え中です。ゆっくり決めましょうね。"],["ルチア","植物にまで挨拶するのね。でも、その水やり表は気が利いているわ。"],["","窓辺に置いた途端、部屋の空気が一段やわらかくなった気がした。"],["セラフィナ","毎朝見ますからね。葉っぱにも、今日もおつかれさま、って声をかけます。"]]},"l_r2b":{"bg":"09-houseplant-start","next":"l3","lines":[["","つぼみを付けた小柄な株を選び、帰り道は段差を避けてゆっくり歩いた。"],["セラフィナ","咲くかどうかは分かりませんけど、咲くまで一緒にがんばりましょうね。"],["ルチア","結果を急がないのは、いい癖よ。花にも人にも、それぞれ時期があるもの。"],["","水の量をはかり、日当たりの時間を小さなノートに書き留めていった。"],["セラフィナ","記録は大事です。忘れる自信だけは、誰にも負けませんから。"]]},"l_r2c":{"bg":"09-houseplant-start","next":"l3","lines":[["","葉に触れるとほのかに香るハーブの株を、袋に入れて持ち帰った。"],["セラフィナ","料理にも使えて、置くだけで気分もいいなんて、一石二鳥ですね。"],["ルチア","欲張りね。でも、暮らしに役立つ緑っていうのは、悪くないわ。"],["","モコが葉に鼻を寄せて「にゃ……」とくしゃみをし、慌てて後ずさった。"],["セラフィナ","モコには香りが強すぎたみたいです。置く場所を、一段高くしましょう。"]]},"l3":{"bg":"09-houseplant-start","next":"l4","lines":[["","鉢が来て数日、モコとノワールの間に小さな火花が散り始めた。"],["","窓辺の特等席は一つ。モコが先に座ると、ノワールは「にゃん」と低く鳴いて譲らない。"],["セラフィナ","だめですよ、鉢の周りが二人の国境みたいになっています。縄張り争いは、ほどほどに。"],["ルチア","猫の世界は単純よ。場所と匂いと、先にいた権利。その三つで決まるの。"],["","ノワールが土をほじれば、モコは前足で頭を押さえ、鈴の音だけが響いた。"],["セラフィナ","けんかはだめです。でも、距離の詰め方って、人も猫も難しいんですね。"]]},"l4":{"bg":"09-houseplant-start","next":"l5","lines":[["","翌週の晴れた午後、窓辺で思わず見とれる光景があった。"],["","モコが日向で伸びをし、その背中に寄り添うようにノワールが丸くなっていた。"],["セラフィナ","見てください、くっついて寝ています。……なんでやねん、昨日まで唸ってたのに。あ、今の、つい出ちゃいました。"],["ルチア","暖かい場所は、争うより分け合った方が得だって、学んだんでしょうね。"],["","二匹の尻尾が、眠りの呼吸に合わせてゆっくりと同じ拍で揺れた。"],["セラフィナ","相棒って、ぶつかってからなれるものなのかもしれません。いいものを見ました。"],["","鉢の葉の影が、眠る二匹の背中の上で、小さく揺れ続けていた。"]]},"l5":{"bg":"21-moving-greeting","next":"l6","lines":[["","向かいの部屋に新しい住人が来て、廊下で段ボールを開けていた。"],["セラフィナ","こんにちは、向かいの者です。ゴミ出しの日で迷ったら、聞いてくださいね。"],["","相手は恐縮しながら、分別表を写真に撮って、何度もお礼を言った。"],["ルチア","引っ越しの挨拶まで自然にできるなんて、こちらの作法が板についてきたじゃない。"],["セラフィナ","最初は私も、誰かに教えてもらった側でしたから。お互いさま、です。"],["","帰り際、管理人さんにも声をかけ、共用部の電球切れを伝えておいた。"]]},"l6":{"bg":"21-moving-greeting","next":"l7","lines":[["","夕方、同じ階の住人が、買い物袋を抱えたままベンチに座り込んでいた。"],["セラフィナ","大丈夫ですか？　荷物、玄関まで一緒に持ちます。無理しないでくださいね。"],["","仕事でへとへとだと言うその人に、セラフィナは温かいお茶をそっと渡した。"],["セラフィナ","何も解決はできませんけど、座って飲んだら、少しだけ違うかもしれません。"],["","相手は両手で湯のみを包み、ありがとう、と小さく笑った。"],["セラフィナ","今日もおつかれさまです。本当に、よくがんばってらっしゃいましたね。"],["","その一言で、相手の肩から少しだけ力が抜けたように見えた。"]]},"l7":{"bg":"05-shotengai-regular","next":"l_c3","lines":[["","商店街の八百屋で、セラフィナは初めて名前で呼ばれた。"],["","顔を覚えられ、おまけの葉物をもらうのが、最近では珍しくなくなっていた。"],["セラフィナ","常連さんって、こんな感じなんですね。名前で呼ばれるの、ちょっと照れます。"],["ルチア","買い物の回数だけじゃないわよ。挨拶を欠かさないのが、ちゃんと効いているの。"],["セラフィナ","魚屋さんでは旬を聞いて、豆腐屋さんでは揚げの焼き方を教えてもらって……"],["","商店街は、物を買う場所であると同時に、暮らし方を教わる教室でもあった。"]]},"l_c3":{"bg":"05-shotengai-regular","choices":[{"text":"八百屋の荷運びを手伝ってから買う","shoku":1,"iyashi":2,"next":"l_r3a"},{"text":"旬の安い野菜で献立をその場で組み立てる","shoku":0,"iyashi":1,"next":"l_r3b"},{"text":"隣の客とレシピを交換して盛り上がる","shoku":2,"iyashi":2,"next":"l_r3c"}],"lines":[["","今日の買い物は、献立がまったく決まらないまま始まった。"],["ルチア","冷蔵庫の中身も予算も有限よ。買いすぎだけは避けなさい。"],["セラフィナ","分かっています。でも、この通りは誘惑が多すぎるんですよね。"],["","並んだ野菜と行き交う声を眺めながら、セラフィナはゆっくり一歩を踏み出した。"],["セラフィナ","よし、今日はこの作戦でいきます。"]]},"l_r3a":{"bg":"05-shotengai-regular","next":"l8","lines":[["","野菜の箱を二つ運ぶと、店主が「おおきに」と大根を一本おまけしてくれた。"],["セラフィナ","え、いいんですか？　ほんの少し運んだだけなのに……"],["ルチア","情けは人のためならず、よ。ありがたく受け取っておきなさい。"],["","重い袋を提げて帰る道、腕は痛いのに、足取りは不思議と軽かった。"],["セラフィナ","大根一本でこんなに嬉しいなんて。暮らしって、面白いですね。"]]},"l_r3b":{"bg":"05-shotengai-regular","next":"l8","lines":[["","特売の葉物と根菜を見比べ、頭の中で三日分の献立を組み立てた。"],["セラフィナ","今日は鍋、明日は炒め物、あさっては汁物に回せます。完璧です。"],["ルチア","買い物リストより現場の判断が速くなったじゃない。成長しているわよ。"],["","合計は予算の内側に収まり、財布には少し余裕が残った。"],["セラフィナ","浮いた分は貯金箱へ。こういう小さな勝ちが、続ける力になるんです。"]]},"l_r3c":{"bg":"05-shotengai-regular","next":"l8","lines":[["","隣に並んだ客と、余った野菜の使い道について話が弾んだ。"],["セラフィナ","皮ごと漬けるんですか？　知りませんでした。今度、やってみますね。"],["ルチア","知らない同士が、野菜一つでここまで話せるのは面白いわね。"],["","連絡先は交換しなくても、次に会えば挨拶できる関係が生まれていた。"],["セラフィナ","商店街のつながりって、こうやって少しずつ編まれていくんですね。"]]},"l8":{"bg":"12-typhoon-stockpile","next":"l9","lines":[["","台風接近の知らせで、商店街もスーパーも朝から慌ただしかった。"],["セラフィナ","水と乾物と、猫のごはん。あと、懐中電灯の電池も確認しないと。"],["ルチア","買いだめは過ぎると無駄になるわよ。必要な分だけ、冷静にね。"],["セラフィナ","分かっています。でも、列を見たらつい焦るのが人間、ですよね。……私も、ですね。"],["","周りの客も同じ顔で、目が合うと少し笑い合って、落ち着きを取り戻した。"],["セラフィナ","窓の補強は昼のうちに済ませます。夜になっ t":"k_r1b"},{"text":"お茶のおかわりを、勇気を出してお願いする","shoku":3,"iyashi":5,"next":"k_r1c"}],"lines":[["","お茶を半分飲んだところで、セラフィナは言いたいことを探して、湯呑みを見つめた。"],["","日頃のお礼も、日本橋での日々も、伝えたいことは山ほどある。"],["天照大御神","遠慮はいらないわよ。思ったままを、どうぞ。"],["セラフィナ","えっと、あの……では、まず――"]]},"k_r1a":{"bg":"04-amaterasu-tea","next":"k5","lines":[["セラフィナ","わたしも、いつか誰かを温められる天使になりたいです。まだ、見習いですけれど。"],["天照大御神","見習いでいることは、恥ずかしいことじゃないのよ。温めたいと願う心は、もう半分、光なのですから。"],["","セラフィナの輪が、朝日の中でほんのり金色を帯びたように見えた。"],["天照大御神","焦らなくて大丈夫。光はね、届くまでに少し時間がかかるものよ。"],["","セラフィナは椅子から立ち上がって深く頭を下げた。背中を、温い風がそっと押した。"]]},"k_r1b":{"bg":"04-amaterasu-tea","next":"k5","lines":[["セラフィナ","日本橋ではですね、クレーンゲームで大変なことがありまして……！"],["","身振り手振りの報告が止まらない。フィギュアを抱えた話で、天照大御神は声を上げて笑った。"],["天照大御神","まあまあ。五百年ぶりの下界は、ずいぶん賑やかだったのね。"],["ルチア","笑いすぎよ、あんた。調子に乗ると全部喋るわよ、この天使。"],["天照大御神","楽しい話は、その土地の元気そのもの。聞かせてくれて、ありがとうね。"]]},"k_r1c":{"bg":"04-amaterasu-tea","next":"k5","lines":[["セラフィナ","あの……！　お、おかわりをいただくことは、可能でございますでしょうか……？"],["天照大御神","もちろんよ。遠慮のいらない場所のことを、ご近所というの。"],["","二杯目のお茶は、一杯目より少しだけ、甘く感じられた。"],["ルチア","勇気を出す先がお茶のおかわり……。まあ、あんたらしいけど。"],["天照大御神","頼ることもね、温め合うことのひとつなのよ。"]]},"k5":{"bg":"07-meeting-kannon","next":"k6","lines":[["","数日後。四天王寺の界隈で、境内の片隅に、白衣のお方が腰を下ろしていた。"],["","観音菩薩だった。疲れた様子の参拝客の隣に座り、静かに、ただ話を聞いている。"],["セラフィナ","あの方が観音さま……。聞くことの大先輩だって、ガブリエラ先輩が言ってました。"],["","客は何度か頷き、最後に小さく笑って、深々と頭を下げて帰っていった。"],["観音菩薩","あら。見ていましたか。……座りなさいな、セラフィナ。"],["セラフィナ","えっ、わたしの名前を、ご存じで……！？"],["観音菩薩","噂は聞いていますよ。おつかれさま、を配って歩く見習いさんでしょう。"],["","セラフィナは恐縮しながら、観音菩薩の隣にちょこんと腰を下ろした。"],["","近くでは鳩が日向ぼっこをし、遠くで鐘の音が静かに響いていた。"]]},"k6":{"bg":"08-kannon-and-seraphina","next":"k7","lines":[["観音菩薩","さっきの方ね。答えが欲しかったのではありません。ただ、聞いてほしかったのです。"],["セラフィナ","聞くだけで、いいのですか？　わたし、つい励ましたくなってしまいます。"],["観音菩薩","聞くだけで、いいのです。励ましたくなる、その気持ちも分かりますよ。でも、言葉を急がないことも思いやりの形です。"],["","風が境内の木々を揺らした。観音菩薩は、セラフィナの話にも同じ静けさで耳を傾けた。"],["セラフィナ","わたし、ちゃんとできているのか不安で……。輪も、気づくとくすんでいて……。"],["観音菩薩","不安、なのですね。不安を話せる相手がいること。それ自体が、もう支えなのですよ。"],["セラフィナ","……胸のところで引っかかっていたものが、すっと下りました。"],["観音菩薩","ふふ。聞くことは、相手の荷物を、一緒に持つことですから。"],["セラフィナ","一緒に持つ……。わたしの『おつかれさま』も、その一部になれたらいいな。"]]},"k7":{"bg":"08-kannon-and-seraphina","choices":[{"text":"相づちだけで、最後まで静かに聞く練習をする","shoku":1,"iyashi":8,"next":"k_r2a"},{"text":"「今日もおつかれさまです」と一言だけ添える","shoku":3,"iyashi":6,"next":"k_r2b"}],"lines":[["","そこへ、仕事帰りらしい女性が、重そうな荷物を持って足を止めた。観音菩薩が、そっと目配せする。"],["観音菩薩","さあ、あなたの番ですよ。見てきたことを、やってごらんなさい。"],["セラフィナ","は、はい！　……ええと、まずは座っていただいて、それから……。"],["","女性は境内のベンチに腰を下ろし、ほっと長い息をついた。"]]},"k_r2a":{"bg":"08-kannon-and-seraphina","next":"k8","lines":[["","セラフィナは口を開きかけて、ぐっと堪えた。うん、うん、と小さく頷くだけにした。"],["","女性は堰を切ったように話し、話し終えると、自分で『明日からまた頑張れそう』と笑った。"],["観音菩薩","よく堪えましたね。答えは、その方の中にありましたよ。"],["セラフィナ","聞くって……すごい技術なんですね。何もしない、のとは全然違う。"],["観音菩薩","技術というより、忍耐と信頼です。あなたには、向いていますよ。"]]},"k_r2b":{"bg":"08-kannon-and-seraphina","next":"k8","lines":[["","女性の話が一段落したところで、セラフィナは祈るように、そっと言った。"],["セラフィナ","今日もおつかれさまです。"],["","女性は目を丸くして、それから泣き笑いのような顔で『ありがとう』と言った。"],["観音菩薩","短い言葉でしたね。でも、今のその方には、それが一番届いたようです。"],["セラフィナ","言葉は、長さじゃないんですね……。"]]},"k8":{"bg":"media-generation-09-inari-shrine-visit-0-7e512796-f25c-4f0e-a7e9-71e9c4941395","next":"k9","lines":[["","お稲荷さんの社では、狐たちが夕方の境内の掃除をしていた。"],["","木陰では、モコとノワールが、狐の子と丸くなって昼寝をしている。"],["セラフィナ","わぁ……種族を超えたお昼寝です……！"],["ルチア","モコたち、いつの間にここまで顔パスになったのよ。"],["","年配の狐が、油揚げの載った小皿を、セラフィナの前にそっと置いた。"],["セラフィナ","え、わたしにもですか！？　ありがとうございます、いただきます！"],["","狐たちは言葉少なだったが、しっぽの揺れ方が、歓迎の気持ちをよく語っていた。"],["ルチア","……あんたたち、ほんと顔が広いわね。猫も、その飼い主も。"],["","千本鳥居の朱が夕日に透けて、境内全体が温かい色に染まっていた。"]]},"k9":{"bg":"media-generation-09-inari-shrine-visit-0-7e512796-f25c-4f0e-a7e9-71e9c4941395","choices":[{"text":"狐の子とモコたちと一緒に、境内で鬼ごっこをする","shoku":6,"iyashi":4,"next":"k_r3a"},{"text":"狐たちと一緒に、落ち葉の掃除を手伝う","shoku":2,"iyashi":7,"next":"k_r3b"}],"lines":[["","夕方の境内。セラフィナの前には、遊びの誘いと、箒と、両方があった。"],["","狐の子がしっぽを振ってこちらを見ている。モコは箒の先で遊び、ノワールは木陰で欠伸をした。"],["セラフィナ","うーん、どっちも大事なご近所づきあいですよね……！"],["ルチア","悩むところがあんたらしいわ。早く決めなさい、陽が落ちるわよ。"]]},"k_r3a":{"bg":"media-generation-09-inari-shrine-visit-0-7e512796-f25c-4f0e-a7e9-71e9c4941395","next":"k10","lines":[["","鬼ごっこは大騒ぎになった。狐は速く、猫は気まぐれで、セラフィナは羽を使いそうになって何度も踏みとどまった。"],["セラフィナ","ま、待って〜！　天使、走る訓練はしてないんです〜！"],["ルチア","ははっ、いい運動になってるじゃない。たまには悪くないわよ。"],["","遊び疲れた一同は、縁側で夕日を見ながら、小皿のお茶を回し飲みした。"],["セラフィナ","言葉がなくても、遊べばご近所ですね。"]]},"k_r3b":{"bg":"media-generation-09-inari-shrine-visit-0-7e512796-f25c-4f0e-a7e9-71e9c4941395","next":"k10","lines":[["","セラフィナは箒を受け取り、狐たちと並んで落ち葉を掃いた。"],["","掃除の合間、狐がぽつりと『参る人が気持ちよく歩けるように』とつぶやいた。"],["セラフィナ","見えないところのお仕事……。おつかれさまです、ほんとに。"],["","掃き終わった参道は、夕日を受けてまっすぐに光っていた。"],["ルチア","あんた、掃除の姿まで絵になるのは反則よ。"]]},"k10":{"bg":"media-generation-11-ebisu-daikoku-market-0-362d72b9-eac4-4cb5-bd06-886eb485b372","next":"k11","lines":[["","週末の市場は大にぎわいだった。恵比寿さまと大黒天さまが見守る市場は、笑い声と威勢のいい掛け声で満ちている。"],["ルチア","見なさい、この人出！　商いの神さまの膝元よ。……ねえ、ここで癒しグッズの露店を出したら――"],["セラフィナ","ルチア、目が銭の形になってます。"],["ルチア","商売は真剣なの！　立地よ、立地！　あの角の空きスペース、坪単価を聞いてきなさい！"],["","市場の人々は忙しいのに、みんな笑顔だった。働く背中が、どれも少し誇らしげだ。"],["セラフィナ","商いの場所って、元気の交換所みたいですね。"],["ルチア","ふん、詩的なこと言うじゃない。……で、坪単価は？"],["セラフィナ","聞いてません！　今日はお買い物に来たんですから！"],["","二人は旬の果物を買って、店主から大きな『まいど！』をもらった。"]]},"k11":{"bg":"media-generation-13-benzaiten-music-0-a6c71e46-276a-42e6-ab4e-a57dd225a186","next":"k12","lines":[["","市場の広場の隅では、弁財天さまの周りに小さな人だかりができていた。"],["","琵琶の音色に合わせ、通りすがりの人々が思い思いに手拍子をし、歌い、楽器を鳴らしている。"],["セラフィナ","すごい……。上手い、下手じゃなくて、みんな楽しそうです。"],["ガブリエラ","弁財天さまの演奏会は、飛び入り自由が古くからの習わしです。"],["セラフィナ","ガブリエラ先輩！　いつの間にいらしてたんですか！"],["ガブリエラ","ご近所づきあいは、先輩の務めでもあります。さあ、あなたも何か一曲。"],["","弁財天さまが静かに微笑んで頷いた。セラフィナは深呼吸をして、列に加わった。"]]},"k12":{"bg":"media-generation-13-benzaiten-music-0-a6c71e46-276a-42e6-ab4e-a57dd225a186","choices":[{"text":"小さな声で、天界の子守歌を歌う","shoku":2,"iyashi":7,"next":"k_r4a"},{"text":"ルチアと一緒に、手拍子と掛け声で盛り上げる","shoku":6,"iyashi":5,"next":"k_r4b"},{"text":"観音さまに教わった『聞く』に徹して、演奏に耳を澄ます","shoku":1,"iyashi":8,"next":"k_r4c"}],"lines":[["","順番が回ってきた。セラフィナの胸は、太鼓みたいに鳴っていた。"],["ガブリエラ","深呼吸を。聞いてくれる人々は、みな味方です。"],["ルチア","あんたなら大丈夫よ。……ほら、背中、押してあげるから。"],["セラフィナ","ありがとう、二人とも。じゃあ、わたしは――"]]},"k_r4a":{"bg":"media-generation-13-benzaiten-music-0-a6c71e46-276a-42e6-ab4e-a57dd225a186","next":"k13","lines":[["","震える声で歌い始めた子守歌に、琵琶がそっと寄り添った。"],["","広場のざわめきが、少しずつ静かになっていく。泣いていた子が、母親の腕の中で眠った。"],["ガブリエラ","……見事です。音は、心の置き場所を変えるのですね。"],["セラフィナ","わたしの歌で、誰かが眠れるなんて……。"],["","弁財天さまは何も言わず、ただ一度、深く頷いてくださった。"]]},"k_r4b":{"bg":"media-generation-13-benzaiten-music-0-a6c71e46-276a-42e6-ab4e-a57dd225a186","next":"k13","lines":[["ルチア","あたしに任せなさい！　盛り上げは悪魔の本領よ！"],["","ルチアの掛け声に市場全体が呼応し、手拍子は波のように広がった。"],["セラフィナ","ルチア、楽しそうです……！　わたしも負けてられません！"],["","演奏が終わる頃、広場は拍手と笑い声で、祭りのような熱気に包まれていた。"],["ガブリエラ","天使と悪魔の合いの手とは。……記録に残すべき前例です。"]]},"k_r4c":{"bg":"media-generation-13-benzaiten-music-0-a6c71e46-276a-42e6-ab4e-a57dd225a186","next":"k13","lines":[["","セラフィナは目を閉じ、演奏のひとつひとつの音に耳を澄ました。"],["","上手な音も、たどたどしい音も、全部が誰かの今日の記録に聞こえた。"],["セラフィナ","聞くって、演奏に参加することでもあるんですね。"],["ガブリエラ","よく気づきましたね。聞き手がいて、初めて音楽は完成するのです。"],["","弁財天さまの琵琶が、最後にひとつ、セラフィナの方へ向けて優しく鳴った。"]]},"k13":{"bg":"media-generation-17-ema-wishes-0-c75692b5-a001-43a1-a169-a553e70f1339","next":"k14","lines":[["","祭りの前の週。社の絵馬掛けには、たくさんの願いが風に揺れていた。"],["セラフィナ","みんなの願い……。読んじゃいけない気もしますけど、少しだけ、見てもいいのかな。"],["ガブリエラ","願いは、声に出せなかった思いの置き場所です。敬意を持って、そっとね。"],["","『母の足がよくなりますように』『店が続きますように』『あの人に、ありがとうが言えますように』"],["セラフィナ","……みんな、誰かのために願ってます。自分のためだけの願い、少ないですね。"],["ルチア","あんたも一枚書きなさいよ。見習い卒業、とかさ。"],["セラフィナ","ううん。わたしは――『ご近所のみんなが、今日もおつかれさまって言い合えますように』って書きます。"],["ガブリエラ","良い願いですね。自分のためでない願いは、軽やかに届くものです。"],["","セラフィナの絵馬は、風の中でひときわ軽やかに揺れた。"]]},"k14":{"bg":"media-generation-19-festival-night-0-f58d3bb3-6560-4839-9008-6c3c8917476c","next":"k15","lines":[["","祭りの夜。本殿の賑わいの一方で、裏方ではたくさんの人が働いていた。"],["","屋台の準備、警備、清掃、迷子の対応。祭りの笑顔は、見えない働きに支えられている。"],["天照大御神","セラフィナ。今夜はお願いがあるの。表の光ではなく、裏の働きに、光を当ててちょうだい。"],["セラフィナ","はい！　みんなで手分けしましょう！"],["ガブリエラ","配置は私が担います。天使と悪魔と神仏で組む救護班など、前代未聞ですが。"],["ルチア","悪魔が救護班……。まあ、今夜だけ、特別よ。"],["","一行は夜の境内へ散っていった。休憩所の水を運び、肩を揉み、話を聞くために。"],["","表舞台の笛や太鼓の音が、裏方のテントにも楽しそうに届いていた。"],["セラフィナ","表も裏も、どっちも祭りなんですね。"]]},"k15":{"bg":"media-generation-26-healing-together-kannon-0-3fdee95a-7810-46fd-8688-e2b79935e7dd","next":"k_last","lines":[["","休憩所では、観音菩薩が屋台の主人の話を聞き、セラフィナが肩にそっと手を置いた。"],["観音菩薩","無理にほぐそうとしないこと。その方の呼吸に、合わせなさい。"],["セラフィナ","はい……。あ、呼吸がゆっくりになってきました。"],["","主人は目を閉じ 封蝋。見慣れたはずの印が、今日だけ少し重く見えた。"],["セラフィナ","帰還命令、ですか……。任務終了につき、七日後に天界へ帰還せよ。……七日。あと七日しか、ないのですね"],["","文面は穏やかだった。よく務めた、という労いの言葉まで添えられている。それでも最後の一行だけが、胸の奥に残って離れなかった。"],["セラフィナ","終わり、なんですね。……分かってはいました。任務には必ず終わりがあることくらい、天使なら誰でも知っています"],["","窓の外では商店街のシャッターが次々と上がり、いつもの大阪の朝が始まっていた。笑い声、荷車の軋み、焼きたての匂い。昨日と同じはずなのに、今日は少し違って聞こえた。"],["モコ","にゃあ……？"],["セラフィナ","ごめんね、モコ。少しだけ、わたしの隣に座っていて。……ねえ、あと七日を、わたしはどう過ごしたらいいのかな"]]},"g1":{"bg":"26-return-talk-city-view","next":"g2","lines":[["","昼過ぎには、知らせは二人のもとへも届いていた。先に口を開いたのはガブリエラで、その声はいつになく静かだった。"],["ガブリエラ","正式な命令ね。延期の申請は、原則として認められないわ。……セラフィナ、顔色が悪いわよ"],["セラフィナ","大丈夫です。任務をまっとうできるのは、天使として誇らしいことですから。……ほら、ここは笑うところ、ですよね"],["ルチア","笑えてないじゃない。あんた、嘘をつくと羽根が内側に丸まるの、自分で気づいてる？"],["","ルチアは言い切るなり顔を背けた。悪魔らしい嫌味の続きは、今日に限って出てこなかった。"],["ガブリエラ","残りの七日は、自由に使いなさい。報告書の提出は、最終日の夜で構わないわ"],["セラフィナ","ありがとうございます。……なら、決まりました。わたしには、やりたいことが山ほどあるんです"]]},"g2":{"bg":"01-key-visual","next":"g3","lines":[["","帰還まで七日。その言葉を前に、セラフィナは小さな手帳を開いた。大阪で出会った人たちの名前が、ページの端までびっしり並んでいた。"],["セラフィナ","ご挨拶をしなくちゃ。お礼だって、まだ全然言い足りていません"],["ルチア","全員分を回るつもり？　七日しかないのよ。……手伝う、なんて言ってないからね"],["ガブリエラ","まず、自分の気持ちを決めなさい。命令にどう向き合うかで、その七日の色は変わるわ"],["セラフィナ","わたしの気持ち、ですか……。そうですね。考えるのは、そこからでした"]],"choices":[{"text":"命令を受け止めて、残りの七日を挨拶まわりに使う","shoku":2,"iyashi":3,"next":"g_r1a"},{"text":"正直に打ち明ける。もう少し、ここにいたいと","shoku":6,"iyashi":2,"next":"g_r1b"},{"text":"天界へ尋ねてみる。お別れの猶予をもらえないかと","shoku":3,"iyashi":1,"next":"g_r1c"}]},"g_r1a":{"bg":"01-key-visual","next":"g3","lines":[["セラフィナ","命令は、受け止めます。だからこそ逃げないで、最後までこの街でできることをします"],["","言い切って頷くと、胸のつかえがすっとほどけた。立つ場所を決めたら、やるべきことがはっきり見えてきた。"],["ガブリエラ","……いい目になったわね。それも、あなたの強さだわ"],["ルチア","……じゃあ、挨拶のリストを作りなさい。一人でも漏らしたら、あたしが文句を言うから"],["セラフィナ","はい。誰ひとり、置いていきたくないんです"]]},"g_r1b":{"bg":"01-key-visual","next":"g3","lines":[["セラフィナ","本当は……もう少しだけ、ここにいたいです。この街の朝も、夜の明かりも、まだ見ていたくて"],["","口にしてから、はっと口元を押さえた。けれどガブリエラは咎めず、ルチアも茶化さなかった。"],["ガブリエラ","正直でいいのよ。任務と気持ちは、別々に抱えていいの"],["ルチア","……ふん、やっと言えたじゃない。本音ってやつを。遅すぎるくらいよ"],["セラフィナ","ありがとうございます。気持ちは隠さないで、残りの日々を歩いていきます"]]},"g_r1c":{"bg":"01-key-visual","next":"g3","lines":[ ことが、答え合わせのようだった。"],["セラフィナ","二人と出会えたことも、この街からの贈り物です。……さあ、夜明けが来ますね"]]},"g_last":{"bg":"media-generation-29-window-lights-night-0-37a01af4-7bfe-4aa5-b02b-962a52478ada","next":"FINAL","lines":[["","夜が明けようとしていた。東の空が白み、街の明かりが一つずつ役目を終えていく。セラフィナは、静かに微笑んだ。"],["セラフィナ","行ってきます、なのか。行ってらっしゃい、なのか。まだ分かりません。でも一つだけ、確かなことがあります"],["セラフィナ","疲れた人のそばにいること。それは場所に縛られない、わたしの生き方です"],["","羽根に触れた朝の光は、もう眩しいだけではなかった。その色がどう見えるかも、もう怖くなかった。"],["セラフィナ","大阪の皆さま、そして天界の皆さま。――今日も、本当におつかれさまでした"],["","新しい一日が始まる音がした。物語の結末は、この朝の光の先で静かに待っていた。"]]},"end_special":{"bg":"30-anniversary-key-visual","next":"fin","lines":[["","朝の光の柱は降りてきた。けれど現れた使者が携えていたのは、帰還命令ではなく新しい任命状だった。最終報告が、天界と神仏の双方を動かしたのだ。"],["ガブリエラ","特例よ。大阪駐在の継続と、天界との橋渡し役。あなたの報告に、反対する者はいなかったの"],["ルチア","神様たちまで推薦文を出したんですって。……あんた、本当に愛され体質ね"],["","商店街の人々、日本橋の店員たち、常連さんたち、そして天照大御神と観音菩薩の温かな言葉。気づけば高台は、人と神仏と仲間たちでいっぱいだった。"],["天照大御神","いてくれると、街が明るくなるの。それが答えだよ"],["観音菩薩","必要な場所に、必要な人が残る。それもまたご縁です"],["セラフィナ","皆さん……！　わたし、まだここにいさせてもらえるんですね。嬉しくて、胸がいっぱいです"],["セラフィナ","決めました。わたしは、ここに残ります。疲れた肩にそっと寄り添える天使でいられるよう、明日からもこの街で祈り、働きます。どうか皆さま、今夜はよくお休みください"]]},"end_stay":{"bg":"01-key-visual","next":"fin","lines":[["","使者が持ち帰った最終報告への返答は、予想外のものだった。大阪駐在の正式承認。セラフィナは任務の客ではなく、この街の生活者になることを許された。"],["ガブリエラ","駐在天使として、認められたわ。住まいも仕事も、自分の足で続けるのよ"],["ルチア","羽根がだいぶ染まった天使を、天界も面白がったんじゃない？　……あたしは、まあ、悪くないと思うけど"],["","商店街へ報告に行くと、その場で小さな宴が始まった。帰るはずだった人の残留は、街にとって何より嬉しい知らせだった。"],["商店街の婦人","ほんなら、これからもよろしゅうな。あんたはもう、ここの人やで"],["セラフィナ","はい。家賃も、買い物も、町内のお付き合いも。生活者として、ちゃんと頑張ります"],["","夕方、モコと並んで夕飯の買い物をした帰り道、商店街の明かりがいつもより少しだけ温かく見えた。特別な日なのに、いつもと変わらない一日。それが一番嬉しかった。"],["セラフィナ","ただいま、大阪。明日からも、いつもの場所で、いつものように。疲れたら、遠慮なく声をかけてくださいね。――おつかれさまです、また明日"]]},"end_travel":{"bg":"26-return-talk-city-view","next":"fin","lines":[["","天界からの返答は、新しい役目を知らせるものだった。地上と天界を行き来する連絡役。月に何度か空を渡り、両方の話を届ける仕事である。"],["ガブリエラ","前例のない役目よ。地上をよく知るあなただからこそ、任されたのよ"],["ルチア","行き来するってことは、また戻ってくるわけね。……荷物の預かり、延長しといてあげる"],["","出発の朝、見送りは最小限だった。またすぐ会えると分かっている別れには、涙より笑顔が似合った。"],["セラフィナ","行ってきます。向こうの話もこちらの話も、ちゃんと届けますね"],["モコ","にゃあーん！"],["","空へ昇る途中、振り返ると大阪の街が光っていた。離れるのではなく繋ぐための距離なのだと、今は思えた。"],["セラフィナ","どちらの空の下でも、疲れた人を見かけたら、まず隣に座ります。それがわたしの届け方です。――いってきます、すぐ戻りますね"]]},"end_return":{"bg":"media-generation-28-sumiyoshi-dusk-farewell-0-9ec7dd29-1cd8-47c4-90d2-a3e53721b3e2","next":"fin","lines":[["","朝の光の中、セラフィナは約束通り、天界へ帰ることになった。任務は立派に果たされた。けれど見送りの顔ぶれは、任命のときよりずっと多かった。"],["ルチア","……泣くなよ。あんたが泣くとこっちまで変な気分になる。ほら、ハンカチ。貸しだからね"],["ガブリエラ","あなたの席は天界でも用意されているわ。でも、帰る場所は一つとは限らないのよ"],["","商店街の婦人の手紙、日本橋の店員たちからの寄せ書き、常連さんたちの小さな贈り物。荷物は来たときより、ずっと重くなっていた。"],["セラフィナ","皆さん、聞いてください。約束します。いつか必ずまた来ます。そのときは、もっと立派な天使になって"],["天照大御神","待っているよ。こちらの茶席は、いつでも開けておくから"],["観音菩薩","離れていても、あなたが届けた温かさは、人々のうちに残ります。また会う日まで、どうかお元気で"],["セラフィナ","行ってまいります。天の窓からも、この街の眠りを見守り続けます。どうか皆さま、ご自身を大切に。――また会う日まで、おつかれさまでした"]]},"sys_intro":{"bg":"02-florence","next":"c0","lines":[["","出発の朝、ガブリエラから小さな革袋を手渡されました。中身は地上での暮らしに用いる『支度金』、三千円。決して多くはございませんが、最初の備えとしては十分な額でございました。"],["ガブリエラ","お金の遣い方も任務のうちです。よく考えなさい。ただし、必要な折には思い切って遣うこと。"],["セラフィナ","三千円……。地上のお金を、自分で持つのは初めてでございます。落とさぬよう、しっかり握ってまいります！"]]},"INT1":{"bg":"28-report-sleep","next":"n0","target":"n0","interlude":1,"lines":[["","――幕間。報告書のインクが乾くまでの、ほんの少しの自由時間です――"]]},"INT2":{"bg":"27-nipponbashi-neon-night","next":"teaser2","target":"teaser2","interlude":2,"lines":[["","――幕間。日本橋のネオンが灯り始める頃、寄り道の時間が始まります――"]]},"INT3":{"bg":"25-warm-tea","next":"s0","target":"s0","interlude":3,"lines":[["","――幕間。温かいお茶が入りました。猫たちと過ごす、穏やかな午後のひとときです――"]]},"INT4":{"bg":"27-hatsumode","next":"w0","target":"w0","interlude":4,"lines":[["","――幕間。初詣の賑わいが少し遠のいて、新しい季節へ歩き出す頃です――"]]},"INT5":{"bg":"27-thank-you-letter","next":"l0","target":"l0","interlude":5,"lines":[["","――幕間。感謝の手紙を読み返したあとの、胸が温かいままの休憩時間です――"]]},"INT6":{"bg":"29-group-photo","next":"v0","target":"v0","interlude":6,"lines":[["","――幕間。みんなで撮った写真の余韻を抱えて、それぞれの場所へ向かいます――"]]},"INT7":{"bg":"26-extension-application","next":"k0","target":"k0","interlude":7,"lines":[["","――幕間。残りの日々を数えるのではなく、今日を丁寧に過ごすための時間です――"]]}};
const TITLE_IMG = "assets/01-key-visual.webp";
const SAVE_KEY = "seraphina_proto_save_";
let S = null;
let autoTimer = null;
function newState(){ return {scene:"p0", line:0, shoku:0, iyashi:0, money:3000, items:{}, free:null, flags:{}, log:[]};}
function stageComment(v){
const r = SHOKU_MAX? v/SHOKU_MAX : 0;
if(r>=0.82) return "すっかり大阪の人……でも笑顔は天使のまま";
if(r>=0.62) return "輪と翼は薄く、言葉には関西の響き";
if(r>=0.42) return "すっかり染まってきた……本人は無自覚";
if(r>=0.22) return "輪がほんの少し薄れた気が……本人は無自覚";
if(v>=1) return "まだぴかぴか。でも何か始まっている";
return "輪はぴかぴか、翼もふんわり";
}
function updateHUD(){
audioMoneyWatch();
document.getElementById("shokunum").textContent = S.shoku;
document.getElementById("iyashinum").textContent = S.iyashi;
document.getElementById("moneynum").textContent = (S.money||0).toLocaleString("ja-JP");
document.getElementById("bar").style.width = Math.min(100, S.shoku/SHOKU_MAX*100) + "%";
document.getElementById("stagec").textContent = stageComment(S.shoku);
}
function endingFor(v){ return v>=26? "e_high": (v>=15? "e_mid": "e_low");}
function endingFor2(v){ return v>=52? "f_high": (v>=34? "f_mid": "f_low");}
const SHOKU_MAX = 170;
const BR = {"BRANCH3": {"kind": "shoku", "hi": 75, "lo": 59, "high": "t_end_high", "mid": "t_end_mid", "low": "t_end_low"}, "BRANCH4": {"kind": "shoku", "hi": 78, "lo": 59, "high": "s_end_high", "mid": "s_end_mid", "low": "s_end_low"}, "BRANCH5": {"kind": "shoku", "hi": 81, "lo": 60, "high": "w_end_high", "mid": "w_end_mid", "low": "w_end_low"}, "BRANCH6": {"kind": "shoku", "hi": 87, "lo": 63, "high": "l_end_high", "mid": "l_end_mid", "low": "l_end_low"}, "BRANCH7": {"kind": "gab", "hi": 3, "lo": 1, "high": "v_end_high", "mid": "v_end_mid", "low": "v_end_low"}, "BRANCH8": {"kind": "shoku", "hi": 109, "lo": 79, "high": "k_end_high", "mid": "k_end_mid", "low": "k_end_low"}, "FINAL": {"kind": "final", "spI": 174, "hiS": 107, "stayI": 130, "loS": 88, "special": "end_special", "stay": "end_stay", "travel": "end_travel", "ret": "end_return"}};
function branchFor(token){ const t = BR[token]; if(!t) return null; if(t.kind==="shoku"){ return S.shoku>=t.hi? t.high : (S.shoku>=t.lo? t.mid : t.low);} if(t.kind==="gab"){ const g=(S.flags&&S.flags.gab)||0; return g>=t.hi? t.high : (g>=t.lo? t.mid : t.low);} if(t.kind==="final"){ if(S.iyashi>=t.spI) return t.special; if(S.shoku>=t.hiS && S.iyashi>=t.stayI) return t.stay; if(S.shoku>=t.loS) return t.travel; return t.ret; } return null;}
function showScene(){
const sc = SCENES[S.scene];
recordSceneProgress(S.scene);
audioSceneHook();
if(sc.interlude){ document.getElementById("bg").src = assetSrc(sc.bg); startInterlude(sc.interlude, sc.target); return; }
hideFree();
document.getElementById("bg").src = assetSrc(sc.bg);
const line = sc.lines[S.line];
document.getElementById("who").textContent = line[0] || "";
document.getElementById("text").textContent = line[1];
document.getElementById("next").style.display = "";
updateHUD();
onLineShown();
}
function pushLog(){
const sc = SCENES[S.scene]; const line = sc.lines[S.line];
S.log.push([line[0], line[1]]);
if(S.log.length>4000) S.log.shift();
}
function advance(){
if(!S || S.free || videoBusy) return;
pushLog();
const sc = SCENES[S.scene];
if(S.line < sc.lines.length-1){ S.line++; showScene(); scheduleAuto(); return;}
// scene end
if(sc.choices){ stopAuto(); showChoices(sc); return;}
let nxt = sc.next;
if(nxt === "BRANCH"){ nxt = endingFor(S.shoku);}
else if(nxt === "BRANCH2"){ nxt = endingFor2(S.shoku);}
else if(nxt && (nxt.indexOf("BRANCH")===0 || nxt==="FINAL")){ nxt = branchFor(nxt);}
if(!nxt || sc.end){ stopAuto(); toTitle(true); return;}
if(nxt === "fin" && ED_VIDEOS[S.scene]){
stopAuto();
const edName = ED_VIDEOS[S.scene];
S.scene = nxt; S.line = 0;
playGameVideo(edName, ()=>{ showScene(); scheduleAuto(); });
return;
}
S.scene = nxt; S.line = 0; showScene(); scheduleAuto();
}
function showChoices(sc){
const box = document.getElementById("choices");
box.querySelectorAll("button").forEach(b=>b.remove());
sc.choices.forEach((ch, ci)=>{
const b = document.createElement("button");
b.textContent = ch.text;
b.onclick = (e)=>{ e.stopPropagation(); seTap();

function startGame(){
audioUserStart();
const wantOp = audioSet.opPlay || !opSeen();
markOpSeen();
if(wantOp){ playGameVideo("op.mp4", beginNewGame); return; }
beginNewGame();
}
function beginNewGame(){ hideFree(); S = newState(); document.getElementById("title").style.display="none"; showScene();}
function toTitle(finished){
stopAuto(); hideFree();
audioToTitle();
const t = document.getElementById("title");
t.style.display = "flex";
if(finished) toast("おしまい。ありがとうございました");
}
function toast(msg){
const el = document.getElementById("toast"); el.textContent = msg; el.style.display="block";
setTimeout(()=>{ el.style.display="none";}, 2200);
}
function openSlots(mode){
const modal = document.getElementById("saveModal");
document.getElementById("saveTitle").textContent = mode==="save"? "セーブ": "ロード";
const wrap = document.getElementById("slots"); wrap.innerHTML = "";
for(let i=1;i<=6;i++){
const raw = localStorage.getItem(SAVE_KEY+i);
const b = document.createElement("button"); b.className="slot";
if(raw){
const d = JSON.parse(raw);
b.innerHTML = "スロット"+i+"<br><small>"+d.date+"／場面："+d.scene+"／蝕まれ度 "+d.shoku+"・癒し "+d.iyashi+"・所持金 "+(Number.isFinite(d.money)?d.money:3000)+"円</small>";
} else {
b.innerHTML = "スロット"+i+"<br><small>（空き）</small>";
}
b.onclick = ()=>{
if(mode==="save"){
if(!S){ toast("まだ始まっていません"); return;}
const d = {version:2, scene:S.scene, line:S.line, shoku:S.shoku, iyashi:S.iyashi, money:S.money||0, items:S.items||{}, free:S.free||null, flags:S.flags||{}, log:S.log, date:new Date().toLocaleString("ja-JP")};
localStorage.setItem(SAVE_KEY+i, JSON.stringify(d));
toast("スロット"+i+"にセーブしました"); openSlots("save");
} else {
const raw2 = localStorage.getItem(SAVE_KEY+i);
if(!raw2){ toast("データがありません"); return;}
const d = JSON.parse(raw2);
S = normalizeState(d); mergeCollectionFromRun();
document.getElementById("title").style.display="none";
modal.style.display="none"; showScene(); toast("ロードしました");
}
};
wrap.appendChild(b);
}
modal.style.display="block";
}
function openLog(){
const list = document.getElementById("loglist");
if(!S || S.log.length===0){ list.textContent = "まだ記録がありません。";}
else{
list.innerHTML = S.log.map(l=> l[0]? '<div><span class="lw">'+l[0]+"</span>　"+l[1]+"</div>": "<div>"+l[1]+"</div>").join("");
}
document.getElementById("logModal").style.display="block";
}
function stopAuto(){
if(autoTimer){ clearTimeout(autoTimer); autoTimer=null;}
document.getElementById("mAuto").classList.remove("on");
}
function scheduleAuto(){
if(!document.getElementById("mAuto").classList.contains("on")) return;
stopAutoKeep();
autoTimer = setTimeout(advance, 2400);
}
function stopAutoKeep(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null;}}
