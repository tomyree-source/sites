<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>異種格闘年代記（仮） ― 見本</title>
<style>
  :root{
    --bg:#0a0f1e; --panel:#111a30; --panel2:#16223e; --line:#2a3a5f;
    --gold:#c9a227; --gold2:#e8c95a; --red:#a02525; --red2:#d64545;
    --text:#e9e6da; --dim:#9aa5bd; --sei:#7ec8e3; --aku:#e07a7a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0d1526 0%,#0a0f1e 100%);}
  /* HUD */
  #hud{position:sticky;top:0;z-index:20;background:rgba(13,21,38,.97);border-bottom:2px solid var(--gold);
    padding:8px 10px 7px;}
  #hud .row1{display:flex;justify-content:space-between;align-items:baseline;gap:6px;}
  #hud .age{font-size:13px;color:var(--gold2);font-weight:700;letter-spacing:.04em;}
  #hud .chapter{font-size:11px;color:var(--dim);}
  #hud .row2{display:flex;gap:10px;margin-top:5px;font-size:12px;flex-wrap:wrap;}
  #hud .fame b{color:var(--gold2);font-size:14px;}
  #hud .sei{color:var(--sei);} #hud .aku{color:var(--aku);}
  .bar{height:6px;background:#1d2a47;border-radius:3px;overflow:hidden;margin-top:3px;}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s;}
  .bar.hp>i{background:linear-gradient(90deg,#3f9e4d,#7ed37e);}
  .bar.ehp>i{background:linear-gradient(90deg,var(--red),var(--red2));}
  #hud .style{font-size:12px;color:var(--text);}
  #hud .style b{color:var(--gold2);}
  /* main */
  #main{flex:1;padding:14px 14px 30px;}
  .scene-tag{font-size:11px;color:var(--dim);letter-spacing:.15em;margin-bottom:8px;}
  .line{margin:0 0 12px;line-height:1.85;font-size:15px;}
  .line .sp{display:block;font-size:12px;color:var(--gold2);font-weight:700;margin-bottom:2px;letter-spacing:.06em;}
  .line.narr{color:#d8d4c4;}
  .line.sys{color:var(--dim);font-size:13px;border-left:3px solid var(--line);padding-left:10px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 12px;}
  .card h3{margin:0 0 6px;font-size:16px;color:var(--gold2);}
  .card p{margin:0 0 6px;font-size:13px;line-height:1.7;color:#cfd3c9;}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:12px;color:var(--dim);margin-top:6px;}
  .stats-grid b{color:var(--text);font-size:14px;}
  button.choice{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;
    padding:12px 14px;margin:0 0 10px;font-size:15px;cursor:pointer;line-height:1.5;}
  button.choice small{display:block;color:var(--dim);font-size:12px;margin-top:3px;}
  button.choice:active{background:#1e2c4e;}
  button.choice.danger{border-left-color:var(--red2);}
  button.next{display:block;width:100%;background:linear-gradient(180deg,#8e2323,#6d1a1a);color:#fff;
    border:1px solid #c04545;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;}
  button.ghost{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
    padding:9px 12px;font-size:13px;cursor:pointer;}
  .navrow{display:flex;gap:8px;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);}
  /* toast */
  #toast{position:sticky;bottom:0;z-index:15;pointer-events:none;}
  .toast-item{background:rgba(20,30,55,.96);border-top:1px solid var(--gold);color:var(--gold2);
    font-size:13px;padding:8px 14px;animation:fadein .3s;}
  .toast-item.bad{color:var(--aku);border-top-color:var(--red2);}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  /* SNS */
  .sns{background:#0d1420;border:1px solid #233659;border-radius:12px;padding:12px;margin-bottom:12px;}
  .sns .sns-head{display:flex;justify-content:space-between;color:#5f7bb0;font-size:12px;font-weight:700;letter-spacing:.1em;margin-bottom:10px;}
  .post{border-bottom:1px solid #1b2a47;padding:9px 2px;}
  .post:last-child{border-bottom:none;}
  .post .who{font-size:13px;font-weight:700;}
  .post .who span{color:#5f7bb0;font-weight:400;font-size:12px;margin-left:6px;}
  .post .txt{font-size:14px;line-height:1.75;margin-top:3px;white-space:pre-wrap;}
  .post.mine{background:rgba(201,162,39,.07);border-radius:8px;padding:9px 8px;}
  /* battle */
  .battle-head{display:flex;gap:10px;margin-bottom:10px;}
  .fighter{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .fighter .nm{font-size:14px;font-weight:700;}
  .fighter .sub{font-size:11px;color:var(--dim);margin:2px 0 6px;}
  .fighter.enemy{border-color:#5f2b2b;}
  .legtag{display:inline-block;font-size:11px;color:#ffb3b3;background:rgba(160,37,37,.25);
    border:1px solid #7a3030;border-radius:4px;padding:1px 6px;margin-top:5px;}
  .blog{background:#0b1120;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;
    max-height:190px;overflow-y:auto;font-size:13px;line-height:1.7;}
  .blog .bl{margin-bottom:7px;}
  .blog .bl .sp{color:var(--gold2);font-size:11px;font-weight:700;margin-right:6px;}
  .blog .bl.cmt{color:#aebadd;font-size:12px;}
  .blog .bl.cmt .sp{color:#5f7bb0;}
  .turn-tag{font-size:12px;color:var(--gold2);font-weight:700;margin-bottom:8px;letter-spacing:.08em;}
  /* status */
  table.stat{width:100%;border-collapse:collapse;font-size:13px;}
  table.stat td,table.stat th{border-bottom:1px solid var(--line);padding:7px 4px;text-align:left;}
  table.stat th{color:var(--dim);font-weight:400;width:38%;}
  table.stat td{font-weight:700;}
  .title-screen{text-align:center;padding:38px 10px 10px;}
  .title-art{width:100%;height:auto;display:block;border-radius:10px;margin:6px 0 4px;box-shadow:0 6px 24px rgba(0,0,0,.45);}
  .title-screen .over{color:var(--dim);font-size:12px;letter-spacing:.3em;}
  .title-screen h1{font-size:31px;margin:14px 0 4px;color:var(--gold2);letter-spacing:.06em;line-height:1.35;}
  .title-screen .kari{font-size:12px;color:var(--aku);}
  .title-screen .sub{color:#cfd3c9;font-size:14px;line-height:2;margin:16px 0 22px;}
  .age-compare{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .age-compare .col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;line-height:1.8;}
  .age-compare .col b{display:block;color:var(--gold2);font-size:14px;margin-bottom:4px;}
  .age-compare .col.future{border-color:#5f2b2b;}
  .age-compare .col.future b{color:var(--red2);}
  .hidden{display:none;}
</style>
</head>
<body>

  <div id="hud" class="hidden">

$("hud-stamina").textContent=sta; $("hud-stamina-bar").style.width=sta+"%";
$("hud-style").innerHTML=S.style?("主・流儀 <b>"+S.style.name+"</b> Lv2 <span style='color:var(--dim)'>経験"+S.exp+"</span>"):"流儀 未選択";
}
function toast(msg,bad){const d=document.createElement("div");d.className="toast-item"+(bad?" bad":"");d.textContent=msg;
$("toast").appendChild(d);setTimeout(()=>{d.style.opacity="0";d.style.transition="opacity.5s";setTimeout(()=>d.remove(),500);},2600);}
function applyFx(fx){if(!fx)return;const notes=[];
if(fx.money){S.money+=fx.money;notes.push("所持金 "+(fx.money>0?"+":"")+fx.money.toLocaleString()+"円");}
if(fx.fatigue){S.fatigue=Math.min(100,Math.max(0,S.fatigue+fx.fatigue));notes.push(fx.fatigue>0?"疲労が溜まった":"疲労が回復した");}
if(fx.sei){S.sei+=fx.sei;notes.push("清名 +"+fx.sei);}
if(fx.aku){S.aku+=fx.aku;notes.push("悪名 +"+fx.aku);}
if(fx.att){S.att+=fx.att;notes.push("注目 +"+fx.att);}
if(fx.exp){S.exp+=fx.exp;notes.push("流儀経験 +"+fx.exp);}
if(fx.guide){S.guide+=fx.guide;notes.push("指導力 +"+fx.guide);}
if(fx.students){S.students+=fx.students;notes.push("生徒 +"+fx.students);}
return notes;}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;");}
function lineHtml(pair){const[sp,tx]=pair;
if(sp==="地")return `<p class="line narr">${esc(fill(tx))}</p>`;
return `<p class="line"><span class="sp">${esc(sp)}</span>${esc(fill(tx))}</p>`;}
function sceneLines(sc){
let lines=[];
if(sc.pick&&sc.variants){const key=S.vars[sc.pick];lines=lines.concat(sc.variants[key]||sc.variants[Object.keys(sc.variants)[0]]||[]);}
if(sc.lines)lines=lines.concat(sc.lines);
if(sc.lines_after)lines=lines.concat(sc.lines_after);
return lines;}
function gotoScene(i){sceneIdx=i;lineIdx=0;battle=null;render();}
function nextScene(){
const sc=SCENES[sceneIdx];
if(ENTRY_FX[sc.id]){applyFx(ENTRY_FX[sc.id]);toast("生徒が1人増えた（高瀬美咲・27歳・護身志望）");}
if(sceneIdx+1<SCENES.length)gotoScene(sceneIdx+1);}
function render(){
hud();
const sc=SCENES[sceneIdx];const main=$("main");
if(sc.type==="style")return renderStyle(sc,main);
if(sc.type==="choice")return renderChoice(sc,main);
if(sc.type==="sns")return renderSns(sc,main);
if(sc.type==="battle")return renderBattle(sc,main);
if(sc.type==="status")return renderSay(sc,main,statusPanel());
if(sc.type==="age")return renderSay(sc,main,agePanel());
return renderSay(sc,main,"");
}
function renderSay(sc,main,extraHtml){
const lines=sceneLines(sc);const shown=lines.slice(0,lineIdx+1).map(lineHtml).join("");
const last=lineIdx>=lines.length-1;
main.innerHTML=`<div class="scene-tag">${esc(sc.tag||"")}</div>${extraHtml}${shown}
<button class="next" id="btn-next">${last?(sc.type==="end"?"タイトルへ戻る":"次へ進む"):"次へ"}</button>`;
$("btn-next").onclick=()=>{if(!last){lineIdx++;render();window.scrollTo(0,document.body.scrollHeight);}else{
if(sc.type==="end")return showTitle(); nextScene(); window.scrollTo(0,0);}};
}
function renderStyle(sc,main){
const lines=sc.lines.map(lineHtml).join("");
const cards=STYLES.map((st,i)=>`<button class="choice" data-style="${i}"><b>${esc(st.name)}</b> ― 看板技：${esc(st.sig)}
<small>${esc(st.desc)}</small>
<span class="stats-grid">${Object.entries(st.stats).map(([k,v])=>`<span>${k} <b>${v}</b></span>`).join("")}</span></button>`).join("");
main.innerHTML=`<div class="scene-tag">${esc(sc.tag)}</div>${lines}
<p class="line sys">選んだ流派が主・流儀になる（Lv2・初段相当で開始）。パラメータと看板技は流派ごとに異なる。</p><p class="line sys">※製品版では開始候補はロスター全153流派。見本では代表6流派から選ぶ。</p>${cards}`;
main.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{
S.style=STYLES[Number(b.dataset.style)];hud();
toast("主・流儀："+S.style.name+"（Lv2・初段相当）");nextScene();window.scrollTo(0,0);});
}
function renderChoice(sc,main){
main.innerHTML=`<div class="scene-tag">${esc(sc.tag)}</div>
<p class="line narr">${esc(fill(sc.prompt))}</p>
${sc.options.map((o,i)=>`<button class="choice${o.danger?" danger":""}" data-i="${i}">${esc(fill(o.label))}${o.desc?`<small>${esc(fill(o.desc))}</small>`:""}</button>`).join("")}`;
main.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
const o=sc.options[Number(b.dataset.i)];
if(o.set)Object.assign(S.vars,o.set);

function renderSns(sc,main){
const d=sc.sns;
const posts=d.posts.map(p=>`<div class="post"><div class="who">${esc(p.name)}<span>${esc(p.handle)}</span></div><div class="txt">${esc(fill(p.text))}</div></div>`).join("");
main.innerHTML=`<div class="scene-tag">${esc(sc.tag)}</div>
<div class="sns"><div class="sns-head"><span>${esc(d.head)}</span><span>通知 99+</span></div>${posts}</div>
<p class="line narr">${esc(fill(d.prompt))}</p>
${d.replies.map((r,i)=>`<button class="choice" data-i="${i}"><b style="color:var(--gold2)"></b> ${esc(fill(r.label))}</button>`).join("")}`;
main.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
const r=d.replies[Number(b.dataset.i)];
if(r.set)Object.assign(S.vars,r.set);
applyFx(r.fx);hud(); if(r.toast)toast(r.toast);
nextScene();window.scrollTo(0,0);});
}
/* ---------- battle ---------- */
function startBattle(sc){
const b=sc.battle;
battle={cfg:b,turn:1,ehp:b.enemyHp,ehpMax:b.enemyHp,
php:b.mode==="spar"?(26+stat("体力")*4):100,phpMax:b.mode==="spar"?(26+stat("体力")*4):100,
dealt:0,taken:0,leg:0,readBonus:0,control:0,readUsed:false,foul:false,sigUsed:false,
kataBonus:(S.vars.k1?1:0)+(S.vars.k2?1:0),log:[],cmtIdx:0,done:false};
(b.intro||[]).forEach(l=>battle.log.push({sp:l[0],tx:l[1]}));
pushComment(b);
}
function pushComment(b){const c=b.comments[battle.cmtIdx%b.comments.length];battle.cmtIdx++;
battle.log.push({sp:c[0],tx:c[1],cmt:true});}
function bLog(sp,tx){battle.log.push({sp,tx});}
function rnd(n){return Math.floor(Math.random()*(n+1));}
function renderBattle(sc,main){
if(!battle)startBattle(sc);
const b=sc.battle,bt=battle;
const playerBox=b.mode==="exam"
?`<div class="fighter"><div class="nm">ハヤト（${esc(S.style.name)}・初段受験）</div><div class="sub">組手の評価は「当てた量」と「立て直し」で決まる</div>
<div class="sub">型の評価ボーナス：+${bt.kataBonus} ／ 与えた有効打：<b>${bt.dealt}</b></div></div>`
:`<div class="fighter"><div class="nm">ハヤト（${esc(S.style.name)}）</div><div class="sub">体力</div>
<div class="bar hp"><i style="width:${Math.max(0,bt.php/bt.phpMax*100)}%"></i></div>
<div class="sub">HP ${Math.max(0,bt.php)} ／ ${bt.phpMax}</div></div>`;
const enemyBox=`<div class="fighter enemy"><div class="nm">${esc(b.enemy)}</div><div class="sub">${esc(b.enemySub||"")}</div>
<div class="bar ehp"><i style="width:${Math.max(0,bt.ehp/bt.ehpMax*100)}%"></i></div>
<div class="sub">HP ${Math.max(0,bt.ehp)} ／ ${bt.ehpMax}</div>
${b.mode==="spar"&&bt.leg>0?`<span class="legtag">脚への部位ダメージ ×${bt.leg}${bt.leg>=3?"（脚が止まっている）":bt.leg===2?"（出足が鈍い）":""}</span>`:""}</div>`;
const logHtml=bt.log.map(l=>l.cmt
?`<div class="bl cmt"><span class="sp">${esc(l.sp)}</span>${esc(fill(l.tx))}</div>`
:`<div class="bl"><span class="sp">${esc(l.sp)}</span>${esc(fill(l.tx))}</div>`).join("");
let actions="";
if(!bt.done){
actions=`<div class="turn-tag">${b.mode==="exam"?"組手 "+bt.turn+" / "+b.turns:"ラウンド進行 "+bt.turn+" / "+b.turns+"ターン"}</div>`+battleActions(b).map((a,i)=>`<button class="choice${a.danger?" danger":""}" data-a="${i}">${esc(fill(a.label))}${a.desc?`<small>${esc(fill(a.desc))}</small>`:""}</button>`).join("");
}else{
actions=`<button class="next" id="btn-after">結果を見る</button>`;
}
main.innerHTML=`<div class="scene-tag">${esc(sc.tag)}</div>
<div class="battle-head">${playerBox}${enemyBox}</div>
<p class="line sys">${esc(fill(b.actionsNote||""))}</p>
<div class="blog" id="blog">${logHtml}</div>${actions}`;
const blog=$("blog");blog.scrollTop=blog.scrollHeight;
if(!bt.done){main.querySelectorAll("[data-a]").forEach(btn=>btn.onclick=()=>{doAction(sc,Number(btn.dataset.a));renderBattle(sc,main);});}
else{$("btn-after").onclick=()=>{nextScene();window.scrollTo(0,0);};}
}
function battleActions(b){
const bt=battle;
if(b.mode==="exam")return[
{id:"base",label:"{流儀}の基本の一手",desc:"型で作った距離から、正確に当てる。"},
{id:"sig",label:"看板技 ― {看板技}",desc:bt.sigUsed?"もう一度は難しい。体が覚えている範囲で。":"渾身。決まれば評価は大きい。"},
{id:"recover",label:"受けて、立て直す",desc:"先輩の圧を受け、次の攻めの精度を上げる。"}];
const acts=[
{id:"strike",label:"突き系の一手で距離を刻む",desc:"打撃 "+stat("打撃")+"。こちらの距離を守る攻め。"},
{id:"kick",label:"蹴り系の一手で牽制する",desc:"蹴り "+stat("蹴り")+"。組み際の手前で止める。"},
{id:"grapple",label:"組み際へ踏み込む",desc:"組技 "+stat("組技")+"。相手の次の攻めも弱まる。"},
{id:"read",label:"様子見 ― 読みに徹する",desc:"このターンの被ダメージ半減。次の攻めが鋭くなる。相手の癖も見える。"},
{id:"leg",label:"相手の脚への攻撃",desc:"部位ダメージが蓄積する。脚が止まれば、組み際も遅くなる。"}];
if(bt.turn>=4)acts.push({id:"foul",label:"眼突き（反則）",desc:"勝ちに近づく一手。ただし、勝ち方を一生問われる。",danger:true});
return acts;
}
function doAction(sc,ai){
const b=sc.battle,bt=battle;const a=battleActions(b)[ai];let dmg=0;const R=rnd(3);
const mainStat=Math.max(stat("打撃"),stat("蹴り"));
if(b.mode==="exam"){
if(a.id==="base"){dmg=5+mainStat*2+bt.kataBonus*2+R+bt.readBonus;bt.readBonus=0;bLog("実況","正確な一手が先輩の腕をかすめ、距離の中で止まった。審査員のペンが動く。");}
if(a.id==="sig"){dmg=bt.sigUsed?(6+mainStat+R):(11+mainStat*2+bt.kataBonus*2+R);bt.sigUsed=true;bLog("実況","{看板技}――会場の空気が変わった。先輩が一歩下がって間合いを測り直す。");}
if(a.id==="recover"){dmg=2;bt.readBonus=5;bLog("実況","先輩の圧を体で受け、崩れかけた軸を立て直す。審査員の一人が小さく頷いた。");}
bt.dealt+=dmg;bt.ehp-=dmg;
if(rnd(1)===0)pushComment(b);
}else{
let enemyHalf=false;
if(a.id==="strike"){dmg=5+stat("打撃")*2+R+bt.readBonus;bt.readBonus=0;bLog("実況","突きが距離を刻む。凛は組みたくても、あと一歩が届かない。");}
if(a.id==="kick"){dmg=4+stat("蹴り")*2+R+bt.readBonus;bt.readBonus=0;bLog("実況","蹴りが組み際の手前で壁になる。観客席から小さく声が上がった。");}
if(a.id==="grapple"){dmg=3+stat("組技")*2+R+bt.readBonus;bt.readBonus=0;bt.control=3;bLog("実況","組み合い――力負けはしないが、柔道の組みの圧はやはり本物だった。");}
if(a.id==="read"){dmg=0;bt.readBonus=5;enemyHalf=true;
if(!bt.readUsed){bt.readUsed=true;bLog("実況","様子見。凛の入りの癖と、終盤に左脚をかばう動きが見えた。");}
else bLog("実況","読みに徹する。凛の呼吸の乱れまで見えてくる。");}
if(a.id==="leg"){dmg=2+stat("蹴り")+R;bt.leg=Math.min(3,bt.leg+1);
bLog("実況","脚への一撃。凛の出足が、わずかに重くなった。（脚への部位ダメージ "+bt.leg+"）");
battle.log.push({sp:"Tier職人ミラ",tx:"脚、来た。みんな見た？ この積み方が彼の勝ち筋。",cmt:true});}
if(a.id==="foul"){dmg=13;bt.foul=true;
bLog("実況","――手が、眼の前へ。凛が顔を背けた一瞬、流れが止まった。レフェリーの笛が、半拍遅れて鳴る。");
battle.log.push({sp:"観客",tx:"今の、何？ 眼じゃないの……？",cmt:true});
battle.log.push({sp:"三好レフェリー",tx:"警告です。次は反則負けにします。",cmt:true});}
bt.dealt+=dmg;bt.ehp-=dmg;
const finished=bt.ehp<=0;
if(!finished){
let ed=6+rnd(3)-bt.control-(bt.leg>=3?2:bt.leg===2?1:0);
if(enemyHalf)ed=Math.ceil(ed/2);
ed=Math.max(1,ed);bt.php-=ed;bt.taken+=ed;bt.control=0;
bLog("実況","凛の反撃。組み際の圧と崩しで、ハヤトに "+ed+" のダメージ。");
if(rnd(1)===0)pushComment(b);
}
}
bt.turn++;
const over=bt.ehp<=0||bt.php<=0||bt.turn>b.turns;
if(over)finishBattle(sc);
}
function finishBattle(sc){
const b=sc.battle,bt=battle;bt.done=true;
if(b.mode==="exam"){
const grade=bt.dealt>=52?"great":bt.dealt>=34?"pass":"barely";
S.vars.exam=grade;
if(grade==="great"){applyFx({sei:2,exp:8});toast("審査結果：優秀合格（清名 +2）");}
else if(grade==="pass"){applyFx({sei:1,exp:5});toast("審査結果：合格（清名 +1）");}
else{applyFx({exp:3});toast("審査結果：辛くも合格");}
applyFx({fatigue:8});
bLog("結果","組手審査 終了。有効打の合計 "+bt.dealt+"。合否は夕方の張り出しで――");
}else{
const winRatio=bt.ehp/bt.ehpMax<bt.php/bt.phpMax;
const win=bt.ehp<=0||(bt.php>0&&winRatio);
const key=bt.foul?(win?"foulwin":"foullose"):(win?"win":"lose");
S.vars.spar=key;
if(key==="win"){applyFx({sei:3,att:3,exp:8});toast("判定勝ち（清名 +3 ／ 注目 +3）");}
if(key==="lose"){applyFx({att:2,exp:6,fatigue:6});toast("判定負け（注目 +2 ／ 自分の弱点が漏れた）");}
if(key==="foulwin"){applyFx({sei:1,aku:3,att:4,exp:6});toast("判定勝ち――だが勝ち方が問われる（悪名 +3）",true);}
if(key==="foullose"){applyFx({aku:2,att:3,exp:5,fatigue:6});toast("判定負け＋警告（悪名 +2）",true);}
applyFx({fatigue:10});
bLog("結果","試合終了。判定は "+(win?"ハヤト":"相沢凛")+"。"+(bt.foul?"ただし、最終盤の一手への視線が、場に長く残った。":""));
}
hud();
}

function showTitle(){
S=newState();sceneIdx=0;lineIdx=0;battle=null;
