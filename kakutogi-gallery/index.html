<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新ゲーム 画像確認用ページ</title>
<style>
  body{margin:0;background:#10131c;color:#e8e6df;font-family:"Hiragino Sans","Noto Sans JP",sans-serif;}
  header{padding:20px 16px 6px;max-width:960px;margin:0 auto;}
  h1{font-size:20px;margin:0 0 6px;color:#e9c46a;}
  .note{color:#9aa0ae;font-size:13px;line-height:1.7;}
  main{max-width:960px;margin:0 auto;padding:10px 16px 40px;}
  .card{background:#171b28;border:1px solid #2a2f42;border-radius:12px;padding:14px;margin:16px 0;}
  .card img{width:100%;height:auto;display:block;border-radius:8px;background:#0b0d13;}
  .cap{margin-top:10px;font-size:14px;line-height:1.8;}
  .cap b{color:#e9c46a;}
  .tag{display:inline-block;background:#26304a;color:#cfd8ea;border-radius:999px;padding:2px 10px;font-size:12px;margin-right:6px;}
  footer{max-width:960px;margin:0 auto;padding:0 16px 30px;color:#6d7484;font-size:12px;}
</style>
</head>
<body>
<header>
  <h1>新ゲーム（異種格闘技育成SLG）画像確認用ページ</h1>
  <p class="note">制作した画像をここに集めて確認するためのページです。画像は見切れないよう全体表示にしています。追加の画像ができたらこのページに足していきます。</p>
</header>
<main>
  <div class="card">
    <img src="title-keyvisual.webp" alt="タイトル画面用キービジュアル：道着の青年と各流派の使い手たち、時計と砂時計">
    <div class="cap"><span class="tag">タイトル画面</span><span class="tag">見本に組込中</span><br>
    <b>タイトル・キービジュアル</b>（2026-11-05 制作）<br>
    19歳の主人公（道着・黒帯）を中央に、各流派の使い手のシルエットと、年月を表す時計・砂時計を配した一枚。紺×金×深紅。文字は入れず、タイトル文字は画面側で重ねる前提。</div>
  </div>
</main>
<footer>確認用ページ（新ゲーム制作）／収録 1点</footer>
</body>
</html>
